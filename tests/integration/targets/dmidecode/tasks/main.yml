- name: Run dmidecode module
  o0_o.posix.dmidecode:
  register: dmidecode_result_reg
  ignore_errors: true

- name: Verify module returns without exception
  ansible.builtin.assert:
    that:
      - dmidecode_result_reg is defined
    fail_msg: 'dmidecode module raised an exception'

- name: Display result status
  ansible.builtin.debug:
    msg: >-
      dmidecode {{ 'succeeded' if not dmidecode_result_reg['failed']
      else 'failed (expected on systems without root or dmidecode)' }}
