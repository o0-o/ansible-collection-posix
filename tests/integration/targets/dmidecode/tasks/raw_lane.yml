# This target's entry into the raw lane, per Running CI. The whole
# target is one module call and the assertions on what it read, all
# of it raw-clean and none of it reading a gathered fact, so the
# entry is main.yml under no vars of its own.
#
# A host that has no dmidecode reads nothing and says so, which the
# target already allows for, so an interpreter-free guest without the
# command is a pass rather than a gap.

- name: Read the firmware tables on a host with no interpreter
  ansible.builtin.include_tasks: main.yml
