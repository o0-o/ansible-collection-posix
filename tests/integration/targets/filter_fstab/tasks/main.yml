# The fixture is a string the filter parses on the controller, and the
# filter never asks a host anything, so the string is read where it
# lives. A slurp of role_path would have shipped a controller path to
# the target and read it there, which only finds the file at all when
# the two are the same machine.
- name: Read the test fstab file
  ansible.builtin.set_fact:
    fstab_text: "{{ lookup('file', role_path + '/files/test.fstab') }}"

# A slurp answers in base64 whatever the file held, and the filter is
# expected to meet that shape whoever hands it over. The shape is what
# is under test, so it is built rather than fetched.
- name: Name the shape a slurp of that file would have handed back
  ansible.builtin.set_fact:
    fstab_slurp_shape:
      content: "{{ fstab_text | b64encode }}"
      encoding: base64

- name: Test basic fstab parsing
  block:
    - name: Parse fstab content
      ansible.builtin.set_fact:
        fstab_parsed: "{{ fstab_text | o0_o.posix.fstab }}"

    - name: Assert parsing results
      ansible.builtin.assert:
        that:
          - fstab_parsed is sequence
          - fstab_parsed | length == 13
          - fstab_parsed[0]['source'] == '/dev/sda1'
          - fstab_parsed[0]['mount'] == '/'
          - fstab_parsed[0]['type'] == 'ext4'
          - fstab_parsed[0]['options'][0]['defaults'] == true
          - fstab_parsed[0]['options'][1]['noatime'] == true
          - fstab_parsed[0]['dump'] == 0
          - fstab_parsed[0]['pass'] == 1

    - name: Parse the slurp shape of the same file
      ansible.builtin.set_fact:
        fstab_from_slurp_shape: "{{ fstab_slurp_shape | o0_o.posix.fstab }}"

    - name: Assert the slurp shape parses to the same entries
      ansible.builtin.assert:
        that:
          - fstab_from_slurp_shape == fstab_parsed
        fail_msg: >-
          An always-base64 content dict should parse to what the same
          text parses to

- name: Test specific mount entries
  block:
    - name: Find root filesystem in parsed fstab
      ansible.builtin.set_fact:
        root_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/')
             | first }}

    - name: Assert root filesystem details
      ansible.builtin.assert:
        that:
          - root_mount['source'] == '/dev/sda1'
          - root_mount['type'] == 'ext4'
          - root_mount['options'][0]['defaults'] == true
          - root_mount['options'][1]['noatime'] == true
          - root_mount['dump'] == 0
          - root_mount['pass'] == 1

    - name: Find boot filesystem in parsed fstab
      ansible.builtin.set_fact:
        boot_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/boot')
             | first }}

    - name: Assert boot filesystem with UUID
      ansible.builtin.assert:
        that:
          - boot_mount['source'] == 'UUID=abc-123'
          - boot_mount['type'] == 'ext2'
          - boot_mount['dump'] == 1
          - boot_mount['pass'] == 2

    - name: Find tmpfs in parsed fstab
      ansible.builtin.set_fact:
        tmp_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/tmp')
             | first }}

    - name: Assert virtual filesystem (tmpfs)
      ansible.builtin.assert:
        that:
          - tmp_mount['source'] == 'tmpfs'
          - tmp_mount['type'] == 'tmpfs'

    - name: Find proc filesystem in parsed fstab
      ansible.builtin.set_fact:
        proc_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/proc')
             | first }}

    - name: Assert pseudo filesystem (proc)
      ansible.builtin.assert:
        that:
          - proc_mount['source'] == 'proc'
          - proc_mount['type'] == 'proc'

    - name: Find NFS mount in parsed fstab
      ansible.builtin.set_fact:
        nfs_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/mnt/nfs')
             | first }}

    - name: Assert network filesystem (NFS)
      ansible.builtin.assert:
        that:
          - nfs_mount['source'] == 'nfs-server:/export/home'
          - nfs_mount['type'] == 'nfs'

    - name: Find CIFS mount in parsed fstab
      ansible.builtin.set_fact:
        smb_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/mnt/smb')
             | first }}

    - name: Assert network filesystem (CIFS/SMB)
      ansible.builtin.assert:
        that:
          - smb_mount['source'] == '//smb-server/share'
          - smb_mount['type'] == 'cifs'

    - name: Find swap entry in parsed fstab
      ansible.builtin.set_fact:
        swap_mount: >-
          {{ fstab_parsed
             | selectattr('type', 'equalto', 'swap')
             | first }}

    - name: Assert swap entry
      ansible.builtin.assert:
        that:
          - swap_mount['source'] == '/dev/sda3'
          - swap_mount['mount'] is none  # mount should be None for swap
          - swap_mount['type'] == 'swap'
          - swap_mount['options'][0]['sw'] == true

    - name: Find bind mount in parsed fstab
      ansible.builtin.set_fact:
        bind_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/newdir')
             | first }}

    - name: Assert bind mount
      ansible.builtin.assert:
        that:
          - bind_mount['source'] == '/olddir'
          - bind_mount['type'] == 'none'
          - bind_mount['options'][0]['bind'] == true

    - name: Find FUSE filesystem in parsed fstab
      ansible.builtin.set_fact:
        sshfs_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/mnt/ssh')
             | first }}

    - name: Assert FUSE filesystem (sshfs)
      ansible.builtin.assert:
        that:
          - sshfs_mount['source'] == 'sshfs#user@host:/path'
          - sshfs_mount['type'] == 'fuse.sshfs'

    - name: Find overlay filesystem in parsed fstab
      ansible.builtin.set_fact:
        overlay_mount: >-
          {{ fstab_parsed
             | selectattr('mount', 'equalto', '/var/docker')
             | first }}

    - name: Assert overlay filesystem
      ansible.builtin.assert:
        that:
          - overlay_mount['type'] == 'overlay'
          # Check for lowerdir and upperdir in options
          - >-
            {{ overlay_mount['options']
               | selectattr('lowerdir', 'defined')
               | list | length > 0 }}
          - >-
            {{ overlay_mount['options']
               | selectattr('upperdir', 'defined')
               | list | length > 0 }}

- name: Test bidirectional conversion
  block:
    - name: Parse fstab and store entries
      ansible.builtin.set_fact:
        parsed_entries: "{{ fstab_text | o0_o.posix.fstab }}"

    - name: Generate fstab from parsed entries
      ansible.builtin.set_fact:
        regenerated_fstab: "{{ parsed_entries | o0_o.posix.fstab }}"

    - name: Display regenerated fstab
      ansible.builtin.debug:
        msg: "{{ regenerated_fstab }}"

    - name: Parse the regenerated fstab
      ansible.builtin.set_fact:
        reparsed_entries: "{{ regenerated_fstab | o0_o.posix.fstab }}"

    - name: Assert entries remain consistent after round-trip
      ansible.builtin.assert:
        that:
          - parsed_entries == reparsed_entries
          - regenerated_fstab is string
          - regenerated_fstab | length > 0

- name: Test generation from custom entries
  block:
    - name: Define custom mount entries
      ansible.builtin.set_fact:
        custom_entries:
          - source: /dev/vda1
            mount: /
            type: xfs
            options:
              - defaults: true
              - noatime: true
            dump: 0
            pass: 1
          - source: UUID=test-uuid
            mount: /data
            type: ext4
            options:
              - defaults: true
              - noexec: true
              - nosuid: true
            dump: 1
            pass: 2
          - source: tmpfs
            mount: /run
            type: tmpfs
            options:
              - defaults: true
              - size: "50%"
            dump: 0
            pass: 0

    - name: Generate fstab from custom entries
      ansible.builtin.set_fact:
        custom_fstab: "{{ custom_entries | o0_o.posix.fstab }}"

    - name: Assert generated fstab contains expected content
      ansible.builtin.assert:
        that:
          - custom_fstab is string
          - '"/dev/vda1" in custom_fstab'
          - '"xfs" in custom_fstab'
          - '"defaults,noatime" in custom_fstab'
          - '"UUID=test-uuid" in custom_fstab'
          - '"defaults,noexec,nosuid" in custom_fstab'
          - '"tmpfs" in custom_fstab'
          - '"size=50%" in custom_fstab'

    - name: Parse generated fstab back to entries
      ansible.builtin.set_fact:
        parsed_custom: "{{ custom_fstab | o0_o.posix.fstab }}"

    - name: Assert parsed entries match original
      ansible.builtin.assert:
        that:
          - parsed_custom | length == 3
          - parsed_custom[0]['source'] == '/dev/vda1'
          - parsed_custom[0]['type'] == 'xfs'
          - parsed_custom[1]['source'] == 'UUID=test-uuid'
          - parsed_custom[1]['mount'] == '/data'
          - parsed_custom[2]['type'] == 'tmpfs'

- name: Test with command output format
  block:
    - name: Parse fstab as command output
      ansible.builtin.set_fact:
        fstab_cmd_result:
          stdout: "{{ fstab_text }}"
          rc: 0

    - name: Parse command output
      ansible.builtin.set_fact:
        fstab_from_cmd: "{{ fstab_cmd_result | o0_o.posix.fstab }}"

    - name: Assert command output parsing
      ansible.builtin.assert:
        that:
          - fstab_from_cmd is sequence
          - fstab_from_cmd | length == 13
          - fstab_from_cmd[0]['source'] == '/dev/sda1'
          - fstab_from_cmd[0]['mount'] == '/'

- name: Test with list input format
  block:
    - name: Parse fstab content directly (without splitting)
      ansible.builtin.set_fact:
        fstab_from_string: "{{ fstab_text | o0_o.posix.fstab }}"

    - name: Assert parsing results
      ansible.builtin.assert:
        that:
          - fstab_from_string is sequence
          - fstab_from_string | length == 13

- name: Test empty fstab
  block:
    - name: Parse empty fstab
      ansible.builtin.set_fact:
        empty_fstab: "{{ '' | o0_o.posix.fstab }}"

    - name: Assert empty result
      ansible.builtin.assert:
        that:
          - empty_fstab == []

- name: Test fstab with only comments
  block:
    - name: Parse fstab with only comments
      ansible.builtin.set_fact:
        comment_only_fstab: |
          # This is a comment
          # Another comment

          # Yet another comment

    - name: Parse comment-only fstab
      ansible.builtin.set_fact:
        comment_result: "{{ comment_only_fstab | o0_o.posix.fstab }}"

    - name: Assert empty result for comments
      ansible.builtin.assert:
        that:
          - comment_result == []

# Every case above hands the filter a string this play already had.
# This one puts a file on the host and asks the host for it back, so
# what the filter meets is a result some other module actually
# produced rather than a shape written down here.
- name: Test the content shapes a read of a real file hands back
  block:
    - name: Name the content the test file will hold
      ansible.builtin.set_fact:
        fstab_written: |
          /dev/sda1   /       ext4    defaults,noatime   0   1
          /dev/sda2   /home   ext4    defaults           0   2
          tmpfs       /tmp    tmpfs   defaults,size=2G   0   0

    - name: Create a test fstab file
      o0_o.posix.write:
        dest: /tmp/test_fstab_for_read
        content: "{{ fstab_written }}"
        mode: '0644'

    - name: Read the test fstab file
      o0_o.posix.read:
        path: /tmp/test_fstab_for_read
        content: true
      register: read_fstab_reg

    - name: Name the result that declares text
      ansible.builtin.set_fact:
        text_fstab: "{{ read_fstab_reg['paths']['/tmp/test_fstab_for_read'] }}"

    # read reports the file's bytes as they stand, terminator included,
    # so what was written is what comes back rather than a trimmed
    # rendering of it
    - name: Assert the read hands back the bytes that were written
      ansible.builtin.assert:
        that:
          - text_fstab['content'] == fstab_written
        fail_msg: >-
          read should report the file's bytes as they stand

    - name: Parse the read result
      ansible.builtin.set_fact:
        parsed_from_read: "{{ text_fstab | o0_o.posix.fstab }}"

    - name: Assert the read result was parsed
      ansible.builtin.assert:
        that:
          - parsed_from_read is sequence
          - parsed_from_read | length == 3
          - parsed_from_read[0]['source'] == '/dev/sda1'
          - parsed_from_read[0]['mount'] == '/'
          - parsed_from_read[0]['type'] == 'ext4'
          - parsed_from_read[1]['source'] == '/dev/sda2'
          - parsed_from_read[1]['mount'] == '/home'
          - parsed_from_read[2]['source'] == 'tmpfs'
          - parsed_from_read[2]['mount'] == '/tmp'
          - parsed_from_read[2]['type'] == 'tmpfs'

    - name: Name the base64 shape of what the read returned
      ansible.builtin.set_fact:
        content_dict:
          content: "{{ text_fstab['content'] | b64encode }}"
          encoding: base64

    - name: Parse content dict
      ansible.builtin.set_fact:
        parsed_content_dict: "{{ content_dict | o0_o.posix.fstab }}"

    - name: Assert content dict parsing works
      ansible.builtin.assert:
        that:
          - parsed_content_dict == parsed_from_read

    - name: Parse the content string on its own
      ansible.builtin.set_fact:
        parsed_decoded: "{{ text_fstab['content'] | o0_o.posix.fstab }}"

    - name: Assert the bare string parses to the same entries
      ansible.builtin.assert:
        that:
          - parsed_decoded == parsed_from_read

    # Base64 is a shape any reader of a file might answer in; hex has
    # exactly one producer here, and it is asked for by name
    - name: Read the test fstab file as hex
      o0_o.posix.read:
        path: /tmp/test_fstab_for_read
        encoding: hex
      register: read_hex_fstab_reg

    - name: Name the result that declares hex
      ansible.builtin.set_fact:
        hex_fstab: >-
          {{ read_hex_fstab_reg['paths']['/tmp/test_fstab_for_read'] }}

    - name: Parse hex encoded content from read
      ansible.builtin.set_fact:
        parsed_from_hex: "{{ hex_fstab | o0_o.posix.fstab }}"

    - name: Assert hex content was properly decoded and parsed
      ansible.builtin.assert:
        that:
          - hex_fstab['encoding'] == 'hex'
          - parsed_from_hex == parsed_from_read

  always:
    - name: Clean up test file
      o0_o.posix.write:
        dest: /tmp/test_fstab_for_read
        state: absent
