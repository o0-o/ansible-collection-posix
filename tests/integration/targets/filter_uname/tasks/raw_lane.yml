# This target's entry into the raw lane, per Running CI. The filter
# keeps a hand parse for the systems jc's uname parser does not read,
# and OpenBSD is the system it was written for; until now it had only
# ever been held to a string written down in a test. Here it answers
# for a uname the guest printed itself.
#
# The short string that fallback exists for still names every field
# the target asserts on -- kernel, release, architecture and node --
# so there is nothing for a platform gate to decide between, and the
# entry is the whole target under no vars of its own.

- name: Parse a uname from a host with no interpreter
  ansible.builtin.include_tasks: main.yml
