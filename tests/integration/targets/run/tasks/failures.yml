- name: Skip for check_mode
  when: not ansible_check_mode
  block:

    - name: 'Fail: Test fail_fast with sequential execution'
      block:

        - name: Run commands with fail_fast (sequential)
          o0_o.posix.run:
            commands:
              - echo before
              - 'false'
              - echo after
            fail_fast: true

      rescue:

        - name: Assert fail_fast stopped execution
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed
              # fail_fast uses shell's set -e which exits immediately,
              # causing output parsing to fail
              - "'Batch execution error' in ansible_failed_result['msg']"

    - name: 'Fail: Test command failure without fail_fast'
      block:

        - name: Run commands with one failure (no fail_fast)
          o0_o.posix.run:
            commands:
              - echo first
              - 'false'
              - echo third
            parallel: false
            fail_fast: false

      rescue:

        - name: Assert all commands ran despite failure
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed
              - ansible_failed_result['commands'] | length == 3
              - ansible_failed_result['commands'][0]['rc'] == 0
              - ansible_failed_result['commands'][1]['rc'] != 0
              - ansible_failed_result['commands'][2]['rc'] == 0
              - >-
                ansible_failed_result['commands'][0]['stdout'] | trim
                == 'first'
              - >-
                ansible_failed_result['commands'][2]['stdout'] | trim
                == 'third'

    - name: 'Fail: Test nonexistent command'
      block:

        - name: Run nonexistent command
          o0_o.posix.run:
            commands:
              - nonexistent_command_xyz123

      rescue:

        - name: Assert nonexistent command failed
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed
              - ansible_failed_result['commands'][0]['rc'] != 0

    - name: 'Fail: Test invalid chdir'
      block:

        - name: Run command with invalid chdir
          o0_o.posix.run:
            commands:
              - echo test
            chdir: /nonexistent/directory

      rescue:

        - name: Assert chdir failure
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed

- name: 'Fail: Test missing commands parameter'
  block:

    - name: Run without commands parameter
      o0_o.posix.run:
        parallel: false

  rescue:

    - name: Assert missing commands parameter
      ansible.builtin.assert:
        that:
          - ansible_failed_result is failed
          - "'required' in ansible_failed_result['msg'] | lower"
