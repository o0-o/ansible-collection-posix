- name: Check mode permutation loop
  block:

    - name: Run success tests
      ansible.builtin.include_tasks: successes.yml
      loop: [true, false]
      vars:
        ansible_check_mode: "{{ item }}"

    - name: Run parallel execution tests
      ansible.builtin.include_tasks: parallel.yml
      loop: [true, false]
      vars:
        ansible_check_mode: "{{ item }}"

    - name: Run failures tests
      ansible.builtin.include_tasks: failures.yml
      loop: [true, false]
      vars:
        ansible_check_mode: "{{ item }}"

    - name: Run dict mode tests
      ansible.builtin.include_tasks: dict_mode.yml
      loop: [true, false]
      vars:
        ansible_check_mode: "{{ item }}"
