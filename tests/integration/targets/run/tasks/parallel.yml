- name: Skip for check_mode
  when: not ansible_check_mode
  block:

    - name: Test parallel execution (default)
      o0_o.posix.run:
        commands:
          - sleep 0.5; echo one
          - sleep 0.5; echo two
          - sleep 0.5; echo three
      register: parallel_default_reg

    - name: Assert parallel execution completed all commands
      ansible.builtin.assert:
        that:
          - parallel_default_reg['commands'] | length == 3
          - parallel_default_reg['commands'][0]['rc'] == 0
          - parallel_default_reg['commands'][1]['rc'] == 0
          - parallel_default_reg['commands'][2]['rc'] == 0
          - parallel_default_reg['commands'][0]['stdout'] | trim == 'one'
          - parallel_default_reg['commands'][1]['stdout'] | trim == 'two'
          - parallel_default_reg['commands'][2]['stdout'] | trim == 'three'
    - name: Assert timing fields present on each command
      ansible.builtin.assert:
        that:
          - parallel_default_reg['commands'][0]['elapsed'] is defined
          - parallel_default_reg['commands'][1]['elapsed'] is defined
          - parallel_default_reg['commands'][2]['elapsed'] is defined

    - name: Test explicit parallel execution
      o0_o.posix.run:
        commands:
          - echo parallel_1
          - echo parallel_2
          - echo parallel_3
        parallel: true
      register: parallel_explicit_reg

    - name: Assert explicit parallel execution
      ansible.builtin.assert:
        that:
          - parallel_explicit_reg['commands'] | length == 3
          - >-
            parallel_explicit_reg['commands'][0]['stdout'] | trim
            == 'parallel_1'
          - >-
            parallel_explicit_reg['commands'][1]['stdout'] | trim
            == 'parallel_2'
          - >-
            parallel_explicit_reg['commands'][2]['stdout'] | trim
            == 'parallel_3'
    - name: Test sequential execution (parallel=false)
      o0_o.posix.run:
        commands:
          - sleep 0.3; echo seq_1
          - sleep 0.3; echo seq_2
          - sleep 0.3; echo seq_3
        parallel: false
      register: sequential_reg

    - name: Assert sequential execution completed
      ansible.builtin.assert:
        that:
          - sequential_reg['commands'] | length == 3
          - sequential_reg['commands'][0]['stdout'] | trim == 'seq_1'
          - sequential_reg['commands'][1]['stdout'] | trim == 'seq_2'
          - sequential_reg['commands'][2]['stdout'] | trim == 'seq_3'
    - name: 'Fail: Test parallel with mixed success/failure'
      block:

        - name: Test parallel with mixed success/failure
          o0_o.posix.run:
            commands:
              - echo success_1
              - 'false'
              - echo success_2
            parallel: true

      rescue:

        - name: Assert parallel mixed results
          ansible.builtin.assert:
            that:
              - ansible_failed_result is failed
              - ansible_failed_result['commands'] | length == 3
              - ansible_failed_result['commands'][0]['rc'] == 0
              - ansible_failed_result['commands'][1]['rc'] != 0
              - ansible_failed_result['commands'][2]['rc'] == 0
              - >-
                ansible_failed_result['commands'][0]['stdout'] | trim
                == 'success_1'
              - >-
                ansible_failed_result['commands'][2]['stdout'] | trim
                == 'success_2'
