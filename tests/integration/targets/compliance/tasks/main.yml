- name: Run compliance module
  o0_o.posix.compliance:
  register: compliance_result_reg

- name: Verify basic output structure
  ansible.builtin.assert:
    that:
      - compliance_result_reg is defined
      - compliance_result_reg['changed'] == false
      - compliance_result_reg['msg'] is defined
      - compliance_result_reg['msg'] is string
      - compliance_result_reg['compliance'] is defined
      - compliance_result_reg['compliance'] is mapping
      - compliance_result_reg['paths'] is defined
      - compliance_result_reg['paths'] is mapping
      - compliance_result_reg['missing_commands'] is defined
      - compliance_result_reg['missing_commands'] is sequence
      # What the shell says about itself is on the shell's own entry
      - compliance_result_reg['shells'] is mapping
    fail_msg: 'Compliance module did not return expected structure'

# A command that resolved is a fact about the file it resolved to and
# a command that did not is a null at its name in each directory the
# resolutions show were searched. A command the shell answers itself
# resolved to no file, so it is a fact about the shell instead.
- name: Verify the path store holds what the probes observed
  vars:
    paths: "{{ compliance_result_reg['paths'] }}"
    resolved: >-
      {{ paths | dict2items | selectattr('value', 'mapping')
         | selectattr('value.executable', 'defined') | list }}
  ansible.builtin.assert:
    that:
      - paths.keys() | reject('match', '^/') | list | length == 0
      # The shell ran the probes, so it is never one of the misses
      - paths['/bin/sh'] is mapping
      - "'builtins' not in paths['/bin/sh']"
      - "'aliases' not in paths['/bin/sh']"
      - resolved | length > 0
      - resolved | rejectattr('value.executable') | list | length == 0
    fail_msg: 'the path store is not what the probes observed'

# A builtin resolves to no file, so it is intrinsic to the shell
# binary rather than a fact about any path.
- name: Verify the builtins land on the shell that answers them
  vars:
    shells: "{{ compliance_result_reg['shells'] }}"
  ansible.builtin.assert:
    that:
      - shells.keys() | list == ['/bin/sh']
      - shells['/bin/sh']['builtins'] is sequence
      - shells['/bin/sh']['builtins'] is not string
      - "'command' in shells['/bin/sh']['builtins']"
      - >-
        shells['/bin/sh']['builtins'] | sort
        == shells['/bin/sh']['builtins']
    fail_msg: 'the builtins are not on the shell that answered them'

# The commands a host lacks are read back out of the standards that
# require them, rather than stored a second time.
- name: Verify the missing list is the standards it derives from
  vars:
    recorded: >-
      {{ (compliance_result_reg['compliance']['xcu']['missing']
          + compliance_result_reg['compliance']['xsi']['missing'])
         | unique | sort }}
  ansible.builtin.assert:
    that:
      - compliance_result_reg['missing_commands'] == recorded
    fail_msg: >-
      missing_commands does not derive from the standards:
      {{ compliance_result_reg['missing_commands'] }} vs {{ recorded }}

# Every verdict names what decided it, and a miss is evidenced by the
# lookup that missed rather than filed among the evidence itself.
- name: Verify every verdict names the evidence that decided it
  vars:
    compliance: "{{ compliance_result_reg['compliance'] }}"
    standards: >-
      {{ ['posix', 'sus', 'xcu', 'xsh', 'xsi']
         | map('extract', compliance) | list }}
    consulted: >-
      {{ standards | map(attribute='evidence.commands') | flatten }}
    read: >-
      {{ standards | map(attribute='evidence.config')
         | map('dict2items') | flatten }}
    # The two standards that require utilities, and whether either
    # records a miss at all
    missed: "{{ compliance_result_reg['missing_commands'] }}"
  ansible.builtin.assert:
    that:
      # Both kinds compliance attempts, on every standard; the kind it
      # does not attempt is absent rather than carried empty
      - standards | rejectattr('evidence.commands', 'defined')
        | list | length == 0
      - standards | rejectattr('evidence.config', 'defined')
        | list | length == 0
      - standards | selectattr('evidence.files', 'defined')
        | list | length == 0
      # A command is the name it is known by, sorted and once each -
      # the getconf that asked, and the command -v that missed
      - consulted | reject('string') | list | length == 0
      - consulted | reject('in', ['command', 'getconf'])
        | list | length == 0
      - compliance['xsi']['evidence']['commands']
        == compliance['xsi']['evidence']['commands'] | unique | sort
      # A lookup is named where a miss was recorded and nowhere else
      - ('command' in consulted) == (missed | length > 0)
      # A configuration variable is named as getconf names it, and
      # valued as o0_os.config values one - nothing coerced on the way
      # in, and a limit is never a flag
      - read | map(attribute='key')
        | reject('match', '^_?[A-Z][A-Z0-9_]*$') | list | length == 0
      - read | map(attribute='value') | select('boolean')
        | list | length == 0
      - read | map(attribute='value') | reject('integer')
        | reject('string') | reject('none') | list | length == 0
      # The namespace's own verdict names its own probe
      - compliance['sh_posix_compliant'] is boolean
      - compliance['evidence']['commands'] == ['sh']
      - compliance['evidence']['config'] is not defined
    fail_msg: >-
      a compliance verdict does not name what decided it:
      {{ consulted }}

# A name that cannot be a file names no candidate path, so only a
# miss of something a directory could hold has a null to file.
- name: Verify a miss files a null at each candidate path
  when: >-
    compliance_result_reg['missing_commands']
    | reject('in', ['.', '..']) | list | length > 0
  vars:
    absent: >-
      {{ compliance_result_reg['paths'] | dict2items
         | selectattr('value', 'none') | map(attribute='key') | list }}
    names: >-
      {{ absent | map('basename') | unique | sort }}
  ansible.builtin.assert:
    that:
      - absent | length > 0
      - names | reject('in', compliance_result_reg['missing_commands'])
        | list | length == 0
    fail_msg: >-
      a miss did not file a confirmed absence at a path: {{ absent }}

- name: Verify compliance dict contains all standards
  ansible.builtin.assert:
    that:
      - compliance_result_reg['compliance']['xsh'] is defined
      - compliance_result_reg['compliance']['xcu'] is defined
      - compliance_result_reg['compliance']['xsi'] is defined
      - compliance_result_reg['compliance']['posix'] is defined
      - compliance_result_reg['compliance']['sus'] is defined
    fail_msg: 'Compliance dict missing required standard keys'

- name: Verify standard metadata fields
  ansible.builtin.assert:
    that:
      - compliance_result_reg['compliance']['xsh']['name'] is defined
      - compliance_result_reg['compliance']['xsh']['abbreviation'] == 'XSH'
      - compliance_result_reg['compliance']['xcu']['abbreviation'] == 'XCU'
      - compliance_result_reg['compliance']['xsi']['abbreviation'] == 'XSI'
      - compliance_result_reg['compliance']['posix']['abbreviation'] == 'POSIX'
      - compliance_result_reg['compliance']['sus']['abbreviation'] == 'SUS'
    fail_msg: 'Standard metadata fields missing or incorrect'

- name: Verify support fields exist
  ansible.builtin.assert:
    that:
      - compliance_result_reg['compliance']['xsh']['supported'] is defined
      - compliance_result_reg['compliance']['xcu']['supported'] is defined
      - compliance_result_reg['compliance']['xsi']['supported'] is defined
      - compliance_result_reg['compliance']['posix']['supported'] is defined
      - compliance_result_reg['compliance']['sus']['supported'] is defined
      - compliance_result_reg['compliance']['sh_posix_compliant']
        is boolean
    fail_msg: 'Support fields missing from compliance standards'

- name: Run in check mode
  o0_o.posix.compliance:
  check_mode: true
  register: compliance_check_reg

- name: Verify check mode works
  ansible.builtin.assert:
    that:
      - compliance_check_reg is defined
      - compliance_check_reg['changed'] == false
      - compliance_check_reg['compliance'] is defined
      - compliance_check_reg['paths'] is defined
      - compliance_check_reg['missing_commands'] is defined
    fail_msg: 'Compliance module did not work in check mode'

- name: Verify check mode returns same results
  ansible.builtin.assert:
    that:
      - >-
        compliance_check_reg['compliance']['posix']['supported']
        == compliance_result_reg['compliance']['posix']['supported']
      - >-
        compliance_check_reg['compliance']['sus']['supported']
        == compliance_result_reg['compliance']['sus']['supported']
    fail_msg: 'Check mode returned different results than normal mode'

- name: Display compliance info
  ansible.builtin.debug:
    msg: >-
      {{ compliance_result_reg['msg'] }}

- name: Display detailed compliance
  ansible.builtin.debug:
    var: compliance_result_reg['compliance']
    verbosity: 1

- name: Display command inventory
  ansible.builtin.debug:
    msg:
      shell: "{{ compliance_result_reg['paths']['/bin/sh'] }}"
      paths_count: "{{ compliance_result_reg['paths'] | length }}"
      missing: "{{ compliance_result_reg['missing_commands'] }}"
    verbosity: 1

- name: Run with gather enabled
  o0_o.posix.compliance:
    gather: true
  register: compliance_gather_reg

- name: Verify gather sets ansible_facts
  vars:
    facts_var: "{{ compliance_gather_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - facts_var is defined
      - facts_var is mapping
      - facts_var['o0_os'] is defined
      - facts_var['o0_os']['compliance'] is defined
      - facts_var['o0_os']['shells'] is not defined
      - facts_var['o0_paths'] is defined
      - facts_var['o0_paths']['/bin/sh'] is defined
      - facts_var['o0_missing'] is not defined
    fail_msg: 'gather option did not set ansible_facts correctly'

- name: Verify gathered facts match direct results
  ansible.builtin.assert:
    that:
      - >-
        compliance_gather_reg['ansible_facts']['o0_os']['compliance']
        == compliance_gather_reg['compliance']
      - >-
        compliance_gather_reg['ansible_facts']['o0_paths']
        == compliance_gather_reg['paths']
    fail_msg: 'Gathered facts do not match direct return values'

- name: Verify facts are accessible after gather
  ansible.builtin.assert:
    that:
      - o0_os['compliance'] is defined
      - o0_paths is defined
      - o0_paths['/bin/sh'] is defined
    fail_msg: 'Facts not accessible in hostvars after gather'

- name: Run without gather (default)
  o0_o.posix.compliance:
  register: compliance_no_gather_reg

- name: Verify no ansible_facts without gather
  ansible.builtin.assert:
    that:
      - compliance_no_gather_reg['ansible_facts'] is not defined
    fail_msg: 'ansible_facts should not be set when gather is false'
