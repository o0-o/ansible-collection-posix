# This target's entry into the raw lane, per Running CI. Every process
# listing main.yml takes comes through this collection's own module,
# and the process it samples is one the listing named rather than one
# a gathered fact promised, so the entry is main.yml under no vars of
# its own.
#
# The check mode case is a task carrying its own keyword, not a loop.
# It asserts that check mode withholds the listing, which is as true
# over the raw path as over the interpreted one.

- name: List processes on a host with no interpreter
  ansible.builtin.include_tasks: main.yml
