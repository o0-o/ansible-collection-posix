- name: Read predefined mount output
  ansible.builtin.set_fact:
    mount_output: "{{ lookup('file', 'mount_output.txt') }}"

- name: Parse mount output
  ansible.builtin.set_fact:
    mount_parsed: "{{ mount_output | o0_o.posix.mount }}"

- name: Debug parsed output
  ansible.builtin.debug:
    var: mount_parsed

- name: Verify mount output structure
  ansible.builtin.assert:
    that:
      - mount_parsed is sequence
      - mount_parsed | length == 6
      - mount_parsed[0].source == '/dev/sda1'
      - mount_parsed[0].mount == '/'
      - mount_parsed[0].type == 'ext4'
      - mount_parsed[0].options is mapping
    fail_msg: >-
      Mount parsed structure incorrect:
      {{ mount_parsed }}

- name: Verify root filesystem entry
  vars:
    root_mount: >-
      {{ mount_parsed
         | selectattr('mount', 'equalto', '/')
         | first }}
  ansible.builtin.assert:
    that:
      - root_mount.source == '/dev/sda1'
      - root_mount.type == 'ext4'
      - root_mount.options.writable == true  # rw normalized
      - root_mount.options.relatime == true
      - root_mount.options.errors == 'remount-ro'
    fail_msg: >-
      Root mount incorrect:
      {{ root_mount }}

- name: Verify proc filesystem entry
  vars:
    proc_mount: >-
      {{ mount_parsed
         | selectattr('mount', 'equalto', '/proc')
         | first }}
  ansible.builtin.assert:
    that:
      - proc_mount.source == 'proc'
      - proc_mount.type == 'proc'
      - proc_mount.options.writable == true  # rw normalized
      - proc_mount.options.suid == false      # nosuid normalized
      - proc_mount.options.dev == false       # nodev normalized
      - proc_mount.options.exec == false      # noexec normalized
    fail_msg: >-
      Proc mount incorrect:
      {{ proc_mount }}

- name: Verify NFS mount entry
  vars:
    nfs_mount: >-
      {{ mount_parsed
         | selectattr('mount', 'equalto', '/mnt/nfs')
         | first }}
  ansible.builtin.assert:
    that:
      - nfs_mount.source == 'server:/export'
      - nfs_mount.type == 'nfs'
      - nfs_mount.options.writable == true   # rw normalized
      - nfs_mount.options.vers == '4.2'
      - nfs_mount.options.rsize == '1048576'
      - nfs_mount.options.wsize == '1048576'
    fail_msg: >-
      NFS mount incorrect:
      {{ nfs_mount }}

- name: Test with multiline string input
  vars:
    mount_lines: |
      /dev/sda1 on / type ext4 (rw,relatime,errors=remount-ro)
      proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)
  ansible.builtin.set_fact:
    mount_from_multiline: "{{ mount_lines | o0_o.posix.mount }}"

- name: Verify multiline string input works
  ansible.builtin.assert:
    that:
      - mount_from_multiline is sequence
      - mount_from_multiline | length == 2
      - mount_from_multiline[0].source == '/dev/sda1'
      - mount_from_multiline[1].source == 'proc'

- name: Test with command result dict
  vars:
    command_result:
      stdout: "/dev/sda1 on / type ext4 (rw,relatime)"
      stderr: ""
      rc: 0
  ansible.builtin.set_fact:
    mount_from_dict: "{{ command_result | o0_o.posix.mount }}"

- name: Verify dict input works
  ansible.builtin.assert:
    that:
      - mount_from_dict is sequence
      - mount_from_dict | length == 1
      - mount_from_dict[0].source == '/dev/sda1'
      - mount_from_dict[0].mount == '/'

- name: Test with base64 encoded content (slurp result)
  vars:
    slurp_result:
      content: "{{ '/dev/sda1 on / type ext4 (rw)' | b64encode }}"
      source: "/proc/mounts"
      encoding: "base64"
  ansible.builtin.set_fact:
    mount_from_slurp: "{{ slurp_result | o0_o.posix.mount }}"

- name: Verify slurp input works
  ansible.builtin.assert:
    that:
      - mount_from_slurp is sequence
      - mount_from_slurp | length == 1
      - mount_from_slurp[0].source == '/dev/sda1'

- name: Test empty options handling
  vars:
    empty_opts_output: "/dev/sda1 on / type ext4 ()"
  ansible.builtin.set_fact:
    mount_empty_opts: "{{ empty_opts_output | o0_o.posix.mount }}"

- name: Verify empty options become empty dict
  ansible.builtin.assert:
    that:
      - mount_empty_opts[0].options == {}
    fail_msg: >-
      Empty options should be empty dict, got:
      {{ mount_empty_opts[0].options }}

- name: Test macOS-style mount output (type in options)
  vars:
    macos_output: "/dev/disk3s1s1 on / (apfs, local, journaled)"
  ansible.builtin.set_fact:
    mount_macos: "{{ macos_output | o0_o.posix.mount }}"

- name: Verify macOS-style parsing
  ansible.builtin.assert:
    that:
      - mount_macos[0].source == '/dev/disk3s1s1'
      - mount_macos[0].mount == '/'
      - mount_macos[0].type == 'apfs'
      - mount_macos[0].options.local == true
      - mount_macos[0].options.journaled == true
    fail_msg: >-
      macOS-style mount incorrect:
      {{ mount_macos[0] }}

- name: Verify no dump or pass fields in mount output
  ansible.builtin.assert:
    that:
      - "'dump' not in mount_parsed[0]"
      - "'pass' not in mount_parsed[0]"
    fail_msg: >-
      Mount should not have dump or pass fields (those are fstab-specific)
