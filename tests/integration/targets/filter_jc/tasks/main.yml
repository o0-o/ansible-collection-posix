# The gate below reads this fact rather than ansible_system, so an
# entry point that runs without gathered facts can name the system
# itself and leave the gate alone
- name: Name the system the platform gate reads
  ansible.builtin.set_fact:
    jc_system: "{{ ansible_system }}"
  when: jc_system is not defined

- name: Get uname output
  o0_o.posix.command:
    argv:
      - uname
      - -a
  changed_when: false
  register: uname_output_reg

# jc's uname parser names the systems it reads -- linux, darwin and
# freebsd, in its own info.compatible -- and hands everything else to
# its Linux branch, which pops fields off a string that never held
# them. An OpenBSD uname is refused there by design, so the gate below
# decides between two real assertions rather than between an assertion
# and nothing: where jc names the system the three input shapes agree,
# and where it does not the wrapper is held to reporting the refusal.
- name: Name whether jc's uname parser reads this system
  ansible.builtin.set_fact:
    jc_reads_uname: >-
      {{ jc_system | lower in ['linux', 'darwin', 'freebsd'] }}

- name: Test JC filter against a system jc's uname parser reads
  when: jc_reads_uname | bool
  block:
    - name: Parse using stdout string
      ansible.builtin.set_fact:
        parsed_from_stdout: >-
          {{ uname_output_reg['stdout'] | o0_o.posix.jc('uname') }}

    - name: Assert stdout parsing worked
      ansible.builtin.assert:
        that:
          - parsed_from_stdout is defined
          - parsed_from_stdout is mapping
          - parsed_from_stdout['kernel_name'] is defined

    - name: Parse using stdout_lines list
      ansible.builtin.set_fact:
        parsed_from_lines: >-
          {{ uname_output_reg['stdout_lines'] | o0_o.posix.jc('uname') }}

    - name: Assert stdout_lines parsing worked
      ansible.builtin.assert:
        that:
          - parsed_from_lines is defined
          - parsed_from_lines is mapping
          - parsed_from_lines['kernel_name'] is defined

    - name: Parse using whole registered variable
      ansible.builtin.set_fact:
        parsed_from_dict: "{{ uname_output_reg | o0_o.posix.jc('uname') }}"

    - name: Assert dict parsing worked
      ansible.builtin.assert:
        that:
          - parsed_from_dict is defined
          - parsed_from_dict is mapping
          - parsed_from_dict['kernel_name'] is defined

    - name: Assert all three input methods produce same result
      ansible.builtin.assert:
        that:
          - parsed_from_stdout == parsed_from_lines
          - parsed_from_stdout == parsed_from_dict
        fail_msg: "Different input methods should produce identical results"

- name: 'Fail: Test JC filter against a system jc''s uname parser refuses'
  when: not jc_reads_uname | bool
  block:

    - name: Try to parse this system's uname through jc
      ansible.builtin.set_fact:
        refused_result: "{{ uname_output_reg | o0_o.posix.jc('uname') }}"

  rescue:

    # The dict shape is the one asked for here, so the refusal also
    # proves a whole command result reaches the parser on a system jc
    # does not read, rather than being turned away before it.
    - name: Assert the wrapper reported the parser's refusal
      ansible.builtin.assert:
        that:
          - ansible_failed_result is defined
          - "'jc failed' in ansible_failed_result['msg']"
          - "'uname' in ansible_failed_result['msg']"
        fail_msg: >-
          A system jc's uname parser does not read should fail through
          the wrapper, naming jc and the parser it was asked for

- name: Test JC filter with empty inputs
  block:
    - name: Parse empty string
      ansible.builtin.set_fact:
        empty_string_result: "{{ '' | o0_o.posix.jc('ls') }}"

    - name: Parse empty list
      ansible.builtin.set_fact:
        empty_list_result: "{{ [] | o0_o.posix.jc('ls') }}"

    - name: Parse dict with empty stdout
      ansible.builtin.set_fact:
        empty_dict_result: >-
          {{ {'stdout': '', 'rc': 0} | o0_o.posix.jc('ls') }}

    - name: Assert empty inputs return empty results
      ansible.builtin.assert:
        that:
          - empty_string_result == []
          - empty_list_result == []
          - empty_dict_result == []

- name: 'Fail: Test JC filter with invalid parser'
  block:

    - name: Try to use invalid parser
      ansible.builtin.set_fact:
        invalid_result: >-
          {{ 'test data' | o0_o.posix.jc('invalid_parser_xyz') }}

  rescue:

    - name: Assert invalid parser raised an error
      ansible.builtin.assert:
        that:
          - ansible_failed_result is defined
          - "'invalid_parser_xyz' in ansible_failed_result['msg']"

- name: 'Fail: Test JC filter with wrong variable type'
  block:

    - name: Try to parse a number
      ansible.builtin.set_fact:
        number_result: "{{ 12345 | o0_o.posix.jc('ls') }}"

  rescue:

    - name: Verify number input was handled
      ansible.builtin.assert:
        that:
          # Either it failed or returned empty list
          - ansible_failed_result is defined or number_result == []

- name: Test that filter is available and callable
  block:
    - name: Verify filter exists in collection
      ansible.builtin.set_fact:
        # Use a complete uname output
        filter_test: >-
          {{ 'Linux host 5.10.0 #1 SMP PREEMPT x86_64 GNU/Linux'
             | o0_o.posix.jc('uname') }}

    - name: Assert filter was callable
      ansible.builtin.assert:
        that:
          - filter_test is defined
          - filter_test is mapping
