# This target's entry into the raw lane, per Running CI. Every command
# the target runs is a sysctl and every assertion reads the module's
# own return, so the entry is main.yml under the one fact the gates
# read named for itself.

- name: Name the system the platform gates read
  o0_o.posix.facts:
    gather_subset: [uname]

- name: Ask a host with no interpreter for its tunables
  ansible.builtin.include_tasks: main.yml
