# A POSIX host need not run cron, so the gates below say what they are
# asserting about rather than assuming a crontab command is there.
- name: Ask whether this host has a crontab command at all
  o0_o.posix.which:
    command: crontab
  register: cron_which_reg

- name: Ask the host which identity this run is
  o0_o.posix.command:
    argv:
      - id
      - -u
  check_mode: false
  register: cron_id_reg

- name: Ask the host which kernel it runs
  o0_o.posix.command:
    argv:
      - uname
      - -s
  check_mode: false
  register: cron_kernel_reg

- name: Name what the gates can assert
  ansible.builtin.set_fact:
    cron_have: "{{ cron_which_reg['path'] is defined
                   and cron_which_reg['path'] is not none }}"
    cron_uid: "{{ cron_id_reg['stdout'] | trim }}"
    cron_kernel: "{{ cron_kernel_reg['stdout'] | trim | lower }}"

# An identity that already holds a crontab is left exactly as found:
# the blocks below install one to read back and remove it after, and
# on a host where this identity ships with one - Alpine's root holds
# the periodic jobs - that would replace and then delete it. Those
# blocks run only where there is nothing to lose.
- name: Ask whether this identity already holds a crontab
  when: cron_have | bool
  ansible.builtin.command:
    cmd: crontab -l
  check_mode: false
  register: cron_held_before_reg
  failed_when: false
  changed_when: false

- name: Name whether the install-and-remove blocks may run
  ansible.builtin.set_fact:
    cron_held: "{{ cron_have | bool
                   and cron_held_before_reg['rc'] | default(1) == 0 }}"

- name: Ask what this host schedules
  o0_o.posix.cron:
  register: cron_reg

- name: Assert the answer is the shape the module documents
  vars:
    paths: "{{ cron_reg['o0_paths'] }}"
    users: "{{ cron_reg['o0_users'] }}"
    # A path that was read; one that is not there is a null and one
    # that would not be read carries provenance and nothing else
    described: >-
      {{ paths | dict2items | rejectattr('value', 'none')
         | selectattr('value.content', 'defined') | list }}
  ansible.builtin.assert:
    that:
      - cron_reg is not changed
      - paths is mapping
      - users is mapping
      # Every fixed path is answered for, one way or another: asked
      # about and absent is a null, never a silence
      - "'/etc/crontab' in paths"
      - "'/etc/cron.d' in paths"
      # A crontab file is a fact about that file, so every entry that
      # was read carries its bytes and what they schedule
      - >-
        described | map(attribute='value.config')
        | rejectattr('jobs', 'defined') | list | length == 0
      # And the drop-in directory holds the names of what is in it
      - >-
        paths['/etc/cron.d'] is none
        or paths['/etc/cron.d']['config'] is sequence
      # No spool file is a path entry: what one says is a fact about
      # the user who owns it
      - >-
        paths.keys()
        | select('search', '^/var/spool/|^/var/cron/|^/usr/lib/cron/')
        | list | length == 0
      # Every user entry is keyed by the uid it carries
      - >-
        users | dict2items | map(attribute='key') | sort
        == users | dict2items | map(attribute='value.uid')
        | map('string') | sort
      # And names what was consulted for it
      - >-
        users | dict2items | rejectattr('value.evidence', 'defined')
        | list | length == 0
      - >-
        users | dict2items
        | rejectattr('value.origins', 'contains', 'o0_o.posix.cron')
        | list | length == 0
    fail_msg: >-
      the cron module did not answer the shape it documents:
      {{ cron_reg }}

# Any identity may read its own crontab, which is the reading POSIX
# defines, so this is the one enumeration path every host can prove.
- name: Assert the running identity's own crontab is read
  when:
    - cron_have | bool
    - not (cron_held | bool)
  block:
    - name: Install a crontab for this run to read back
      ansible.builtin.command:
        cmd: crontab -
        stdin: |
          MAILTO=""
          @reboot /usr/local/bin/integration-boot
          */7 * * * * /usr/bin/integration-seven
      changed_when: true

    - name: Ask again now that there is something to find
      o0_o.posix.cron:
        gather: true
      register: cron_held_reg

    - name: Assert the crontab came back as the crontab it is
      vars:
        entry: "{{ cron_held_reg['o0_users'][cron_uid] }}"
        jobs: "{{ entry['crontab']['jobs'] }}"
      ansible.builtin.assert:
        that:
          - entry['uid'] == cron_uid | int
          # Read by the command POSIX defines for it, not out of a
          # spool this identity may have no business in
          - entry['evidence']['commands'] == ['crontab']
          - entry['evidence']['files'] is not defined
          # What the crontab set for every job in it
          - entry['crontab']['environment']['MAILTO'] == ''
          - jobs | length == 2
          # A named schedule is a form of its own
          - "jobs[0]['schedule'] == {'special': 'reboot'}"
          - jobs[0]['command'] == '/usr/local/bin/integration-boot'
          # And a five-field one is kept as it was written
          - jobs[1]['schedule']['minute'] == '*/7'
          - jobs[1]['schedule']['weekday'] == '*'
          - jobs[1]['command'] == '/usr/bin/integration-seven'
          # A per-user crontab names no user: the spool answers that
          - jobs | selectattr('user', 'defined') | list | length == 0
        fail_msg: >-
          the crontab was not read back as it was written:
          {{ entry }}

    - name: Assert the lookup joins what the module published
      vars:
        rows: "{{ lookup('o0_o.posix.schedule', wantlist=True) }}"
        mine: >-
          {{ rows | selectattr('uid', 'defined')
             | selectattr('uid', 'eq', cron_uid | int) | list }}
      ansible.builtin.assert:
        that:
          - rows | length >= 2
          # Every row reads the same way whichever fact it came from
          - >-
            rows | rejectattr('schedule', 'defined')
            | list | length == 0
          - >-
            rows | rejectattr('command', 'defined')
            | list | length == 0
          - >-
            rows | rejectattr('environment', 'defined')
            | list | length == 0
          - rows | map(attribute='source') | unique | reject('in',
            ['file', 'user']) | list | length == 0
          # A row from a user's crontab names the uid it came from
          - mine | length == 2
          - >-
            mine | map(attribute='command') | sort
            == ['/usr/bin/integration-seven',
                '/usr/local/bin/integration-boot']
          - mine | selectattr('path', 'defined') | list | length == 0
        fail_msg: >-
          the lookup did not join what the module published
  always:
    - name: Take the crontab back off, whatever happened
      ansible.builtin.command:
        cmd: crontab -r
      failed_when: false
      changed_when: true

    - name: Assert nothing was left behind
      ansible.builtin.command:
        cmd: crontab -l
      register: cron_after_reg
      failed_when: false
      changed_when: false

    - name: Assert the host is as it was found
      ansible.builtin.assert:
        that:
          - cron_after_reg['rc'] != 0
        fail_msg: >-
          a crontab was left installed: {{ cron_after_reg['stdout'] }}

# On the BSD-descended crons the per-user path is immune to a spelling
# the cron does not take, because crontab(1) refuses to install the
# file: a ~ is OpenBSD's, and macOS, FreeBSD and NetBSD reject it at the
# door. That is why the module's warning about such a line can only be
# about a system file there, and this proves the door is shut. Linux is
# not gated in: cronie and Debian's cron take the tilde, and busybox's
# crontab validates nothing on install - which is why the module holds
# Linux to what every one of its crons takes.
- name: Assert crontab refuses a spelling its cron does not take
  when:
    - cron_have | bool
    - not (cron_held | bool)
    - cron_kernel in ['darwin', 'freebsd', 'netbsd']
  block:
    - name: Offer crontab a line spelled the OpenBSD way
      ansible.builtin.command:
        cmd: crontab -
        stdin: |
          ~ 2 * * 6 /usr/local/bin/integration-random
      register: cron_refused_reg
      failed_when: false
      changed_when: cron_refused_reg['rc'] == 0

    - name: Assert it was refused at the door
      ansible.builtin.assert:
        that:
          - cron_refused_reg['rc'] != 0
        fail_msg: >-
          crontab installed a ~ line on {{ cron_kernel }}, whose cron
          does not take one: {{ cron_refused_reg }}

    - name: Ask whether anything was installed regardless
      ansible.builtin.command:
        cmd: crontab -l
      register: cron_refused_after_reg
      failed_when: false
      changed_when: false

    - name: Assert nothing was
      ansible.builtin.assert:
        that:
          - cron_refused_after_reg['rc'] != 0
            or '~' not in cron_refused_after_reg['stdout']
        fail_msg: >-
          a refused crontab was installed anyway:
          {{ cron_refused_after_reg['stdout'] }}
  always:
    - name: Take any crontab back off, whatever happened
      ansible.builtin.command:
        cmd: crontab -r
      failed_when: false
      changed_when: true

# A crontab this identity holds none of is a crontab it was asked
# about and does not have, which is not the same as never asking.
- name: Assert a user holding no crontab is null rather than absent
  when:
    - cron_have | bool
    - not (cron_held | bool)
  vars:
    entry: "{{ cron_reg['o0_users'][cron_uid] }}"
  ansible.builtin.assert:
    that:
      - cron_uid in cron_reg['o0_users']
      - entry['crontab'] is none
    fail_msg: >-
      a user with no crontab was not reported as having none:
      {{ cron_reg['o0_users'] }}

# Where the identity ships with a crontab, the crontab it ships with
# is the thing to read - Alpine's root carries busybox's periodic jobs
# - and reading it as it stands is the proof, not installing another.
- name: Assert a crontab the identity already holds is read as held
  when:
    - cron_have | bool
    - cron_held | bool
  vars:
    entry: "{{ cron_reg['o0_users'][cron_uid] }}"
  ansible.builtin.assert:
    that:
      - cron_uid in cron_reg['o0_users']
      - entry['crontab'] is mapping
      - entry['crontab']['jobs'] is sequence
      - entry['crontab']['environment'] is mapping
      - entry['evidence']['commands'] == ['crontab']
    fail_msg: >-
      a crontab this identity holds was not read back as one:
      {{ cron_reg['o0_users'] }}

- name: Ask again and publish the answer as facts
  o0_o.posix.cron:
    gather: true
  register: cron_gathered_reg

- name: Assert the gather publishes the names a gather publishes
  vars:
    gathered: "{{ cron_gathered_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - cron_gathered_reg is not changed
      - >-
        gathered.keys() | reject('in', ['o0_paths', 'o0_users'])
        | list | length == 0
      - >-
        gathered['o0_users'] | default({})
        == cron_gathered_reg['o0_users']
    fail_msg: >-
      the gathered namespaces are not what the module returned:
      {{ gathered.keys() | list }}

- name: Assert the module and the subset answer the same thing
  o0_o.posix.facts:
    gather_subset: [cron]
  register: cron_subset_reg

- name: Assert one reading means one shape under one name
  vars:
    gathered: "{{ cron_subset_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      # The same users, and the same crontabs under them
      - >-
        gathered['o0_users'] | default({}) | dict2items
        | map(attribute='key') | sort
        == cron_reg['o0_users'] | dict2items
        | map(attribute='key') | sort
      - >-
        gathered['o0_paths'] | default({}) | dict2items
        | map(attribute='key') | sort
        == cron_reg['o0_paths'] | dict2items
        | map(attribute='key') | sort
      # Each names the module that composed it, and the gather names
      # itself
      - >-
        gathered['o0_users'] | default({}) | dict2items
        | rejectattr('value.origins', 'contains', 'o0_o.posix.facts')
        | list | length == 0
    fail_msg: >-
      the module and the subset disagree about what is scheduled

# The one path a spelling the host's cron does not take can reach the
# host by is a system file, which nothing checks on the way in: cron
# finds the line at runtime, complains to syslog and skips it. Only root
# can write one, and only where the drop-in directory is there, so this
# is gated on both and skips everywhere else - a real host with cron
# will log one complaint about the file while it exists.
- name: Assert a drop-in the host's cron would refuse is read as written
  when:
    - cron_uid == '0'
    - cron_reg['o0_paths']['/etc/cron.d'] is not none
  vars:
    cron_dropin: /etc/cron.d/o0-posix-integration
  block:
    - name: Write a drop-in spelled the OpenBSD way and the FreeBSD way
      o0_o.posix.write:
        dest: "{{ cron_dropin }}"
        content: |
          # written by the o0_o.posix cron integration target
          ~ 2 * * 6 root /usr/local/bin/integration-random
          @every_second root /usr/local/bin/integration-tick

    - name: Ask again, publishing the answer for the lookup to read
      o0_o.posix.facts:
        gather_subset: [uname, cron]
      register: cron_dropin_reg

    - name: Assert the fact carries the lines as written
      vars:
        entry: >-
          {{ cron_dropin_reg['ansible_facts']['o0_paths'][cron_dropin] }}
        jobs: "{{ entry['config']['jobs'] }}"
      ansible.builtin.assert:
        that:
          # A warning is not an exclusion at the fact layer: the file
          # says ~ and @every_second, so the fact says ~ and
          # @every_second
          - jobs | length == 2
          - jobs[0]['schedule']['minute'] == '~'
          - jobs[0]['user'] == 'root'
          - jobs[0]['command'] == '/usr/local/bin/integration-random'
          - "jobs[1]['schedule'] == {'special': 'every_second'}"
          - jobs[1]['command'] == '/usr/local/bin/integration-tick'
          - >-
            cron_dropin in
            cron_dropin_reg['ansible_facts']['o0_paths']['/etc/cron.d']['config']
        fail_msg: >-
          the drop-in was not published as written: {{ entry }}

    - name: Assert the lookup leaves out what this kernel's cron refuses
      vars:
        rows: >-
          {{ lookup('o0_o.posix.schedule', wantlist=True)
             | selectattr('path', 'defined')
             | selectattr('path', 'eq', cron_dropin)
             | map(attribute='command') | list }}
        # OpenBSD's cron takes its own ~, and so do cronie and Debian's
        # cron, so Linux is held to what all of its crons take; only
        # FreeBSD's cron names @every_second. Every other supported
        # cron skips the line, and so does the schedule.
        expected: >-
          {{ (['/usr/local/bin/integration-random']
              if cron_kernel in ['openbsd', 'linux'] else [])
             + (['/usr/local/bin/integration-tick']
                if cron_kernel == 'freebsd' else []) }}
      ansible.builtin.assert:
        that:
          - rows == expected
        fail_msg: >-
          the schedule on {{ cron_kernel }} answered {{ rows }} for the
          drop-in, expected {{ expected }}
  always:
    - name: Take the drop-in back off, whatever happened
      o0_o.posix.write:
        dest: "{{ cron_dropin }}"
        state: absent

# A POSIX host need not run cron at all, and a systemd-timer host
# routinely does not. Every probe exits non-zero having printed
# nothing, and the absence discipline every sweep here follows applies:
# no error, a null for the crontab that was asked about and is not
# there, and evidence naming what was attempted.
- name: Assert a host with no cron is described rather than failed
  when: not (cron_have | bool)
  vars:
    entry: "{{ cron_reg['o0_users'][cron_uid] }}"
  ansible.builtin.assert:
    that:
      - cron_reg is not changed
      # No crontab command says nothing about the files: a host can
      # lack the command and still ship drop-ins (Ubuntu's e2fsprogs
      # installs /etc/cron.d/e2scrub_all with no cron to run it), so
      # the path store is asked the same question either way - every
      # fixed path answered for, absent as null, present as an entry
      - "'/etc/crontab' in cron_reg['o0_paths']"
      - "'/etc/cron.d' in cron_reg['o0_paths']"
      - >-
        cron_reg['o0_paths'] | dict2items | rejectattr('value', 'none')
        | selectattr('value.content', 'defined')
        | map(attribute='value.config')
        | rejectattr('jobs', 'defined') | list | length == 0
      # Asked about and not there, which is not the same as unasked
      - cron_uid in cron_reg['o0_users']
      - entry['crontab'] is none
      - entry['uid'] == cron_uid | int
      # And the record says what was attempted, which is the whole of
      # what a host with no cron can be said to have been asked
      - entry['evidence']['commands'] == ['crontab']
      - entry['evidence']['files'] is not defined
      - >-
        cron_reg['o0_users'] | dict2items
        | rejectattr('value.crontab', 'none') | list | length == 0
    fail_msg: >-
      a host with no cron did not describe itself as having none:
      {{ cron_reg }}
