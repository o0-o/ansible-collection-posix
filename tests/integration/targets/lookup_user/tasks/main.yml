- name: Test user and group lookup plugins
  block:

    - name: Gather user and group information
      o0_o.posix.users:
      register: users_info_reg

    # The lookups read the o0_users and o0_groups facts; the module
    # returns the data rather than setting facts, so the play sets
    # them.
    - name: Expose the canonical facts for the lookups
      ansible.builtin.set_fact:
        o0_users: "{{ users_info_reg['o0_users'] }}"
        o0_groups: "{{ users_info_reg['o0_groups'] }}"

    - name: Look up root user by UID (0)
      ansible.builtin.set_fact:
        root_by_uid: '{{ lookup("o0_o.posix.user", 0) }}'

    - name: Verify root user lookup by UID
      ansible.builtin.assert:
        that:
          - root_by_uid is defined
          - root_by_uid is not none
          - root_by_uid['name'] == 'root'
          - root_by_uid['uid'] is integer
          - root_by_uid['uid'] == 0
          - root_by_uid['gid'] is integer
          - root_by_uid['home'] is defined
          - root_by_uid['groups'] is sequence
          - root_by_uid['gid'] in root_by_uid['groups']

    - name: Look up root user by name
      ansible.builtin.set_fact:
        root_by_name: '{{ lookup("o0_o.posix.user", "root") }}'

    - name: Verify root user lookup by name finds the same user
      ansible.builtin.assert:
        that:
          - root_by_name is defined
          - root_by_name is not none
          - root_by_name['uid'] == 0
          - root_by_name == root_by_uid

    - name: Look up root user's primary group by GID
      ansible.builtin.set_fact:
        root_group_by_gid: >-
          {{ lookup("o0_o.posix.group", root_by_uid["gid"]) }}

    - name: Verify root group lookup by GID
      ansible.builtin.assert:
        that:
          - root_group_by_gid is defined
          - root_group_by_gid is not none
          - root_group_by_gid['gid'] is integer
          - root_group_by_gid['gid'] == root_by_uid['gid']
          - root_group_by_gid['name'] is string
          - root_group_by_gid['members'] is sequence
          - 0 in root_group_by_gid['members']

    # The group lookup used to read Ansible's reserved groups
    # variable, so an inventory group sharing a system group's name
    # returned that group's host list. Create the collision and prove
    # the o0_groups fact answers instead.
    - name: Create an inventory group named after root's primary group
      ansible.builtin.add_host:
        name: lookup-user-collision-host
        groups: "{{ root_group_by_gid['name'] }}"
      changed_when: false

    - name: Look up root user's primary group by name
      ansible.builtin.set_fact:
        root_group_by_name: >-
          {{ lookup("o0_o.posix.group", root_group_by_gid["name"]) }}

    - name: Verify the inventory collision exists
      ansible.builtin.assert:
        that:
          - groups[root_group_by_gid['name']] is defined
          - >-
            'lookup-user-collision-host' in
            groups[root_group_by_gid['name']]

    - name: Verify root group lookup by name returns group facts
      ansible.builtin.assert:
        that:
          - root_group_by_name is defined
          - root_group_by_name is not none
          - root_group_by_name is mapping
          - root_group_by_name == root_group_by_gid
          - root_group_by_name['gid'] == root_by_uid['gid']
          - 0 in root_group_by_name['members']

    - name: Test multiple user lookups at once
      ansible.builtin.set_fact:
        multiple_users: '{{ lookup("o0_o.posix.user", 0, "root") }}'

    - name: Verify multiple lookups
      ansible.builtin.assert:
        that:
          - multiple_users is defined
          - multiple_users is sequence
          - multiple_users | length >= 1

    - name: Test user not found returns None
      ansible.builtin.set_fact:
        nonexistent_user: '{{ lookup("o0_o.posix.user", 99999) }}'

    - name: Verify user not found is None
      ansible.builtin.assert:
        that:
          - nonexistent_user is none

    - name: Test group not found returns None
      ansible.builtin.set_fact:
        nonexistent_group: '{{ lookup("o0_o.posix.group", 99999) }}'

    - name: Verify group not found is None
      ansible.builtin.assert:
        that:
          - nonexistent_group is none

    - name: Test user lookup with default value
      ansible.builtin.set_fact:
        user_with_default: >-
          {{ lookup("o0_o.posix.user", 99999,
             default={"name": "default_user", "home": "/tmp"}) }}

    - name: Verify user lookup returns default when not found
      ansible.builtin.assert:
        that:
          - user_with_default is defined
          - user_with_default['name'] == 'default_user'
          - user_with_default['home'] == '/tmp'

    - name: Test group lookup with default value
      ansible.builtin.set_fact:
        group_with_default: >-
          {{ lookup("o0_o.posix.group", 99999,
             default={"name": "default_group", "members": []}) }}

    - name: Verify group lookup returns default when not found
      ansible.builtin.assert:
        that:
          - group_with_default is defined
          - group_with_default['name'] == 'default_group'
          - group_with_default['members'] == []

    - name: Test user lookup with None as default
      ansible.builtin.set_fact:
        user_none_default: >-
          {{ lookup("o0_o.posix.user", 99999, default=None) }}

    - name: Verify user lookup returns None when default is None
      ansible.builtin.assert:
        that:
          - user_none_default is none
