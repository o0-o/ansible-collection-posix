# This target's entry into the raw lane, per Running CI. The users
# module is the only thing main.yml sends to the host, and the
# lookups read the facts it hands back rather than any Ansible
# gathered, so the entry is the whole target under no vars of its own.
#
# The target names an inventory group after a system group to prove
# the group lookup answers from o0_groups rather than from Ansible's
# reserved groups variable. add_host writes inventory on the
# controller and sends nothing to the host, so it is as raw-clean as
# the rest.
#
# Nothing here opens on a question about an ungathered namespace, so
# unlike the homes and shells entries this one has no store to pin
# empty: main.yml gathers before it asks anything.

- name: Look up users and groups on a host with no interpreter
  ansible.builtin.include_tasks: main.yml
