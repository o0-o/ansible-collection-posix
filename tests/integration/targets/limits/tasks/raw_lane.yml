# This target's entry into the raw lane, per Running CI. The probe is
# a shell builtin asked through sh either way, so the module reaches
# the same answer with no interpreter on the host and the entry is
# main.yml under no vars of its own.

- name: Ask a host with no interpreter what it is limited to
  ansible.builtin.include_tasks: main.yml
