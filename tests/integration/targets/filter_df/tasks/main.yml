- name: Get df output for testing
  ansible.builtin.command:
    cmd: df -P
  changed_when: false
  register: df_output_reg

- name: Test df filter basic parsing
  block:
    - name: Parse df output with string input
      ansible.builtin.set_fact:
        parsed_string: >-
          {{ df_output_reg['stdout'] | o0_o.posix.df }}

    - name: Assert basic structure
      ansible.builtin.assert:
        that:
          - parsed_string is defined
          - parsed_string is iterable
          - parsed_string is not string
          - parsed_string is not mapping
          - parsed_string | length > 0
          - parsed_string[0]['mount'] is defined
        fail_msg: >-
          df filter should return list with mount entries

    - name: Parse with full dict input
      ansible.builtin.set_fact:
        parsed_dict: "{{ df_output_reg | o0_o.posix.df }}"

    - name: Assert dict input produces same result
      ansible.builtin.assert:
        that:
          - parsed_dict == parsed_string
        fail_msg: "Dict and string input should produce identical results"

- name: Test df filter structure
  block:
    # Containers do not always list the overlay root in df, so the
    # structural checks run against the first entry rather than /
    - name: Take the first parsed filesystem entry
      ansible.builtin.set_fact:
        root_mount: "{{ parsed_string | first }}"

    - name: Verify the entry carries mount and source
      ansible.builtin.assert:
        that:
          - root_mount is mapping
          - root_mount['mount'] is string
          - root_mount['source'] is defined
        fail_msg: >-
          Parsed df entries should carry mount and source

    - name: Verify capacity structure if present
      when: "'capacity' in root_mount"
      ansible.builtin.assert:
        that:
          - root_mount['capacity'] is defined
          - root_mount['capacity']['total'] is defined
          - root_mount['capacity']['total']['bytes'] is number
          - root_mount['capacity']['total']['pretty'] is string
          - root_mount['capacity']['used'] is defined
          - root_mount['capacity']['used']['bytes'] is number
          - root_mount['capacity']['used']['pretty'] is string
          - root_mount['capacity']['used']['percent'] is number
          - root_mount['capacity']['used']['percent'] >= 0
          - root_mount['capacity']['used']['percent'] <= 100
        fail_msg: >-
          Capacity structure should have total/used with
          bytes, pretty, and percent

- name: Test with multiple filesystems
  block:
    - name: Count filesystems
      ansible.builtin.set_fact:
        fs_count: "{{ parsed_string | length }}"

    - name: Assert multiple filesystems detected
      ansible.builtin.assert:
        that:
          - fs_count | int >= 1
        fail_msg: >-
          Should detect at least one filesystem

    - name: Check all entries have required fields
      ansible.builtin.assert:
        that:
          - item['mount'] is defined
          - item['mount'] is string
          - item['mount'] | length > 0
        fail_msg: "All entries should have mount field"
      loop: "{{ parsed_string }}"

- name: Test empty input handling
  block:
    - name: Parse empty string
      ansible.builtin.set_fact:
        empty_result: "{{ '' | o0_o.posix.df }}"
      ignore_errors: true
      register: empty_result_reg

    - name: Assert empty input handling
      ansible.builtin.assert:
        that:
          - empty_result_reg is failed or empty_result == []
        fail_msg: "Empty input should either fail or return empty list"

- name: Test special filesystems handling
  block:
    - name: Check for tmpfs filesystems in parsed output
      ansible.builtin.set_fact:
        tmpfs_entries: >-
          {{ parsed_string | selectattr('source', 'defined') |
             selectattr('source', 'match', '(tmpfs|devtmpfs|shm)') |
             list }}

    - name: Debug tmpfs entries if present
      when: tmpfs_entries | length > 0
      ansible.builtin.debug:
        msg: "Found {{ tmpfs_entries | length }} tmpfs/devtmpfs entries"

- name: Test network filesystem handling (if present)
  block:
    - name: Check for network filesystems
      ansible.builtin.set_fact:
        network_fs: >-
          {{ parsed_string | selectattr('source.address', 'defined') | list +
             parsed_string | selectattr('source.map', 'defined') | list }}

    - name: Verify network filesystem parsing if present
      when: network_fs | length > 0
      ansible.builtin.assert:
        that:
          - network_fs[0]['mount'] is defined
          - network_fs[0]['source'] is defined
          - network_fs[0]['source'] is mapping
          - >-
            network_fs[0]['source']['address'] is defined or
            network_fs[0]['source']['map'] is defined
        fail_msg: "Network filesystems should be properly parsed"

- name: Test filter with mock df output
  block:
    - name: Load basic df output from file
      ansible.builtin.set_fact:
        mock_df_output: >-
          {{ lookup('file',
                    playbook_dir + '/targets/filter_df/files/df_basic.txt') }}

    - name: Parse mock output
      ansible.builtin.set_fact:
        mock_parsed: "{{ mock_df_output | o0_o.posix.df }}"

    - name: Debug mock parsed output
      ansible.builtin.debug:
        var: mock_parsed

    - name: Assert mock parsing works
      ansible.builtin.assert:
        that:
          - mock_parsed | length == 3
          - mock_parsed[0]['mount'] == '/'
          - mock_parsed[0]['source']['path'] == '/dev/sda1'
          - mock_parsed[1]['mount'] == '/home'
          - mock_parsed[1]['source']['path'] == '/dev/sda2'
          - mock_parsed[2]['mount'] == '/dev/shm'
          - mock_parsed[2]['source']['name'] == 'tmpfs'
        fail_msg: "Should correctly parse mock df output"

    - name: Verify capacity calculation for mock data
      when: "'capacity' in mock_parsed[0]"
      ansible.builtin.assert:
        that:
          # First filesystem: 20GB total, 5GB used = 25%
          - mock_parsed[0]['capacity']['total']['bytes'] == 20971520 * 1024
          - mock_parsed[0]['capacity']['used']['bytes'] == 5242880 * 1024
          - mock_parsed[0]['capacity']['used']['percent'] == 25.0
          # Second filesystem: 10GB total, 5GB used = 50%
          - "'capacity' in mock_parsed[1]"
          - mock_parsed[1]['capacity']['total']['bytes'] == 10485760 * 1024
          - mock_parsed[1]['capacity']['used']['bytes'] == 5242880 * 1024
          - mock_parsed[1]['capacity']['used']['percent'] == 50.0
          # Third filesystem: tmpfs 2GB total, 0 used = 0%
          - "'capacity' in mock_parsed[2]"
          - mock_parsed[2]['capacity']['total']['bytes'] == 2097152 * 1024
          - mock_parsed[2]['capacity']['used']['bytes'] == 0
          - mock_parsed[2]['capacity']['used']['percent'] == 0.0
        fail_msg: "Capacity calculations should be correct"

- name: Test percentage calculation independence
  block:
    - name: Load df output with mismatched percent from file
      ansible.builtin.set_fact:
        mock_df_mismatch: >-
          {{ lookup('file', playbook_dir +
                    '/targets/filter_df/files/df_mismatch_percent.txt') }}

    - name: Parse mock output with mismatched percent
      ansible.builtin.set_fact:
        mock_mismatch_parsed: "{{ mock_df_mismatch | o0_o.posix.df }}"

    - name: Verify our percent calculation (not df's)
      when: "'capacity' in mock_mismatch_parsed[0]"
      ansible.builtin.assert:
        that:
          # Our calculation: (333333 / 1000000) * 100 = 33.33%
          # Not df's 34%
          - mock_mismatch_parsed[0]['capacity']['used']['percent'] == 33.33
        fail_msg: "Should calculate percent independently, not use df's value"

- name: 'Fail: Test invalid df output'
  block:
    - name: Try to parse incomplete df output
      ansible.builtin.set_fact:
        invalid_result: "{{ 'Filesystem' | o0_o.posix.df }}"

  rescue:
    - name: Assert parsing incomplete output fails gracefully
      ansible.builtin.assert:
        that:
          - ansible_failed_result is defined or invalid_result == []
        fail_msg: "Should handle incomplete df output gracefully"

- name: Test with different block sizes
  block:
    - name: Load df output with 512-byte blocks from file
      ansible.builtin.set_fact:
        mock_512_output: >-
          {{ lookup('file', playbook_dir +
                    '/targets/filter_df/files/df_512blocks.txt') }}

    - name: Parse 512-block output
      ansible.builtin.set_fact:
        mock_512_parsed: "{{ mock_512_output | o0_o.posix.df }}"

    - name: Verify 512-byte block handling
      when: "'capacity' in mock_512_parsed[0]"
      ansible.builtin.assert:
        that:
          - mock_512_parsed[0]['capacity']['total']['bytes'] == 41943040 * 512
          - mock_512_parsed[0]['capacity']['used']['bytes'] == 10485760 * 512
          - mock_512_parsed[0]['capacity']['used']['percent'] == 25.0
        fail_msg: "Should correctly handle 512-byte blocks"

- name: Test pretty formatting
  block:
    - name: Check pretty format in capacity
      when: parsed_string[0]['capacity'] is defined
      ansible.builtin.assert:
        that:
          - >-
            parsed_string[0]['capacity']['total']['pretty']
            is regex('^[0-9.]+ [KMGTPE]i?B$')
          - >-
            parsed_string[0]['capacity']['used']['pretty']
            is regex('^[0-9.]+ [KMGTPE]i?B$')
        fail_msg: "Pretty format should be human-readable with units"
