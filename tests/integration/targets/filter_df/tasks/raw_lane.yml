# This target's entry into the raw lane, per Running CI. It asks the
# host for a df of its own and parses what comes back, so the table
# under test is the guest's rather than a fixture's, and every
# assertion it makes holds on a table no fixture had written down: an
# OpenBSD df -P counts in 512 byte blocks, and the header naming them
# is one this parser had only ever met in a file. Nothing here has to
# be told which system it is answering for -- the entries are the same
# questions on any of them -- so the entry is the whole target under
# no vars of its own.

- name: Parse a df from a host with no interpreter
  ansible.builtin.include_tasks: main.yml
