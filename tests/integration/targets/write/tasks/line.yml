- name: Seed the file the line family edits
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Append a line the file does not hold yet
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'timeout=30'
    raw: "{{ raw }}"
  register: line_append_reg

- name: Read the file back after the append
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_append_read_reg

- name: Assert the append is reported as a change
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_append_reg is changed
      - line_append_reg['raw'] == raw
      - "'line added' in line_append_reg['msg']"

- name: Assert the appended line landed at the end of the file
  ansible.builtin.assert:
    that:
      - line_now['lines'][-1] == 'timeout=30'
      - line_now['lines'] == line_seed.splitlines() + ['timeout=30']
  vars:
    line_now: "{{ line_append_read_reg['paths'][line_dest] }}"
  when: not ansible_check_mode

- name: Assert check mode left the file exactly as it found it
  ansible.builtin.assert:
    that:
      - line_now['lines'] == line_seed.splitlines()
  vars:
    line_now: "{{ line_append_read_reg['paths'][line_dest] }}"
  when: ansible_check_mode

- name: Reset the file before the regular expression replacement
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Replace the line a regular expression matches
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    regexp: '^log_level='
    line: 'log_level=debug'
    raw: "{{ raw }}"
  register: line_replace_reg

- name: Read the file back after the replacement
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_replace_read_reg

- name: Assert the replacement is reported as a change
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_replace_reg is changed
      - line_replace_reg['raw'] == raw
      - "'line replaced' in line_replace_reg['msg']"

- name: Assert the replacement stood in for the matched line
  ansible.builtin.assert:
    that:
      - "'log_level=debug' in line_now['lines']"
      - "'log_level=info' not in line_now['lines']"
      - line_now['lines'] | length == line_seed.splitlines() | length
  vars:
    line_now: "{{ line_replace_read_reg['paths'][line_dest] }}"
  when: not ansible_check_mode

- name: Assert check mode left the matched line alone
  ansible.builtin.assert:
    that:
      - "'log_level=info' in line_now['lines']"
      - "'log_level=debug' not in line_now['lines']"
  vars:
    line_now: "{{ line_replace_read_reg['paths'][line_dest] }}"
  when: ansible_check_mode

- name: Settle the replacement outside check mode
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    regexp: '^log_level='
    line: 'log_level=debug'
    raw: "{{ raw }}"
  check_mode: false
  register: line_settle_reg

- name: Replace the same line a second time
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    regexp: '^log_level='
    line: 'log_level=debug'
    raw: "{{ raw }}"
  check_mode: false
  register: line_replace_idempotent_reg

- name: Assert a repeated replacement reports no change
  ansible.builtin.assert:
    that:
      - line_settle_reg['raw'] == raw
      - line_replace_idempotent_reg is not changed
      - line_replace_idempotent_reg['raw'] == raw

- name: Reset the file before the insertafter anchor test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Insert a line after an anchor
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'inserted=after'
    insertafter: '^# Anchor Start$'
    raw: "{{ raw }}"
  check_mode: false
  register: line_after_reg

- name: Read the file back after the insertafter edit
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_after_read_reg

- name: Assert the line sits directly below its anchor
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_after_reg is changed
      - line_after_reg['raw'] == raw
      - >-
        line_now['lines'].index('inserted=after')
        == line_now['lines'].index('# Anchor Start') + 1
  vars:
    line_now: "{{ line_after_read_reg['paths'][line_dest] }}"

- name: Reset the file before the insertbefore anchor test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Insert a line before an anchor
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'inserted=before'
    insertbefore: '^# Anchor Middle$'
    raw: "{{ raw }}"
  check_mode: false
  register: line_before_reg

- name: Read the file back after the insertbefore edit
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_before_read_reg

- name: Assert the line sits directly above its anchor
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_before_reg is changed
      - line_before_reg['raw'] == raw
      - >-
        line_now['lines'].index('inserted=before') + 1
        == line_now['lines'].index('# Anchor Middle')
  vars:
    line_now: "{{ line_before_read_reg['paths'][line_dest] }}"

- name: Reset the file before the firstmatch test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Insert after the first of two matching anchors
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'first=match'
    insertafter: '^path='
    firstmatch: true
    raw: "{{ raw }}"
  check_mode: false
  register: line_firstmatch_reg

- name: Read the file back after the firstmatch edit
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_firstmatch_read_reg

- name: Assert firstmatch anchored on the earliest match
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_firstmatch_reg is changed
      - line_firstmatch_reg['raw'] == raw
      - >-
        line_now['lines'].index('first=match')
        == line_now['lines'].index('path=/usr/local/bin') + 1
  vars:
    line_now: "{{ line_firstmatch_read_reg['paths'][line_dest] }}"

- name: Reset the file before the last match test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Insert after the last of two matching anchors
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'last=match'
    insertafter: '^path='
    raw: "{{ raw }}"
  check_mode: false
  register: line_lastmatch_reg

- name: Read the file back after the last match edit
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_lastmatch_read_reg

- name: Assert the default anchored on the final match
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_lastmatch_reg is changed
      - line_lastmatch_reg['raw'] == raw
      - >-
        line_now['lines'].index('last=match') + 1
        == line_now['lines'].index('setting_two = false')
  vars:
    line_now: "{{ line_lastmatch_read_reg['paths'][line_dest] }}"

- name: Reset the file before the deduplication test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Ensure a line the file holds twice is present
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'path=/usr/local/bin'
    raw: "{{ raw }}"
  check_mode: false
  register: line_dedupe_reg

- name: Read the file back after the deduplication
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_dedupe_read_reg

- name: Assert the duplicates collapsed into one instance
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_dedupe_reg is changed
      - line_dedupe_reg['raw'] == raw
      - "'1 line deduped' in line_dedupe_reg['msg']"
      - >-
        line_now['lines'] | select('equalto', 'path=/usr/local/bin')
        | list | length == 1
  vars:
    line_now: "{{ line_dedupe_read_reg['paths'][line_dest] }}"

- name: Reset the file before the dedupe=false test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Ensure the same line is present without deduplication
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'path=/usr/local/bin'
    dedupe: false
    raw: "{{ raw }}"
  check_mode: false
  register: line_nodedupe_reg

- name: Read the file back after the dedupe=false edit
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_nodedupe_read_reg

- name: Assert the duplicates survived
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_nodedupe_reg is not changed
      - line_nodedupe_reg['raw'] == raw
      - >-
        line_now['lines'] | select('equalto', 'path=/usr/local/bin')
        | list | length == 2
  vars:
    line_now: "{{ line_nodedupe_read_reg['paths'][line_dest] }}"

- name: Reset the file before the backreference test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Replace a line, carrying a capture group into the result
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    regexp: '^(setting_one) = .*$'
    line: '\1 = false'
    backrefs: true
    raw: "{{ raw }}"
  check_mode: false
  register: line_backrefs_reg

- name: Read the file back after the backreference edit
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_backrefs_read_reg

- name: Assert the capture group expanded into the new line
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_backrefs_reg is changed
      - line_backrefs_reg['raw'] == raw
      - "'setting_one = false' in line_now['lines']"
      - "'setting_one = true' not in line_now['lines']"
  vars:
    line_now: "{{ line_backrefs_read_reg['paths'][line_dest] }}"

- name: Reset the file before the removal test
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    content: "{{ line_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_reset_reg

- name: Remove every instance of a repeated line
  o0_o.posix.write:
    dest: "{{ line_dest }}"
    line: 'path=/usr/local/bin'
    state: absent
    raw: "{{ raw }}"
  register: line_remove_reg

- name: Read the file back after the removal
  o0_o.posix.read:
    path: "{{ line_dest }}"
    content: true
    lines: true
  register: line_remove_read_reg

- name: Assert the removal counted both instances
  ansible.builtin.assert:
    that:
      - line_reset_reg['raw'] == raw
      - line_remove_reg is changed
      - line_remove_reg['raw'] == raw
      - line_remove_reg['found'] == 2
      - "'2 line(s) removed' in line_remove_reg['msg']"

- name: Assert the removed lines are gone from the file
  ansible.builtin.assert:
    that:
      - >-
        line_now['lines'] | select('equalto', 'path=/usr/local/bin')
        | list | length == 0
  vars:
    line_now: "{{ line_remove_read_reg['paths'][line_dest] }}"
  when: not ansible_check_mode

- name: Assert check mode removed nothing from the file
  ansible.builtin.assert:
    that:
      - >-
        line_now['lines'] | select('equalto', 'path=/usr/local/bin')
        | list | length == 2
  vars:
    line_now: "{{ line_remove_read_reg['paths'][line_dest] }}"
  when: ansible_check_mode

- name: Clear the file the create test writes
  ansible.builtin.file:
    path: "{{ line_created_dest }}"
    state: absent
  check_mode: false

- name: Edit a line into a file that does not exist yet
  o0_o.posix.write:
    dest: "{{ line_created_dest }}"
    line: 'first=1'
    create: true
    mode: '0644'
    raw: "{{ raw }}"
  register: line_create_reg

- name: Read the created file back
  o0_o.posix.read:
    path: "{{ line_created_dest }}"
    attributes: true
    content: true
    lines: true
  register: line_create_read_reg

- name: Assert the create edit is reported as a change
  ansible.builtin.assert:
    that:
      - line_create_reg is changed
      - line_create_reg['raw'] == raw

- name: Assert the created file holds only the edited line
  ansible.builtin.assert:
    that:
      - line_now['lines'] == ['first=1']
      - line_now['mode'] == '0644'
  vars:
    line_now: "{{ line_create_read_reg['paths'][line_created_dest] }}"
  when: not ansible_check_mode

- name: Assert check mode never created the file
  ansible.builtin.assert:
    that:
      - line_create_read_reg['paths'][line_created_dest] is none
  when: ansible_check_mode

# The search string matches literally where the regular expression
# matches by pattern. Every case below runs outside check mode, so the
# match semantics are read off the file rather than off a prediction.

- name: Seed the file the search string cases edit
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    content: "{{ line_search_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_reset_reg

- name: Replace the line a literal search string matches
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    search_string: 'pattern=a.c'
    line: 'pattern=replaced'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_reg

- name: Read the file back after the literal replacement
  o0_o.posix.read:
    path: "{{ line_search_dest }}"
    content: true
    lines: true
  register: line_search_read_reg

- name: Assert the search string matched its own line and no other
  ansible.builtin.assert:
    that:
      - line_search_reset_reg['raw'] == raw
      - line_search_reg is changed
      - line_search_reg['raw'] == raw
      - line_search_reg['msg'] == 'line replaced'
      - "'pattern=replaced' in line_now['lines']"
      - "'pattern=a.c' not in line_now['lines']"
      - "'pattern=abc' in line_now['lines']"
      - >-
        line_now['lines'] | length
        == line_search_seed.splitlines() | length
  vars:
    line_now: "{{ line_search_read_reg['paths'][line_search_dest] }}"

- name: Reset the file before the same text is read as a pattern
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    content: "{{ line_search_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_reset_reg

- name: Replace the lines that same text matches as a pattern
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    regexp: 'pattern=a.c'
    line: 'pattern=replaced'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_regexp_reg

- name: Read the file back after the pattern replacement
  o0_o.posix.read:
    path: "{{ line_search_dest }}"
    content: true
    lines: true
  register: line_search_regexp_read_reg

- name: Assert the pattern reached the neighbour the literal spared
  ansible.builtin.assert:
    that:
      - line_search_reset_reg['raw'] == raw
      - line_search_regexp_reg is changed
      - line_search_regexp_reg['raw'] == raw
      - "'1 line deduped' in line_search_regexp_reg['msg']"
      - "'pattern=replaced' in line_now['lines']"
      - "'pattern=abc' not in line_now['lines']"
      - >-
        line_now['lines'] | length
        == line_search_seed.splitlines() | length - 1
  vars:
    line_now: >-
      {{ line_search_regexp_read_reg['paths'][line_search_dest] }}

- name: Reset the file before the search string deduplication
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    content: "{{ line_search_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_reset_reg

- name: Ensure a line is present, matching duplicates by search string
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    search_string: 'dupe='
    line: 'dupe=2'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_dedupe_reg

- name: Read the file back after the search string deduplication
  o0_o.posix.read:
    path: "{{ line_search_dest }}"
    content: true
    lines: true
  register: line_search_dedupe_read_reg

- name: Assert the search string deduplicated what it matched
  ansible.builtin.assert:
    that:
      - line_search_reset_reg['raw'] == raw
      - line_search_dedupe_reg is changed
      - line_search_dedupe_reg['raw'] == raw
      - "'1 line deduped' in line_search_dedupe_reg['msg']"
      - >-
        line_now['lines'] | select('equalto', 'dupe=2')
        | list | length == 1
      - "'dupe=1' not in line_now['lines']"
  vars:
    line_now: >-
      {{ line_search_dedupe_read_reg['paths'][line_search_dest] }}

- name: Reset the file before the search string dedupe=false test
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    content: "{{ line_search_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_reset_reg

- name: Match by search string without deduplicating the rest
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    search_string: 'dupe='
    line: 'dupe=2'
    dedupe: false
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_nodedupe_reg

- name: Read the file back after the dedupe=false edit
  o0_o.posix.read:
    path: "{{ line_search_dest }}"
    content: true
    lines: true
  register: line_search_nodedupe_read_reg

- name: Assert only the last match was replaced and the first survived
  ansible.builtin.assert:
    that:
      - line_search_reset_reg['raw'] == raw
      - line_search_nodedupe_reg is changed
      - line_search_nodedupe_reg['raw'] == raw
      - line_search_nodedupe_reg['msg'] == 'line replaced'
      - "'dupe=1' in line_now['lines']"
      - "'dupe=2' in line_now['lines']"
      - >-
        line_now['lines'] | length
        == line_search_seed.splitlines() | length
  vars:
    line_now: >-
      {{ line_search_nodedupe_read_reg['paths'][line_search_dest] }}

- name: Reset the file before the search string removal
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    content: "{{ line_search_seed }}"
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_reset_reg

# line selects the family and is matched exactly alongside the search
# string, so it names a line the file does not hold. What the removal
# takes away is then attributable to the search string alone.
- name: Remove every line a search string matches
  o0_o.posix.write:
    dest: "{{ line_search_dest }}"
    line: 'no line reads like this'
    search_string: 'dupe='
    state: absent
    raw: "{{ raw }}"
  check_mode: false
  register: line_search_remove_reg

- name: Read the file back after the search string removal
  o0_o.posix.read:
    path: "{{ line_search_dest }}"
    content: true
    lines: true
  register: line_search_remove_read_reg

- name: Assert the removal counted only the search string matches
  ansible.builtin.assert:
    that:
      - line_search_reset_reg['raw'] == raw
      - line_search_remove_reg is changed
      - line_search_remove_reg['raw'] == raw
      - line_search_remove_reg['found'] == 2
      - "'2 line(s) removed' in line_search_remove_reg['msg']"
      - "'dupe=1' not in line_now['lines']"
      - "'tail=end' in line_now['lines']"
      - >-
        line_now['lines'] | length
        == line_search_seed.splitlines() | length - 2
  vars:
    line_now: >-
      {{ line_search_remove_read_reg['paths'][line_search_dest] }}

- name: Clear the destination the missing file removal names
  ansible.builtin.file:
    path: "{{ line_missing_dest }}"
    state: absent
  check_mode: false

- name: Remove a line from a file that does not exist
  o0_o.posix.write:
    dest: "{{ line_missing_dest }}"
    line: 'nothing to remove'
    state: absent
    raw: "{{ raw }}"
  check_mode: false
  register: line_missing_reg

- name: Remove the same line a second time
  o0_o.posix.write:
    dest: "{{ line_missing_dest }}"
    line: 'nothing to remove'
    state: absent
    raw: "{{ raw }}"
  check_mode: false
  register: line_missing_idempotent_reg

- name: Read the destination the removals were pointed at
  o0_o.posix.read:
    path: "{{ line_missing_dest }}"
  register: line_missing_read_reg

- name: Assert removing from a missing file reports nothing to do
  ansible.builtin.assert:
    that:
      - line_missing_reg is not changed
      - line_missing_reg['raw'] == raw
      - >-
        line_missing_reg['msg']
        == 'file not present, nothing to do'
      - "'found' not in line_missing_reg"
      - line_missing_idempotent_reg is not changed
      - line_missing_idempotent_reg['raw'] == raw
      - line_missing_read_reg['paths'][line_missing_dest] is none
