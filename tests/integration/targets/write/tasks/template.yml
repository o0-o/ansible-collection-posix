- name: Start the template family from an empty tree
  ansible.builtin.file:
    path: "{{ tmpl_dir }}"
    state: absent
  check_mode: false

- name: Render a template that lives beside this target
  o0_o.posix.write:
    dest: "{{ tmpl_dest }}"
    template: write_fixture.j2
    mode: '0644'
    raw: "{{ raw }}"
  register: tmpl_render_reg

- name: Read the rendered file back
  o0_o.posix.read:
    path: "{{ tmpl_dest }}"
    attributes: true
    content: true
    lines: true
  register: tmpl_render_read_reg

- name: Assert the render is reported as a change
  ansible.builtin.assert:
    that:
      - tmpl_render_reg is changed
      - tmpl_render_reg['raw'] == raw

- name: Assert the play variable and the template metadata rendered
  ansible.builtin.assert:
    that:
      - tmpl_now['mode'] == '0644'
      - tmpl_now['lines'][0] == '# rendered by o0_o.posix.write'
      - tmpl_now['lines'][1] == 'greeting=' ~ tmpl_greeting
      - tmpl_now['lines'][2] == 'destination=' ~ tmpl_dest
  vars:
    tmpl_now: "{{ tmpl_render_read_reg['paths'][tmpl_dest] }}"
  when: not ansible_check_mode

- name: Assert check mode never created the rendered file
  ansible.builtin.assert:
    that:
      - tmpl_render_read_reg['paths'][tmpl_dest] is none
  when: ansible_check_mode

- name: Settle the rendered file outside check mode
  o0_o.posix.write:
    dest: "{{ tmpl_dest }}"
    template: write_fixture.j2
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: tmpl_settle_reg

- name: Render the same template a second time
  o0_o.posix.write:
    dest: "{{ tmpl_dest }}"
    template: write_fixture.j2
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: tmpl_idempotent_reg

- name: Assert an identical render reports no change
  ansible.builtin.assert:
    that:
      - tmpl_settle_reg['raw'] == raw
      - tmpl_idempotent_reg is not changed
      - tmpl_idempotent_reg['raw'] == raw

- name: Render a template through custom variable delimiters
  o0_o.posix.write:
    dest: "{{ tmpl_custom_dest }}"
    template: write_custom.j2
    variable_start_string: '[['
    variable_end_string: ']]'
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: tmpl_custom_reg

- name: Read the custom delimiter render back
  o0_o.posix.read:
    path: "{{ tmpl_custom_dest }}"
    content: true
    lines: true
  register: tmpl_custom_read_reg

- name: Assert only the custom delimiters were expanded
  ansible.builtin.assert:
    that:
      - tmpl_custom_reg is changed
      - tmpl_custom_reg['raw'] == raw
      - tmpl_now['lines'][0] == 'greeting=' ~ tmpl_greeting
      - tmpl_now['lines'][1] == tmpl_inert_line
  vars:
    tmpl_now: "{{ tmpl_custom_read_reg['paths'][tmpl_custom_dest] }}"

# One fixture carries the angle notation and the brace notation side by
# side. Moving the block and comment delimiters onto the angle forms
# has to render those and leave the brace forms as text; leaving the
# delimiters at their defaults has to do exactly the reverse. Rendering
# the same fixture both ways proves the options moved the delimiters
# rather than merely adding a second set.

- name: Render a template through custom block and comment delimiters
  o0_o.posix.write:
    dest: "{{ tmpl_delims_dest }}"
    template: write_delims.j2
    block_start_string: '<%'
    block_end_string: '%>'
    comment_start_string: '<#'
    comment_end_string: '#>'
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: tmpl_delims_reg

- name: Read the custom block and comment render back
  o0_o.posix.read:
    path: "{{ tmpl_delims_dest }}"
    content: true
    lines: true
  register: tmpl_delims_read_reg

- name: Assert the angle notation rendered and the braces stayed text
  ansible.builtin.assert:
    that:
      - tmpl_delims_reg is changed
      - tmpl_delims_reg['raw'] == raw
      - tmpl_now['lines'][0] == '# rendered by o0_o.posix.write'
      - tmpl_now['lines'][1] == 'block=on;'
      - tmpl_now['lines'][2] == 'comment=none;'
      - tmpl_now['lines'][3] == tmpl_brace_block
      - tmpl_now['lines'][4] == 'greeting=' ~ tmpl_greeting
  vars:
    tmpl_now: "{{ tmpl_delims_read_reg['paths'][tmpl_delims_dest] }}"

- name: Render the same template with the delimiters left alone
  o0_o.posix.write:
    dest: "{{ tmpl_defaults_dest }}"
    template: write_delims.j2
    mode: '0644'
    raw: "{{ raw }}"
  check_mode: false
  register: tmpl_defaults_reg

- name: Read the default delimiter render back
  o0_o.posix.read:
    path: "{{ tmpl_defaults_dest }}"
    content: true
    lines: true
  register: tmpl_defaults_read_reg

- name: Assert the defaults rendered the braces and spared the angles
  ansible.builtin.assert:
    that:
      - tmpl_defaults_reg is changed
      - tmpl_defaults_reg['raw'] == raw
      - tmpl_now['lines'][0] == '# rendered by o0_o.posix.write'
      - tmpl_now['lines'][1] == tmpl_angle_block
      - tmpl_now['lines'][2] == tmpl_angle_comment
      - tmpl_now['lines'][3] == 'inert=never;'
      - tmpl_now['lines'][4] == 'greeting=' ~ tmpl_greeting
  vars:
    tmpl_now: >-
      {{ tmpl_defaults_read_reg['paths'][tmpl_defaults_dest] }}
