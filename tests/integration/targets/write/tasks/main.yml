- name: Create temporary directory for write integration tests
  ansible.builtin.tempfile:
    state: directory
    suffix: write
  register: write_tmpdir_reg

- name: Name the tree every family writes under
  ansible.builtin.set_fact:
    write_test_dir: "{{ write_tmpdir_reg['path'] }}"

- name: Check mode and raw permutation loop
  vars:
    loop_list: "{{ [true, false] | ansible.builtin.product([true, false]) }}"
  block:

    # Check mode cannot be turned on from here: it is a keyword, and
    # only a block or a task may carry it. The row file exists so that
    # one block can hold the row's check mode over every family the
    # row runs.
    - name: Run every family under one row of the matrix
      ansible.builtin.include_tasks: matrix_row.yml
      loop: "{{ loop_list }}"
      loop_control:
        loop_var: matrix_row
      vars:
        check: "{{ matrix_row[0] }}"
        raw: "{{ matrix_row[1] }}"

  always:

    - name: Remove the temporary directory tree
      ansible.builtin.file:
        path: "{{ write_test_dir }}"
        state: absent
