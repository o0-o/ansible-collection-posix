# This target's entry into the raw lane, per Running CI. Every command
# the target runs is a getconf and every assertion reads the module's
# own return rather than a gathered fact, so the entry is main.yml
# under no vars of its own.

- name: Ask a host with no interpreter what it limits
  ansible.builtin.include_tasks: main.yml
