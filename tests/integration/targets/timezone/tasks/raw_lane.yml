# This target's entry into the raw lane, per Running CI. The target
# asks the host what time it keeps and asserts the parse of the
# answer; the asking is raw-clean and the asserting reads no gathered
# fact, so the entry is main.yml under no vars of its own.

- name: Read the timezone on a host with no interpreter
  ansible.builtin.include_tasks: main.yml
