# This target's entry into the raw lane, per Running CI. Everything
# main.yml runs is raw-clean -- the users module is the only thing
# that reaches the host, and the lookup reads the facts that module
# hands back rather than any Ansible gathered -- so the entry is the
# whole target under the one var the lane owes it.
#
# That var is the empty namespace ansible-test would have given the
# target for free. ansible-test enters each target in a play of its
# own, so main.yml opens on a host nothing has gathered from and can
# ask what an ungathered namespace audits to. The lane enters every
# target in one play instead, so by the time this one runs, an
# earlier target's gather has left o0_users behind. Pinning it empty
# restores the question main.yml opens with; the target's own gather
# names it again a few tasks later.

- name: Enter with the users an ungathered host names
  ansible.builtin.set_fact:
    o0_users: {}

- name: Audit the homes on a host with no interpreter
  ansible.builtin.include_tasks: main.yml
