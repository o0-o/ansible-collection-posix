- name: Collect HOME variable
  o0_o.posix.env:
    env: HOME
  register: home_env_reg

- name: Verify HOME is collected
  ansible.builtin.assert:
    that:
      - home_env_reg is defined
      - home_env_reg['changed'] == false
      - home_env_reg['env'] is mapping
      - home_env_reg['env']['HOME'] is defined
      - >-
        home_env_reg['env']['HOME'] is string
        or home_env_reg['env']['HOME'] is none
      - home_env_reg['msg'] is string
    fail_msg: 'HOME variable not collected correctly'

- name: Collect multiple POSIX variables
  o0_o.posix.env:
    env:
      - HOME
      - SHELL
      - PATH
      - LOGNAME
    # null keeps unset variables in the result, so the length
    # assertion holds on minimal hosts where LOGNAME or SHELL is
    # unset, and the undefined knob gets exercised
    undefined: 'null'
  register: multi_env_reg

- name: Verify multiple variables are collected
  ansible.builtin.assert:
    that:
      - multi_env_reg['env'] is mapping
      - multi_env_reg['env'] | length == 4
      - >-
        multi_env_reg['env']['HOME'] is string
        or multi_env_reg['env']['HOME'] is none
      - >-
        multi_env_reg['env']['SHELL'] is string
        or multi_env_reg['env']['SHELL'] is none
      - >-
        multi_env_reg['env']['PATH'] is string
        or multi_env_reg['env']['PATH'] is none
      - >-
        multi_env_reg['env']['LOGNAME'] is string
        or multi_env_reg['env']['LOGNAME'] is none
    fail_msg: 'Multiple variables not collected correctly'

- name: Collect likely unset variable
  o0_o.posix.env:
    env: ANSIBLE_TEST_UNSET_VAR_XYZZY
    # the task verifies null semantics, so ask for them; the default
    # excludes unset variables from the result entirely
    undefined: 'null'
  register: unset_env_reg

- name: Verify unset variable returns null
  ansible.builtin.assert:
    that:
      - unset_env_reg['env'] is mapping
      - >-
        unset_env_reg['env']['ANSIBLE_TEST_UNSET_VAR_XYZZY']
        is none
    fail_msg: 'Unset variable did not return null'

- name: Collect in list mode
  o0_o.posix.env:
    env:
      - HOME
      - SHELL
    wantlist: true
    # null keeps unset variables present, so the length holds on
    # minimal hosts where SHELL is unset
    undefined: 'null'
  register: list_env_reg

- name: Verify list mode returns list of dicts
  ansible.builtin.assert:
    that:
      - list_env_reg['env'] is sequence
      - list_env_reg['env'] is not mapping
      - list_env_reg['env'] | length == 2
      - list_env_reg['env'][0] is mapping
      - list_env_reg['env'][1] is mapping
      - list_env_reg['env'][0]['HOME'] is defined
      - list_env_reg['env'][1]['SHELL'] is defined
    fail_msg: 'List mode did not return expected format'

- name: Collect single var as string (not list)
  o0_o.posix.env:
    env: SHELL
    undefined: 'null'
  register: single_env_reg

- name: Verify single string input works
  ansible.builtin.assert:
    that:
      - single_env_reg['env'] is mapping
      - >-
        single_env_reg['env']['SHELL'] is string
        or single_env_reg['env']['SHELL'] is none
    fail_msg: 'Single string env input did not work'

- name: Collect mix of set and unset variables
  o0_o.posix.env:
    env:
      - HOME
      - ANSIBLE_TEST_UNSET_VAR_XYZZY
      - SHELL
    undefined: 'null'
  register: mixed_env_reg

- name: Verify mixed set/unset results
  ansible.builtin.assert:
    that:
      - >-
        mixed_env_reg['env']['HOME'] is string
        or mixed_env_reg['env']['HOME'] is none
      - >-
        mixed_env_reg['env']['ANSIBLE_TEST_UNSET_VAR_XYZZY']
        is none
      - >-
        mixed_env_reg['env']['SHELL'] is string
        or mixed_env_reg['env']['SHELL'] is none
    fail_msg: 'Mixed set/unset variables not handled correctly'
