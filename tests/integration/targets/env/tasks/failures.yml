- name: 'Fail: Test missing required env parameter'
  block:

    - name: Run env without required parameter
      o0_o.posix.env: {}

  rescue:

    - name: Assert failure for missing parameter
      ansible.builtin.assert:
        that:
          - ansible_failed_result is defined
          - ansible_failed_result is failed
        fail_msg: >-
          Expected failure for missing env parameter
