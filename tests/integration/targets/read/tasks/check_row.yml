# One row of the check mode loop. The block's check_mode keyword is
# what puts the row in check mode: the magic variable
# ansible_check_mode is Ansible's own, taken from the command line and
# from nowhere else, so the row's own value travels as 'check' for
# anything that needs to read it.
#
# Nothing below branches on it, and that is the point. A read changes
# nothing, and it asks for every command it runs outside check mode
# deliberately, so a check row must answer with the same bytes a real
# row answers with. Every assertion in both files stands unchanged
# under the row, and the row proves no read short-circuits into a
# skip. The tasks that lay down fixtures name check_mode: false for
# themselves so the reads have something to find in either row.
- name: Run the reads with the row's check mode in force
  check_mode: "{{ check }}"
  block:

    - name: Execute read module scenarios
      ansible.builtin.include_tasks: read.yml

    - name: Execute advanced read module tests
      ansible.builtin.include_tasks: read_advanced.yml

    - name: Execute the resolution walk tests
      ansible.builtin.include_tasks: read_resolve.yml
