# Requesting content or lines turns attributes off unless attributes is
# passed explicitly, so every task that asserts both passes attributes.
- name: Read regular file with content
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    content: true
    attributes: true
  register: read_regular_content_reg

- name: Assert regular file metadata with content
  ansible.builtin.assert:
    that:
      - read_regular_content_reg is not changed
      - >-
        read_regular_content_reg['paths'][read_regular_path]['type']
        == 'regular'
      - read_regular_content_reg['paths'][read_regular_path]['mode'] == '0640'
      - >-
        read_regular_content_reg['paths'][read_regular_path]['uid']
        is integer
      - >-
        read_regular_content_reg['paths'][read_regular_path]['gid']
        is integer
      - >-
        read_regular_content_reg['paths'][read_regular_path]['owner']
        is not defined
      - >-
        read_regular_content_reg['paths'][read_regular_path]['group']
        is not defined
      - >-
        read_regular_content_reg['paths'][read_regular_path]['size']['bytes']
        is number
      - >-
        read_regular_content_reg['paths'][read_regular_path]['size']['pretty']
        is defined
      - >-
        read_regular_content_reg['paths'][read_regular_path]['readable']
        is boolean
      - >-
        read_regular_content_reg['paths'][read_regular_path]['writable']
        is boolean
      - >-
        read_regular_content_reg['paths'][read_regular_path]['encoding']
        is defined
      - >-
        'quick brown fox' in
        read_regular_content_reg['paths'][read_regular_path]['content']
      - >-
        read_regular_content_reg['paths'][read_regular_path]['hardlinks']
        == 1

- name: Read regular file without content
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
  register: read_regular_meta_reg

- name: Assert regular file metadata without content
  ansible.builtin.assert:
    that:
      - read_regular_meta_reg is not changed
      - read_regular_meta_reg['paths'][read_regular_path]['type'] == 'regular'
      - "'content' not in read_regular_meta_reg['paths'][read_regular_path]"
      - "'lines' not in read_regular_meta_reg['paths'][read_regular_path]"
      - "'encoding' not in read_regular_meta_reg['paths'][read_regular_path]"
      - read_regular_meta_reg['paths'][read_regular_path]['hardlinks'] == 1
      - >-
        read_regular_meta_reg['paths'][read_regular_path]['writable']
        is boolean

- name: Read regular file as lines
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    lines: true
  register: read_regular_lines_reg

- name: Assert line array matches file content
  ansible.builtin.assert:
    that:
      - read_regular_lines_reg is not changed
      - >-
        read_regular_lines_reg['paths'][read_regular_path]['lines']
        == ['The quick brown fox', 'jumps over the lazy dog']
      - >-
        read_regular_lines_reg['paths'][read_regular_path]['encoding']
        is defined
      # lines without an explicit attributes turns attributes off
      - "'type' not in read_regular_lines_reg['paths'][read_regular_path]"

- name: Read regular file with forced base64 encoding
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    encoding: base64
  register: read_regular_base64_reg

- name: Assert forced encoding is honored and implies content
  ansible.builtin.assert:
    that:
      - read_regular_base64_reg is not changed
      - >-
        read_regular_base64_reg['paths'][read_regular_path]['encoding']
        == 'base64'
      - >-
        'quick brown fox' in
        (read_regular_base64_reg['paths'][read_regular_path]['content']
        | b64decode)

- name: Read regular file with mime type and checksums
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    mime: true
    md5: true
    sha1: true
    sha256: true
    sha512: true
  register: read_regular_digest_reg

- name: Assert mime type and checksums of known content
  ansible.builtin.assert:
    that:
      - read_regular_digest_reg is not changed
      - >-
        read_regular_digest_reg['paths'][read_regular_path]['mime']['type']
        == 'text'
      - >-
        read_regular_digest_reg['paths'][read_regular_path]['mime']['subtype']
        is defined
      - >-
        read_regular_digest_reg['paths'][read_regular_path]['md5']
        == '58badea9b79664d51d8ad4048fb0819c'
      - >-
        read_regular_digest_reg['paths'][read_regular_path]['sha1']
        == '1fe52e794254813ecf88a33f330be00702ecbeaf'
      - >-
        read_regular_digest_reg['paths'][read_regular_path]['sha256'] ==
        '3e2f56c7f38c0633ef8fb640340ea3194e29efd39c7d1e2059a67d3a5de4c62d'
      # 128 hex digits does not fit the line budget, so match the shape
      - >-
        read_regular_digest_reg['paths'][read_regular_path]['sha512']
        is match('^[0-9a-f]{128}$')

# The type a checksum needs is the one ls reported, and asking for
# content is what turns off publishing it
- name: Read regular file with content and a checksum
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    content: true
    md5: true
  register: read_digest_no_attrs_reg

- name: Assert the checksum arrives with attributes off
  ansible.builtin.assert:
    that:
      - read_digest_no_attrs_reg is not changed
      - "'type' not in read_digest_no_attrs_reg['paths'][read_regular_path]"
      - >-
        read_digest_no_attrs_reg['paths'][read_regular_path]['md5']
        == '58badea9b79664d51d8ad4048fb0819c'
      - >-
        'quick brown fox' in
        read_digest_no_attrs_reg['paths'][read_regular_path]['content']

- name: Read binary file with content enabled
  o0_o.posix.read:
    path: "{{ read_binary_path }}"
    content: true
    attributes: true
  register: read_binary_reg

- name: Assert binary content is returned base64 encoded
  ansible.builtin.assert:
    that:
      - read_binary_reg is not changed
      - read_binary_reg['paths'][read_binary_path]['type'] == 'regular'
      - read_binary_reg['paths'][read_binary_path]['encoding'] == 'base64'
      # three NUL bytes survive the round trip as base64
      - read_binary_reg['paths'][read_binary_path]['content'] == 'AAAA'
      - read_binary_reg['paths'][read_binary_path]['size']['bytes'] == 3
      - "'lines' not in read_binary_reg['paths'][read_binary_path]"
      - "'hardlinks' not in read_binary_reg['paths'][read_binary_path]"
      - >-
        read_binary_reg['paths'][read_binary_path]['writable'] is boolean

- name: Read symbolic link metadata
  o0_o.posix.read:
    path: "{{ read_symlink_path }}"
    follow: false
  register: read_symlink_reg

- name: Assert symbolic link target recorded
  ansible.builtin.assert:
    that:
      - read_symlink_reg is not changed
      - read_symlink_reg['paths'][read_symlink_path]['type'] == 'link'
      - >-
        read_symlink_reg['paths'][read_symlink_path]['target']
        == read_regular_path
      - "'realpath' not in read_symlink_reg['paths'][read_symlink_path]"
      - "'hardlinks' not in read_symlink_reg['paths'][read_symlink_path]"
      - >-
        read_symlink_reg['paths'][read_symlink_path]['writable'] is boolean

- name: Read symbolic link with follow enabled
  o0_o.posix.read:
    path: "{{ read_symlink_path }}"
    follow: true
  register: read_symlink_follow_reg

- name: Assert followed link describes its ultimate target
  ansible.builtin.assert:
    that:
      - read_symlink_follow_reg is not changed
      - >-
        read_symlink_follow_reg['paths'][read_symlink_path]['type']
        == 'regular'
      - >-
        read_symlink_follow_reg['paths'][read_symlink_path]['realpath']
        | basename == 'regular.txt'

- name: Read directory metadata
  o0_o.posix.read:
    path: "{{ read_directory_path }}"
  register: read_directory_reg

- name: Assert directory type detected
  ansible.builtin.assert:
    that:
      - read_directory_reg is not changed
      - read_directory_reg['paths'][read_directory_path]['type'] == 'directory'
      - read_directory_reg['paths'][read_directory_path]['mode'] == '0750'
      - "'content' not in read_directory_reg['paths'][read_directory_path]"
      - "'size' not in read_directory_reg['paths'][read_directory_path]"
      - >-
        read_directory_reg['paths'][read_directory_path]['writable']
        is boolean

- name: Read FIFO metadata
  o0_o.posix.read:
    path: "{{ read_fifo_path }}"
  register: read_fifo_reg

- name: Assert FIFO type detected
  ansible.builtin.assert:
    that:
      - read_fifo_reg is not changed
      - read_fifo_reg['paths'][read_fifo_path]['type'] == 'pipe'
      - "'hardlinks' not in read_fifo_reg['paths'][read_fifo_path]"
      - >-
        read_fifo_reg['paths'][read_fifo_path]['writable'] is boolean

# The FIFO leads so it is also the path platform detection runs on,
# which is where cat used to go out alongside the ls that types it. The
# timeout fails the task instead of wedging the run: a cat on a FIFO
# with no writer waits forever.
- name: Read a FIFO and a regular file with content in one call
  o0_o.posix.read:
    paths:
      - "{{ read_fifo_path }}"
      - "{{ read_regular_path }}"
    content: true
    attributes: true
  register: read_fifo_content_reg
  timeout: 60

- name: Assert the FIFO returned metadata only and the file its content
  ansible.builtin.assert:
    that:
      - read_fifo_content_reg is not changed
      - read_fifo_content_reg['paths'][read_fifo_path]['type'] == 'pipe'
      - "'content' not in read_fifo_content_reg['paths'][read_fifo_path]"
      - "'lines' not in read_fifo_content_reg['paths'][read_fifo_path]"
      - "'encoding' not in read_fifo_content_reg['paths'][read_fifo_path]"
      - >-
        read_fifo_content_reg['paths'][read_regular_path]['type']
        == 'regular'
      - >-
        'quick brown fox' in
        read_fifo_content_reg['paths'][read_regular_path]['content']

- name: Read symbolic link recursively
  o0_o.posix.read:
    path: "{{ read_symlink_path }}"
    follow: recursive
    content: true
    attributes: true
  register: read_symlink_recursive_reg

# Skipping filesystem scan tests (find_hardlinks/find_symlinks)
# as they would scan the entire filesystem and take too long

- name: Assert recursive link expansion
  ansible.builtin.assert:
    that:
      - >-
        read_symlink_recursive_reg['paths'][read_symlink_path]['type']
        == 'link'
      - >-
        read_symlink_recursive_reg['paths'][read_symlink_path]['target']
        == read_regular_path
      - >-
        read_symlink_recursive_reg['paths'][read_regular_path]['type']
        == 'regular'
      - >-
        'quick brown fox' in
        read_symlink_recursive_reg['paths'][read_regular_path]['content']
      - >-
        read_symlink_recursive_reg['paths'][read_regular_path]['writable']
        is boolean

- name: Read missing path returns none
  o0_o.posix.read:
    path: /does/not/exist
  register: read_missing_reg

- name: Assert missing path yields null result
  ansible.builtin.assert:
    that:
      - read_missing_reg is not changed
      - read_missing_reg['paths']['/does/not/exist'] is none

- name: Read multiple paths in single call
  o0_o.posix.read:
    paths:
      - "{{ read_regular_path }}"
      - "{{ read_symlink_path }}"
    follow: false
  register: read_multiple_reg

- name: Assert multiple path results available
  ansible.builtin.assert:
    that:
      - read_multiple_reg['paths'][read_regular_path]['type'] == 'regular'
      - read_multiple_reg['paths'][read_symlink_path]['type'] == 'link'
      - read_multiple_reg['commands'] is number
      - read_multiple_reg['batches'] is number

# Test hardlinks
- name: Read hardlink file
  o0_o.posix.read:
    path: "{{ read_hardlink_path }}"
  register: read_hardlink_reg

- name: Assert hardlink shows other hardlinks count of 1
  ansible.builtin.assert:
    that:
      - read_hardlink_reg is not changed
      - read_hardlink_reg['paths'][read_hardlink_path]['type'] == 'regular'
      - read_hardlink_reg['paths'][read_hardlink_path]['hardlinks'] == 1
      - read_hardlink_reg['paths'][read_hardlink_path]['inode'] is defined
      - read_hardlink_reg['paths'][read_hardlink_path]['inode'] is number

# Test extended metadata fields (platform-specific)

# Test extended metadata (includes xattrs where available)
- name: Read file with extended metadata
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    extended: true
  register: read_extended_reg
  when: ansible_system in ['Linux', 'Darwin']

- name: Assert extended metadata fields
  ansible.builtin.assert:
    that:
      - read_extended_reg is not changed
      # extended implies attributes
      - read_extended_reg['paths'][read_regular_path]['type'] == 'regular'
      # xattrs are only reported when the path actually carries some
      - >-
        'xattrs' not in read_extended_reg['paths'][read_regular_path]
        or read_extended_reg['paths'][read_regular_path]['xattrs']
        is mapping
  when: ansible_system in ['Linux', 'Darwin']

# Test the full request (attributes + extended + content + mime)
- name: Read file with every metadata option
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    attributes: true
    extended: true
    content: true
    lines: true
    mime: true
  register: read_all_reg
  when: ansible_system in ['Linux', 'Darwin']

- name: Assert all metadata fields
  ansible.builtin.assert:
    that:
      - read_all_reg is not changed
      - read_all_reg['paths'][read_regular_path]['type'] == 'regular'
      - read_all_reg['paths'][read_regular_path]['content'] is defined
      - read_all_reg['paths'][read_regular_path]['lines'] | length == 2
      - read_all_reg['paths'][read_regular_path]['encoding'] is defined
      - read_all_reg['paths'][read_regular_path]['mime']['type'] == 'text'
  when: ansible_system in ['Linux', 'Darwin']

# Test SELinux context (only on SELinux-enabled Linux systems)
- name: Check if SELinux is enabled
  ansible.builtin.command:
    argv:
      - getenforce
  register: selinux_status_reg
  changed_when: false
  failed_when: false
  when: ansible_system == 'Linux'

- name: Read file with attributes on an SELinux system
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    attributes: true
  register: read_selinux_reg
  when:
    - ansible_system == 'Linux'
    - selinux_status_reg is defined
    - selinux_status_reg['rc'] == 0
    - selinux_status_reg['stdout'] | default('') != 'Disabled'

- name: Assert SELinux field behavior
  ansible.builtin.assert:
    that:
      - read_selinux_reg is not changed
      # The context is reported only when the system provides one
      - >-
        'selinux' not in read_selinux_reg['paths'][read_regular_path]
        or read_selinux_reg['paths'][read_regular_path]['selinux']
        is string
  when:
    - ansible_system == 'Linux'
    - selinux_status_reg is defined
    - selinux_status_reg['rc'] == 0
    - selinux_status_reg['stdout'] | default('') != 'Disabled'

# Test that xattrs are NOT present without extended
# (attributes covers flags, ACL and SELinux but NOT xattrs)
- name: Read file with attributes only (no xattrs)
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    attributes: true
  register: read_attributes_only_reg

- name: Assert xattrs not present without extended
  ansible.builtin.assert:
    that:
      - read_attributes_only_reg is not changed
      - >-
        read_attributes_only_reg['paths'][read_regular_path]['type']
        == 'regular'
      - >-
        'xattrs' not in
        read_attributes_only_reg['paths'][read_regular_path]

# Rejections

# An empty list satisfies the spec's required=True, so nothing but the
# action's own check stands between a templating accident upstream and
# a result that reports no paths as though none were asked for
- name: 'Fail: Read an empty paths list'
  block:

    - name: Read no paths at all
      o0_o.posix.read:
        paths: []

  rescue:

    - name: Assert the empty list is rejected by name
      ansible.builtin.assert:
        that:
          - ansible_failed_result is failed
          - >-
            'paths must contain at least one path'
            in ansible_failed_result['msg']
