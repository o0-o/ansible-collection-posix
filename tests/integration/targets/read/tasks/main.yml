# The platform gates below read this fact rather than ansible_system,
# so an entry point that runs without gathered facts can name the
# system itself and leave the gates alone
- name: Name the system the platform gates read
  ansible.builtin.set_fact:
    read_system: "{{ ansible_system }}"
  when: read_system is not defined

- name: Create temporary directory for read integration tests
  o0_o.posix.command:
    argv:
      - mktemp
      - -d
  register: read_tempdir_reg

- name: Name the directory every read runs under
  ansible.builtin.set_fact:
    read_dir_path: "{{ read_tempdir_reg['stdout'] | trim }}"

- name: Define test paths
  ansible.builtin.set_fact:
    read_regular_path: "{{ read_dir_path }}/regular.txt"
    read_hardlink_path: "{{ read_dir_path }}/regular.hard"
    read_symlink_path: "{{ read_dir_path }}/regular.link"
    read_binary_path: "{{ read_dir_path }}/binary.bin"
    read_directory_path: "{{ read_dir_path }}/subdir"
    read_fifo_path: "{{ read_dir_path }}/special.fifo"

# The checksums asserted downstream are of these two lines with no
# newline after the second, and write always terminates what it lands
# with one, so the bytes are laid down by printf instead
- name: Create regular file with known content
  o0_o.posix.command:
    cmd: >-
      printf 'The quick brown fox\njumps over the lazy dog'
      > {{ read_regular_path }}
    _uses_shell: true

- name: Hold the regular file at the mode the assertions expect
  o0_o.posix.write:
    dest: "{{ read_regular_path }}"
    state: touch
    mode: '0640'

- name: Create hard link to regular file
  o0_o.posix.command:
    argv:
      - ln
      - "{{ read_regular_path }}"
      - "{{ read_hardlink_path }}"

- name: Create symbolic link to regular file
  o0_o.posix.write:
    state: link
    target: "{{ read_regular_path }}"
    dest: "{{ read_symlink_path }}"

- name: Create directory entry
  o0_o.posix.write:
    state: directory
    dest: "{{ read_directory_path }}"
    mode: '0750'

- name: Create FIFO entry
  o0_o.posix.command:
    argv:
      - mkfifo
      - "{{ read_fifo_path }}"

- name: Create binary file with non-text content
  o0_o.posix.command:
    argv:
      - dd
      - if=/dev/zero
      - "of={{ read_binary_path }}"
      - bs=1
      - count=3
  changed_when: true
  register: _dd_reg

- name: Try
  block:

    # Check mode cannot be turned on from here: it is a keyword, and
    # only a block or a task may carry one, which an include is
    # neither. The row file exists so that one block can hold the
    # row's check mode over both files the row runs.
    - name: Run every read under one row of the check mode loop
      ansible.builtin.include_tasks: check_row.yml
      loop: "{{ read_check_modes | default([true, false]) }}"
      loop_control:
        loop_var: read_check_mode
      vars:
        check: "{{ read_check_mode }}"

  always:

    - name: Remove temporary directory tree
      o0_o.posix.write:
        dest: "{{ read_dir_path }}"
        state: absent
