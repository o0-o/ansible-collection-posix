# Advanced read module tests for children, parents, list and timestamps

- name: Create nested directory structure for advanced tests
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
  loop:
    - "{{ read_dir_path }}/nested/level1"
    - "{{ read_dir_path }}/nested/level1/level2"
    - "{{ read_dir_path }}/nested/level1/level2/level3"

- name: Create files in nested structure
  ansible.builtin.copy:
    dest: "{{ item }}"
    content: 'test content'
  loop:
    - "{{ read_dir_path }}/nested/file0.txt"
    - "{{ read_dir_path }}/nested/level1/file1.txt"
    - "{{ read_dir_path }}/nested/level1/level2/file2.txt"
    - "{{ read_dir_path }}/nested/level1/level2/level3/file3.txt"

# Test children parameter with boolean True (unlimited recursion)
- name: Read directory with children=true (unlimited depth)
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
    children: true
  register: read_children_unlimited_reg

- name: Assert children=true reads all nested files
  ansible.builtin.assert:
    that:
      - read_children_unlimited_reg is not changed
      - >-
        read_children_unlimited_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/file0.txt'] is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/file1.txt'] is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2/file2.txt'] is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2/level3'] is defined
      - >-
        read_children_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2/level3/file3.txt'] is defined

# Test children parameter with integer depth limit
- name: Read directory with children=1 (depth limit)
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
    children: 1
  register: read_children_depth1_reg

- name: Assert children=1 only reads first level
  ansible.builtin.assert:
    that:
      - read_children_depth1_reg is not changed
      - >-
        read_children_depth1_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        read_children_depth1_reg['paths'][read_dir_path +
        '/nested/file0.txt'] is defined
      - >-
        read_children_depth1_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_children_depth1_reg['paths'][read_dir_path +
        '/nested/level1/file1.txt'] is not defined
      - >-
        read_children_depth1_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is not defined

# Test children parameter with depth 2
- name: Read directory with children=2
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
    children: 2
  register: read_children_depth2_reg

- name: Assert children=2 reads two levels deep
  ansible.builtin.assert:
    that:
      - read_children_depth2_reg is not changed
      - >-
        read_children_depth2_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_children_depth2_reg['paths'][read_dir_path +
        '/nested/level1/file1.txt'] is defined
      - >-
        read_children_depth2_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is defined
      - >-
        read_children_depth2_reg['paths'][read_dir_path +
        '/nested/level1/level2/file2.txt'] is not defined
      - >-
        read_children_depth2_reg['paths'][read_dir_path +
        '/nested/level1/level2/level3'] is not defined

# Recursion descends on the type ls reported for each entry, so it
# reaches the bottom of the tree whether or not the type is published
- name: Name the entries of a two level subtree
  ansible.builtin.set_fact:
    read_subtree_dir: "{{ read_dir_path }}/nested/level1/level2"
    read_subtree_file: "{{ read_dir_path }}/nested/level1/level2/file2.txt"
    read_subtree_sub: "{{ read_dir_path }}/nested/level1/level2/level3"
    read_subtree_leaf: >-
      {{ read_dir_path }}/nested/level1/level2/level3/file3.txt

- name: Read a two level tree with children and attributes off
  o0_o.posix.read:
    path: "{{ read_subtree_dir }}"
    children: true
    attributes: false
  register: read_children_no_attrs_reg

- name: Assert the tree is walked to the bottom and nothing published
  ansible.builtin.assert:
    that:
      - read_children_no_attrs_reg is not changed
      - read_children_no_attrs_reg['paths'] | length == 4
      - read_children_no_attrs_reg['paths'][read_subtree_file] is defined
      - read_children_no_attrs_reg['paths'][read_subtree_leaf] is defined
      - >-
        read_children_no_attrs_reg['paths'][read_subtree_dir]['children']
        | sort == [read_subtree_file, read_subtree_sub]
      - >-
        read_children_no_attrs_reg['paths'][read_subtree_sub]['children']
        == [read_subtree_leaf]
      - >-
        read_children_no_attrs_reg['paths'].values() | map('list')
        | flatten | select('in', ['type', 'mode', 'uid']) | length == 0

# A symlink to a directory inside a walked tree gets an entry of its
# own and is never descended into: the queue takes what the ls typed a
# directory, and an ls types a link a link. Which is the same walk
# published or not, so both reads below must visit the same entries.
- name: Create a directory to link to inside a fresh tree
  ansible.builtin.file:
    state: directory
    path: "{{ read_dir_path }}/linktree/real"

- name: Put a file below the directory that is linked to
  ansible.builtin.copy:
    dest: "{{ read_dir_path }}/linktree/real/inner.txt"
    content: 'inner'
    mode: '0644'

- name: Link to that directory beside it
  ansible.builtin.file:
    state: link
    src: "{{ read_dir_path }}/linktree/real"
    path: "{{ read_dir_path }}/linktree/dirlink"

# Kept out of the tree above so it does not join that walk
- name: Link to a path that is not there
  ansible.builtin.file:
    state: link
    src: "{{ read_dir_path }}/gone.txt"
    path: "{{ read_dir_path }}/dangling.link"
    force: true

- name: Name the entries of the linked tree
  ansible.builtin.set_fact:
    read_linktree_dir: "{{ read_dir_path }}/linktree"
    read_linktree_real: "{{ read_dir_path }}/linktree/real"
    read_linktree_link: "{{ read_dir_path }}/linktree/dirlink"
    read_linktree_inner: "{{ read_dir_path }}/linktree/real/inner.txt"

- name: Read a tree holding a directory symlink with attributes on
  o0_o.posix.read:
    path: "{{ read_linktree_dir }}"
    children: true
    attributes: true
  register: read_dirlink_reg

- name: Read the same tree with attributes off
  o0_o.posix.read:
    path: "{{ read_linktree_dir }}"
    children: true
    attributes: false
  register: read_dirlink_no_attrs_reg

- name: Assert the walk stops at the directory symlink either way
  ansible.builtin.assert:
    that:
      - read_dirlink_reg is not changed
      - read_dirlink_no_attrs_reg is not changed
      # The link is read as an entry, the real directory is descended
      # into, and nothing is reached through the link: no
      # linktree/dirlink/inner.txt either way
      - >-
        read_dirlink_reg['paths'].keys() | sort
        == [read_linktree_dir, read_linktree_link, read_linktree_real,
        read_linktree_inner] | sort
      - >-
        read_dirlink_no_attrs_reg['paths'].keys() | sort
        == read_dirlink_reg['paths'].keys() | sort
      # follow defaults to true, so the link's own entry describes the
      # directory it resolves to, listing nothing of its own
      - >-
        read_dirlink_reg['paths'][read_linktree_link]['type']
        == 'directory'
      - >-
        read_dirlink_reg['paths'][read_linktree_link]['realpath']
        | basename == 'real'
      - "'children' not in read_dirlink_reg['paths'][read_linktree_link]"
      - >-
        read_dirlink_reg['paths'][read_linktree_real]['children']
        == [read_linktree_inner]
      - >-
        read_dirlink_no_attrs_reg['paths'][read_linktree_real]['children']
        == [read_linktree_inner]
      # A followed link takes the target's data because the target is
      # there, which the ls settles; a directory read without
      # attributes publishes nothing, and the realpath the action adds
      # arrives all the same. The same entry, its attribute keys held
      # back
      - >-
        read_dirlink_no_attrs_reg['paths'][read_linktree_link]['realpath']
        == read_dirlink_reg['paths'][read_linktree_link]['realpath']
      - >-
        read_dirlink_no_attrs_reg['paths'][read_linktree_link] | list
        == ['realpath']

# follow=recursive walks to where the link points, and where it points
# is what the ls reported, not what the result was allowed to show, so
# the walk reaches the same entries with the attribute keys held back
- name: Walk a directory symlink recursively with attributes on
  o0_o.posix.read:
    path: "{{ read_linktree_link }}"
    follow: recursive
    attributes: true
  register: read_recursive_reg

- name: Walk the same symlink recursively with attributes off
  o0_o.posix.read:
    path: "{{ read_linktree_link }}"
    follow: recursive
    attributes: false
  register: read_recursive_no_attrs_reg

- name: Assert the recursive walk reaches the target either way
  ansible.builtin.assert:
    that:
      - read_recursive_reg is not changed
      - read_recursive_no_attrs_reg is not changed
      - >-
        read_recursive_reg['paths'].keys() | sort
        == [read_linktree_link, read_linktree_real] | sort
      - >-
        read_recursive_no_attrs_reg['paths'].keys() | sort
        == read_recursive_reg['paths'].keys() | sort
      # The link is listed as a link and the directory it names is
      # read beside it, rather than standing in for it
      - >-
        read_recursive_reg['paths'][read_linktree_link]['type'] == 'link'
      - >-
        read_recursive_reg['paths'][read_linktree_link]['target']
        == read_linktree_real
      - >-
        read_recursive_reg['paths'][read_linktree_real]['type']
        == 'directory'
      - >-
        'realpath' not in read_recursive_reg['paths'][read_linktree_link]
      # Both entries with every attribute key held back, the target
      # among them: it is the ls the walk read, not the result
      - >-
        read_recursive_no_attrs_reg['paths'].values() | map('list')
        | flatten | length == 0

# The other side of the same question: a followed link takes its
# target's data because the ls found a target to take it from, and
# nothing lies at the end of a dangling link, so it keeps its own
- name: Read a dangling link with follow enabled
  o0_o.posix.read:
    path: "{{ read_dir_path }}/dangling.link"
    follow: true
  register: read_dangling_reg

- name: Assert a dangling link keeps its own entry
  ansible.builtin.assert:
    that:
      - read_dangling_reg is not changed
      - read_dangling_reg['paths'] | length == 1
      - >-
        read_dangling_reg['paths'][read_dir_path + '/dangling.link']['type']
        == 'link'
      - >-
        read_dangling_reg['paths'][read_dir_path + '/dangling.link']['target']
        == read_dir_path + '/gone.txt'
      - >-
        'realpath' not in
        read_dangling_reg['paths'][read_dir_path + '/dangling.link']

# Test parents parameter with boolean True
- name: Read file with parents=true
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested/level1/level2/file2.txt"
    parents: true
  register: read_parents_unlimited_reg

- name: Assert parents=true reads all parent directories
  ansible.builtin.assert:
    that:
      - read_parents_unlimited_reg is not changed
      - >-
        read_parents_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2/file2.txt'] is defined
      - >-
        read_parents_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is defined
      - >-
        read_parents_unlimited_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_parents_unlimited_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        read_parents_unlimited_reg['paths'][read_dir_path +
        '/nested/level1/level2']['type'] == 'directory'

# Test parents parameter with integer depth limit
- name: Read file with parents=2
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested/level1/level2/level3/file3.txt"
    parents: 2
  register: read_parents_depth2_reg

- name: Assert parents=2 only reads 2 parent levels
  ansible.builtin.assert:
    that:
      - read_parents_depth2_reg is not changed
      - >-
        read_parents_depth2_reg['paths'][read_dir_path +
        '/nested/level1/level2/level3/file3.txt'] is defined
      - >-
        read_parents_depth2_reg['paths'][read_dir_path +
        '/nested/level1/level2/level3'] is defined
      - >-
        read_parents_depth2_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is defined
      - >-
        read_parents_depth2_reg['paths'][read_dir_path +
        '/nested/level1'] is not defined

# The list parameter adds the children field without recursing
- name: Read directory with list enabled
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
    list: true
  register: read_list_reg

- name: Assert list adds the children field but does not recurse
  ansible.builtin.assert:
    that:
      - read_list_reg is not changed
      - >-
        read_list_reg['paths'][read_dir_path + '/nested']['type']
        == 'directory'
      - >-
        read_list_reg['paths'][read_dir_path + '/nested']['children']
        is sequence
      - >-
        read_list_reg['paths'][read_dir_path + '/nested']['children']
        | length == 2
      - read_list_reg['paths'] | length == 1

# The listing reads the type ls reported, published or not
- name: Read directory with list enabled and attributes off
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
    list: true
    attributes: false
  register: read_list_no_attrs_reg

- name: Assert the listing arrives with attributes off
  ansible.builtin.assert:
    that:
      - read_list_no_attrs_reg is not changed
      - >-
        'type' not in
        read_list_no_attrs_reg['paths'][read_dir_path + '/nested']
      - >-
        read_list_no_attrs_reg['paths'][read_dir_path + '/nested']['children']
        | length == 2

- name: Read empty directory with list enabled
  o0_o.posix.read:
    path: "{{ read_directory_path }}"
    list: true
  register: read_list_empty_reg

- name: Assert empty directory lists no children
  ansible.builtin.assert:
    that:
      - read_list_empty_reg is not changed
      - >-
        read_list_empty_reg['paths'][read_directory_path]['type']
        == 'directory'
      - read_list_empty_reg['paths'][read_directory_path]['children'] == []

# Test every metadata option against a regular file
- name: Read regular file with every metadata option
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
    attributes: true
    extended: true
    content: true
    mime: true
  register: read_include_all_reg

- name: Assert all options provide comprehensive metadata
  ansible.builtin.assert:
    that:
      - read_include_all_reg is not changed
      - read_include_all_reg['paths'][read_regular_path]['type'] == 'regular'
      - >-
        read_include_all_reg['paths'][read_regular_path]['mode']
        is defined
      - >-
        read_include_all_reg['paths'][read_regular_path]['uid']
        is integer
      - >-
        read_include_all_reg['paths'][read_regular_path]['gid']
        is integer
      - >-
        read_include_all_reg['paths'][read_regular_path]['size']['bytes']
        is number
      - >-
        read_include_all_reg['paths'][read_regular_path]['writable']
        is boolean
      - >-
        read_include_all_reg['paths'][read_regular_path]['content']
        is defined
      - >-
        read_include_all_reg['paths'][read_regular_path]['encoding']
        is defined
      - >-
        read_include_all_reg['paths'][read_regular_path]['mime']['subtype']
        is defined

# Test attributes include timestamp fields (modified, changed, created)
- name: Read file to verify timestamp fields in attributes
  o0_o.posix.read:
    path: "{{ read_regular_path }}"
  register: read_timestamps_reg

- name: Assert timestamp fields are present in attributes
  ansible.builtin.assert:
    that:
      - read_timestamps_reg is not changed
      - >-
        read_timestamps_reg['paths'][read_regular_path]['modified']['seconds']
        is number
      - >-
        read_timestamps_reg['paths'][read_regular_path]['modified']['pretty']
        is defined
      - >-
        read_timestamps_reg['paths'][read_regular_path]['changed']['seconds']
        is number
      # created is only reported when the filesystem records a birth time
      - >-
        'created' not in read_timestamps_reg['paths'][read_regular_path]
        or 'seconds' in
        read_timestamps_reg['paths'][read_regular_path]['created']

# The children parameter implies list, so read entries carry children
- name: Read with children parameter to check implied list
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
    children: 1
  register: read_children_both_reg

- name: Assert children parameter implies the children field
  ansible.builtin.assert:
    that:
      - read_children_both_reg is not changed
      - >-
        read_children_both_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        'children' in
        read_children_both_reg['paths'][read_dir_path + '/nested']
      - >-
        read_children_both_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        'children' in read_children_both_reg['paths'][read_dir_path +
        '/nested/level1']

# The children field stays out of the result unless it is asked for
- name: Read directory without list or children
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested"
  register: read_no_list_reg

- name: Assert children field not present without list
  ansible.builtin.assert:
    that:
      - read_no_list_reg is not changed
      - >-
        read_no_list_reg['paths'][read_dir_path + '/nested']['type']
        == 'directory'
      - >-
        'children' not in
        read_no_list_reg['paths'][read_dir_path + '/nested']
      - read_no_list_reg['paths'] | length == 1

# Test parents with children combined
- name: Read with both parents and children
  o0_o.posix.read:
    path: "{{ read_dir_path }}/nested/level1"
    parents: 1
    children: 1
  register: read_parents_children_reg

- name: Assert parents and children work together
  ansible.builtin.assert:
    that:
      - read_parents_children_reg is not changed
      - >-
        read_parents_children_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_parents_children_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        read_parents_children_reg['paths'][read_dir_path +
        '/nested/level1/file1.txt'] is defined
      - >-
        read_parents_children_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is defined
      - >-
        read_parents_children_reg['paths'][read_dir_path +
        '/nested/level1/level2/file2.txt'] is not defined

# Test multiple paths with children parameter
- name: Read multiple directories with children
  o0_o.posix.read:
    paths:
      - "{{ read_dir_path }}/nested"
      - "{{ read_dir_path }}/nested/level1"
    children: 1
  register: read_multi_children_reg

- name: Assert multiple paths with children works correctly
  ansible.builtin.assert:
    that:
      - read_multi_children_reg is not changed
      - >-
        read_multi_children_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        read_multi_children_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_multi_children_reg['paths'][read_dir_path +
        '/nested/file0.txt'] is defined
      - >-
        read_multi_children_reg['paths'][read_dir_path +
        '/nested/level1/file1.txt'] is defined

# Test multiple paths with parents parameter
- name: Read multiple files with parents
  o0_o.posix.read:
    paths:
      - "{{ read_dir_path }}/nested/level1/file1.txt"
      - "{{ read_dir_path }}/nested/level1/level2/file2.txt"
    parents: 1
  register: read_multi_parents_reg

- name: Assert multiple paths with parents works correctly
  ansible.builtin.assert:
    that:
      - read_multi_parents_reg is not changed
      - >-
        read_multi_parents_reg['paths'][read_dir_path +
        '/nested/level1/file1.txt'] is defined
      - >-
        read_multi_parents_reg['paths'][read_dir_path +
        '/nested/level1/level2/file2.txt'] is defined
      - >-
        read_multi_parents_reg['paths'][read_dir_path +
        '/nested/level1'] is defined
      - >-
        read_multi_parents_reg['paths'][read_dir_path +
        '/nested/level1/level2'] is defined

# Test multiple mixed paths (files and directories)
- name: Read multiple mixed paths with children and parents
  o0_o.posix.read:
    paths:
      - "{{ read_dir_path }}/nested"
      - "{{ read_regular_path }}"
      - "{{ read_symlink_path }}"
    children: 1
    parents: 1
    follow: false
  register: read_multi_mixed_reg

- name: Assert multiple mixed paths works correctly
  ansible.builtin.assert:
    that:
      - read_multi_mixed_reg is not changed
      - >-
        read_multi_mixed_reg['paths'][read_dir_path + '/nested']
        is defined
      - >-
        read_multi_mixed_reg['paths'][read_dir_path + '/nested']['type']
        == 'directory'
      - >-
        read_multi_mixed_reg['paths'][read_regular_path] is defined
      - >-
        read_multi_mixed_reg['paths'][read_regular_path]['type']
        == 'regular'
      - >-
        read_multi_mixed_reg['paths'][read_symlink_path] is defined
      - >-
        read_multi_mixed_reg['paths'][read_symlink_path]['type']
        == 'link'
      - >-
        read_multi_mixed_reg['paths'][read_dir_path] is defined
      - >-
        read_multi_mixed_reg['paths'][read_dir_path +
        '/nested/file0.txt'] is defined
