# This target's entry into the raw lane, per Running CI. Every reading
# main.yml takes comes through this collection's own module and every
# assertion is about that reading rather than about a gathered fact,
# so the entry is main.yml under no vars of its own.
#
# The check mode case is a task carrying its own keyword, not a loop,
# so it holds here as it does under ansible-test, and what it asks --
# whether a reading is the same taken either way -- is a question the
# raw path answers too.

- name: Read the mounts on a host with no interpreter
  ansible.builtin.include_tasks: main.yml
