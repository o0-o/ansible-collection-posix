# This target's entry into the raw lane, per Running CI. It runs the
# same task files main.yml runs, so the assertions have one home; what
# it chooses is which of them an interpreter-free host can answer and
# what vars they run under.
#
# never_raw.yml sits out: it asks for the interpreted path by name and
# asserts it was taken, which is exactly what a host with no
# interpreter cannot do. That leaves raw.yml on its own rather than in
# the row it usually shares, which costs it only the comparison
# against the interpreted output, and that comparison already stands
# down when the interpreted registers are unset. raw is pinned true
# rather than left at auto because the shared files assert the mode
# they were asked for; that the auto path finds its way to raw on
# these hosts is what the lane's own preflight proves.
#
# main.yml runs each file over both check modes, which arrive as a
# keyword on a row's block. The lane takes the row that runs: check
# mode withholds the execution this lane exists to prove, so a check
# row would send nothing over the transport under test.

- name: Run raw tests
  ansible.builtin.include_tasks: raw.yml
  vars:
    check: false

- name: Run the matrix files with the raw path as the only path
  ansible.builtin.include_tasks: matrix_row.yml
  vars:
    check: false
    raw: true
