# One row of the check mode and raw matrix. The block's check_mode
# keyword is what puts the row in check mode: the magic variable
# ansible_check_mode is Ansible's own, taken from the command line and
# from nowhere else, so the row's own value travels as 'check' for the
# assertions to read. The raw column travels the same way, as 'raw',
# and every command below asks for the transport by name.
- name: Run the files with the row's check mode in force
  check_mode: "{{ check }}"
  block:

    - name: Run success tests
      ansible.builtin.include_tasks: successes.yml

    - name: Run shell operator tests
      ansible.builtin.include_tasks: shell_operators.yml

    - name: Run failures tests
      ansible.builtin.include_tasks: failures.yml
