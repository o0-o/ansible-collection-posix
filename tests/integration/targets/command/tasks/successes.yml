# Simplest form - only required parameter, all defaults
- name: Test simplest form (defaults only)
  o0_o.posix.command:
    cmd: echo hello
  register: simplest_reg

- name: Assert simplest form works
  ansible.builtin.assert:
    that:
      - simplest_reg['rc'] == 0
      - simplest_reg['stdout'] | trim == 'hello'
  when: not ansible_check_mode

- name: Run command with argv
  o0_o.posix.command:
    argv:
      - echo
      - foo
    raw: "{{ raw }}"
  register: command_argv_reg

- name: Assert command output
  ansible.builtin.assert:
    that:
      - command_argv_reg['stdout'].rstrip() == 'foo'
      - command_argv_reg['stdout_lines'] == ['foo']
  when: not ansible_check_mode

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_argv_reg['raw'] == raw

- name: Run command with cmd
  o0_o.posix.command:
    cmd: echo foo
    raw: "{{ raw }}"
  register: command_cmd_reg

- name: Assert command output
  ansible.builtin.assert:
    that:
      - command_cmd_reg['stdout'].rstrip() == 'foo'
      - command_cmd_reg['stdout_lines'] == ['foo']
  when: not ansible_check_mode

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_cmd_reg['raw'] == raw

- name: Assert command output (Check mode)
  ansible.builtin.assert:
    that:
      - command_cmd_reg['stdout'] == ''
      - command_cmd_reg['stdout_lines'] == []
  when: ansible_check_mode

- name: Run command with cmd
  o0_o.posix.command:
    cmd: echo foo
    raw: "{{ raw }}"
  register: command_reg

- name: Assert command output
  ansible.builtin.assert:
    that:
      - command_reg['stdout'].rstrip() == 'foo'
      - command_reg['stdout_lines'] == ['foo']
  when: not ansible_check_mode

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_reg['raw'] == raw

- name: Run command with stdin
  o0_o.posix.command:
    argv: [cat]
    stdin: "hello\nworld"
    raw: "{{ raw }}"
  register: command_reg

- name: Assert stdin was passed correctly
  ansible.builtin.assert:
    that:
      - command_reg['stdout_lines'] == ['hello', 'world']
  when: not ansible_check_mode

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_reg['raw'] == raw

- name: Run with creates when file already exists (should skip)
  o0_o.posix.command:
    argv:
      - echo
      - should
      - not
      - run
    creates: /dev/null
    raw: "{{ raw }}"
  register: command_reg

- name: Assert command skipped due to creates
  ansible.builtin.assert:
    that:
      - command_reg['changed'] == false
      - command_reg['rc'] == 0

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_reg['raw'] == raw

- name: Ensure dummy file is absent
  o0_o.posix.write:
    dest: /tmp/o0_foo
    state: absent

- name: Run with creates when file is missing (should run or be marked changed)
  o0_o.posix.command:
    argv:
      - echo
      - would
      - run
    creates: /tmp/o0_foo
    raw: "{{ raw }}"
  register: command_reg

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_reg['raw'] == raw

- name: Assert command would run due to creates missing
  ansible.builtin.assert:
    that:
      - command_reg['changed'] == true
      - command_reg['rc'] == 0

- name: Run with removes when file exists (should run or be marked changed)
  o0_o.posix.command:
    argv:
      - echo
      - would
      - run
    removes: /dev/null
    raw: "{{ raw }}"
  register: command_reg

- name: Assert command would run due to file existing
  ansible.builtin.assert:
    that:
      - command_reg['changed'] == true
      - command_reg['rc'] == 0

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_reg['raw'] == raw

- name: Run with removes when file is missing (should skip)
  o0_o.posix.command:
    argv:
      - echo
      - should
      - not
      - run
    removes: /tmp/o0_foo
    raw: "{{ raw }}"
  register: command_reg

- name: Assert command skipped due to removes missing
  ansible.builtin.assert:
    that:
      - command_reg['changed'] == false
      - command_reg['rc'] == 0

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - command_reg['raw'] == raw

- name: Test timing fields populated
  o0_o.posix.command:
    cmd: sleep 0.1
    raw: "{{ raw }}"
  register: timing_reg

- name: Assert timing fields present and valid
  ansible.builtin.assert:
    that:
      - timing_reg['start'] is defined
      - timing_reg['end'] is defined
      - timing_reg['delta'] is defined
      - timing_reg['delta'] is match('[0-9]+:[0-9]{2}:[0-9]{2}')
  when: not ansible_check_mode

- name: Assert raw execution is as intended
  ansible.builtin.assert:
    that:
      - timing_reg['raw'] == raw
