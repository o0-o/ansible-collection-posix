# Check mode cannot be turned on from here: it is a keyword, and only
# a block or a task may carry one, which an include is neither. Each
# loop below turns through a row file whose block holds the row's
# check mode over every file the row runs.

- name: Run both transports under one row of the check mode loop
  ansible.builtin.include_tasks: expansion_row.yml
  loop:
    - true
    - false
  loop_control:
    loop_var: check_row
  vars:
    check: "{{ check_row }}"

- name: Check mode and raw permutation loop
  vars:
    loop_list: "{{ [true, false] | ansible.builtin.product([true, false]) }}"
  block:

    - name: Run every file under one row of the matrix
      ansible.builtin.include_tasks: matrix_row.yml
      loop: "{{ loop_list }}"
      loop_control:
        loop_var: matrix_row
      vars:
        check: "{{ matrix_row[0] }}"
        raw: "{{ matrix_row[1] }}"
