- name: Create test directory
  ansible.builtin.file:
    path: "{{ stat_test_dir }}/testdir"
    state: directory
    mode: '0755'
  check_mode: false

- name: Stat the directory
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/testdir"
  register: stat_dir_reg

- name: Verify directory flags
  ansible.builtin.assert:
    that:
      - stat_dir_reg['stat']['exists']
      - stat_dir_reg['stat']['isdir']
      - not stat_dir_reg['stat']['isreg']
      - not stat_dir_reg['stat']['islnk']
    msg: Directory type flags should be correct

- name: Create test file for symlink
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/realfile.txt"
    mode: '0644'
  check_mode: false

- name: Create symlink
  ansible.builtin.file:
    src: "{{ stat_test_dir }}/realfile.txt"
    dest: "{{ stat_test_dir }}/symlink.txt"
    state: link
  check_mode: false

- name: Stat the symlink (follow=false)
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink.txt"
    follow: false
  register: stat_symlink_reg

- name: Verify symlink flags (when not following)
  ansible.builtin.assert:
    that:
      - stat_symlink_reg['stat']['exists']
      - stat_symlink_reg['stat']['islnk']
      - not stat_symlink_reg['stat']['isreg']
      - not stat_symlink_reg['stat']['isdir']
    msg: Symlink type flags should be correct when not following

- name: Stat the symlink (follow=true, explicit)
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink.txt"
    follow: true
  register: stat_symlink_follow_reg

- name: Verify symlink target flags (when following)
  ansible.builtin.assert:
    that:
      - stat_symlink_follow_reg['stat']['exists']
      - stat_symlink_follow_reg['stat']['isreg']
      - not stat_symlink_follow_reg['stat']['islnk']
    msg: Should report regular file when following symlinks

- name: Stat character device /dev/null
  o0_o.posix.stat:
    path: /dev/null
  register: stat_chr_reg

- name: Verify character device flags
  ansible.builtin.assert:
    that:
      - stat_chr_reg['stat']['exists']
      - stat_chr_reg['stat']['ischr']
      - not stat_chr_reg['stat']['isreg']
      - not stat_chr_reg['stat']['isdir']
      - not stat_chr_reg['stat']['islnk']
      - not stat_chr_reg['stat']['isblk']
      - not stat_chr_reg['stat']['isfifo']
      - not stat_chr_reg['stat']['issock']
    msg: /dev/null should be identified as character device

- name: Verify character device has required fields
  ansible.builtin.assert:
    that:
      - stat_chr_reg['stat']['dev'] is defined
      - stat_chr_reg['stat']['device_type'] is defined
      - stat_chr_reg['stat']['dev'] is number
      - stat_chr_reg['stat']['device_type'] is number
    msg: Character device should have dev and device_type fields
