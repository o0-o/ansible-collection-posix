- name: Create test file for checksum tests
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/checksum_test.txt"
    mode: '0644'
  check_mode: false

- name: Test SHA1 checksum (default)
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
  register: stat_sha1_reg

- name: Verify SHA1 checksum present and correct length
  ansible.builtin.assert:
    that:
      - stat_sha1_reg['stat']['checksum'] is defined
      - stat_sha1_reg['stat']['checksum'] | length == 40
    msg: SHA1 checksum should be 40 characters (default algorithm)

- name: Test MD5 checksum
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
    checksum_algorithm: md5
  register: stat_md5_reg

- name: Verify MD5 checksum present and correct length
  ansible.builtin.assert:
    that:
      - stat_md5_reg['stat']['checksum'] is defined
      - stat_md5_reg['stat']['checksum'] | length == 32
    msg: MD5 checksum should be 32 characters

- name: Test SHA256 checksum
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
    checksum_algorithm: sha256
  register: stat_sha256_reg

- name: Verify SHA256 checksum present and correct length
  ansible.builtin.assert:
    that:
      - stat_sha256_reg['stat']['checksum'] is defined
      - stat_sha256_reg['stat']['checksum'] | length == 64
    msg: SHA256 checksum should be 64 characters

- name: Test SHA224 checksum
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
    checksum_algorithm: sha224
  register: stat_sha224_reg

- name: Verify SHA224 checksum present and correct length
  ansible.builtin.assert:
    that:
      - stat_sha224_reg['stat']['checksum'] is defined
      - stat_sha224_reg['stat']['checksum'] | length == 56
    msg: SHA224 checksum should be 56 characters

- name: Test SHA384 checksum
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
    checksum_algorithm: sha384
  register: stat_sha384_reg

- name: Verify SHA384 checksum present and correct length
  ansible.builtin.assert:
    that:
      - stat_sha384_reg['stat']['checksum'] is defined
      - stat_sha384_reg['stat']['checksum'] | length == 96
    msg: SHA384 checksum should be 96 characters

- name: Test SHA512 checksum
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
    checksum_algorithm: sha512
  register: stat_sha512_reg

- name: Verify SHA512 checksum present and correct length
  ansible.builtin.assert:
    that:
      - stat_sha512_reg['stat']['checksum'] is defined
      - stat_sha512_reg['stat']['checksum'] | length == 128
    msg: SHA512 checksum should be 128 characters

- name: Test with checksum disabled
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/checksum_test.txt"
    get_checksum: false
  register: stat_nochecksum_reg

- name: Verify checksum not present when disabled
  ansible.builtin.assert:
    that:
      - stat_nochecksum_reg['stat']['checksum'] is not defined
    msg: Checksum should not be present when get_checksum=false

- name: Test checksum not present for directory
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}"
  register: stat_dir_checksum_reg

- name: Verify checksum not computed for directory
  ansible.builtin.assert:
    that:
      - stat_dir_checksum_reg['stat']['checksum'] is not defined
    msg: Checksum should not be computed for directories
