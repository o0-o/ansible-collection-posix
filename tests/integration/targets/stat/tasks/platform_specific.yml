- name: Create test file for platform-specific tests
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/platform_test.txt"
    mode: '0644'
  check_mode: false

- name: Darwin/macOS specific tests
  when: ansible_system == 'Darwin'
  block:

    - name: Stat file on macOS
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
      register: stat_macos_reg

    - name: Verify birthtime exists on macOS
      ansible.builtin.assert:
        that:
          - stat_macos_reg['stat']['birthtime'] is defined
          - stat_macos_reg['stat']['birthtime'] is float
          - stat_macos_reg['stat']['birthtime'] > 0
        msg: macOS should provide birthtime

    - name: Verify flags field exists on macOS
      ansible.builtin.assert:
        that:
          - stat_macos_reg['stat']['flags'] is defined
        msg: macOS should provide flags field

    - name: Test MIME detection works on macOS
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
        get_mime: true
      register: stat_macos_mime_reg

    - name: Verify MIME type on macOS
      ansible.builtin.assert:
        that:
          - stat_macos_mime_reg['stat']['mimetype'] is defined
          - >-
            'text' in stat_macos_mime_reg['stat']['mimetype'] or
            stat_macos_mime_reg['stat']['mimetype'] ==
            'application/octet-stream'
        msg: macOS should detect MIME type

- name: FreeBSD specific tests
  when: ansible_distribution == 'FreeBSD'
  block:

    - name: Stat file on FreeBSD
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
      register: stat_freebsd_reg

    - name: Verify birthtime exists on FreeBSD
      ansible.builtin.assert:
        that:
          - stat_freebsd_reg['stat']['birthtime'] is defined
          - stat_freebsd_reg['stat']['birthtime'] is float
        msg: FreeBSD should provide birthtime

    - name: Verify flags field exists on FreeBSD
      ansible.builtin.assert:
        that:
          - stat_freebsd_reg['stat']['flags'] is defined
        msg: FreeBSD should provide flags field

- name: Linux specific tests
  when: ansible_system == 'Linux'
  block:

    - name: Stat file on Linux
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
      register: stat_linux_reg

    - name: Test block size on Linux
      ansible.builtin.assert:
        that:
          - stat_linux_reg['stat']['block_size'] is defined
          - stat_linux_reg['stat']['block_size'] > 0
        msg: Linux should provide block_size

    - name: Test device info on Linux
      ansible.builtin.assert:
        that:
          - stat_linux_reg['stat']['dev'] is defined
          - stat_linux_reg['stat']['dev'] > 0
        msg: Linux should provide device number

- name: OpenBSD specific tests
  when: ansible_distribution == 'OpenBSD'
  block:

    - name: Stat file on OpenBSD
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
      register: stat_openbsd_reg

    - name: Verify basic fields on OpenBSD
      ansible.builtin.assert:
        that:
          - stat_openbsd_reg['stat']['exists']
          - stat_openbsd_reg['stat']['mode'] is defined
          - stat_openbsd_reg['stat']['size'] is defined
        msg: OpenBSD should provide basic stat fields

    - name: Test raw mode on OpenBSD
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
      register: stat_openbsd_raw_reg

    - name: Verify raw mode works on OpenBSD
      ansible.builtin.assert:
        that:
          - stat_openbsd_raw_reg['stat']['exists']
        msg: Raw mode should work on OpenBSD

- name: Cross-platform MIME tests
  block:

    - name: Test MIME detection with get_mime=true
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
        get_mime: true
      register: stat_mime_enabled_reg

    - name: Verify MIME fields when enabled
      ansible.builtin.assert:
        that:
          - stat_mime_enabled_reg['stat']['mimetype'] is defined
        msg: MIME type should be present when get_mime=true

    - name: Test MIME detection with get_mime=false
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
        get_mime: false
      register: stat_mime_disabled_reg

    - name: Verify MIME fields when disabled
      ansible.builtin.assert:
        that:
          - stat_mime_disabled_reg['stat']['mimetype'] is not defined
        msg: MIME type should not be present when get_mime=false

- name: Cross-platform attribute tests
  block:

    - name: Test attributes with get_attributes=true
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
        get_attributes: true
      register: stat_attr_enabled_reg

    - name: Verify attributes field exists when enabled
      ansible.builtin.assert:
        that:
          - stat_attr_enabled_reg['stat']['attributes'] is defined
        msg: Attributes field should exist when get_attributes=true

    - name: Test attributes with get_attributes=false
      o0_o.posix.stat:
        path: "{{ stat_test_dir }}/platform_test.txt"
        get_attributes: false
      register: stat_attr_disabled_reg

    - name: Verify xattrs not collected when disabled
      ansible.builtin.assert:
        that:
          - stat_attr_disabled_reg['stat']['xattrs'] is not defined
        msg: xattrs should not be collected when get_attributes=false
