- name: Create temporary directory for integration tests
  ansible.builtin.tempfile:
    state: directory
    suffix: stat_test
  register: test_tmpdir_reg

- name: Set files directory
  ansible.builtin.set_fact:
    files_dir: "{{ playbook_dir }}/targets/stat/files"

- name: Set test directory fact
  ansible.builtin.set_fact:
    stat_test_dir: "{{ test_tmpdir_reg['path'] }}"

- name: Gather minimal facts for platform detection
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution
      - system

- name: Try
  block:

    - name: Run stat test suite
      vars:
        test_sets:
          - basic_stat.yml
          - file_types.yml
          - checksums.yml
          - permissions.yml
          - symlinks.yml
          - aliases.yml
          - compare_modes.yml
      block:

        - name: Run test set with permutations of check_mode
          ansible.builtin.include_tasks: "{{ item[0] }}"
          loop: "{{ test_sets | ansible.builtin.product([true, false]) }}"
          vars:
            ansible_check_mode: "{{ item[1] }}"

    - name: Run timestamp tests (not permuted)
      ansible.builtin.include_tasks: timestamps.yml

    - name: Run platform-specific tests (not permuted)
      ansible.builtin.include_tasks: platform_specific.yml

  always:

    - name: Clean up temporary directory
      ansible.builtin.file:
        path: "{{ stat_test_dir }}"
        state: absent
