- name: Create test file for mode comparison
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/compare_test.txt"
    mode: '0644'
  check_mode: false

- name: Stat with builtin mode
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/compare_test.txt"
    _force_raw: false
  register: stat_builtin_reg

- name: Stat with raw mode
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/compare_test.txt"
    _force_raw: true
  register: stat_raw_reg

- name: Verify both modes return same file type flags
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['isreg'] == stat_raw_reg['stat']['isreg']
      - stat_builtin_reg['stat']['isdir'] == stat_raw_reg['stat']['isdir']
      - stat_builtin_reg['stat']['islnk'] == stat_raw_reg['stat']['islnk']
      - stat_builtin_reg['stat']['isblk'] == stat_raw_reg['stat']['isblk']
      - stat_builtin_reg['stat']['ischr'] == stat_raw_reg['stat']['ischr']
      - stat_builtin_reg['stat']['isfifo'] == stat_raw_reg['stat']['isfifo']
      - stat_builtin_reg['stat']['issock'] == stat_raw_reg['stat']['issock']
    msg: File type flags should match between modes

- name: Verify both modes return same mode
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['mode'] == stat_raw_reg['stat']['mode']
      - stat_builtin_reg['stat']['mode'] == '0644'
    msg: Mode should match between modes

- name: Verify both modes return same permission booleans
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['rusr'] == stat_raw_reg['stat']['rusr']
      - stat_builtin_reg['stat']['wusr'] == stat_raw_reg['stat']['wusr']
      - stat_builtin_reg['stat']['xusr'] == stat_raw_reg['stat']['xusr']
      - stat_builtin_reg['stat']['rgrp'] == stat_raw_reg['stat']['rgrp']
      - stat_builtin_reg['stat']['wgrp'] == stat_raw_reg['stat']['wgrp']
      - stat_builtin_reg['stat']['xgrp'] == stat_raw_reg['stat']['xgrp']
      - stat_builtin_reg['stat']['roth'] == stat_raw_reg['stat']['roth']
      - stat_builtin_reg['stat']['woth'] == stat_raw_reg['stat']['woth']
      - stat_builtin_reg['stat']['xoth'] == stat_raw_reg['stat']['xoth']
    msg: Permission booleans should match between modes

- name: Verify both modes return same uid/gid
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['uid'] == stat_raw_reg['stat']['uid']
      - stat_builtin_reg['stat']['gid'] == stat_raw_reg['stat']['gid']
      - stat_builtin_reg['stat']['pw_name'] == stat_raw_reg['stat']['pw_name']
      - stat_builtin_reg['stat']['gr_name'] == stat_raw_reg['stat']['gr_name']
    msg: Owner/group info should match between modes

- name: Verify both modes return same size
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['size'] == stat_raw_reg['stat']['size']
    msg: File size should match between modes

- name: Verify both modes return float timestamps
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['atime'] is float
      - stat_builtin_reg['stat']['mtime'] is float
      - stat_builtin_reg['stat']['ctime'] is float
      - stat_raw_reg['stat']['atime'] is float
      - stat_raw_reg['stat']['mtime'] is float
      - stat_raw_reg['stat']['ctime'] is float
    msg: Timestamps should be float in both modes

- name: Verify both modes have same checksum
  ansible.builtin.assert:
    that:
      - >-
        stat_builtin_reg['stat']['checksum'] ==
        stat_raw_reg['stat']['checksum']
    msg: Checksums should match between modes

- name: Verify both modes have same MIME type
  ansible.builtin.assert:
    that:
      - >-
        stat_builtin_reg['stat']['mimetype']
        == stat_raw_reg['stat']['mimetype']
      - >-
        stat_builtin_reg['stat']['charset']
        == stat_raw_reg['stat']['charset']
    msg: MIME type and charset should match between modes

- name: Verify both modes have platform-specific fields
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['attr_flags'] is defined
      - stat_builtin_reg['stat']['attributes'] is defined
      - stat_raw_reg['stat']['attr_flags'] is defined
      - stat_raw_reg['stat']['attributes'] is defined
    msg: Platform-specific fields should exist in both modes

- name: Verify builtin mode has generation and version fields
  ansible.builtin.assert:
    that:
      - stat_builtin_reg['stat']['generation'] is defined
      - stat_builtin_reg['stat']['version'] is defined
    msg: >-
      Builtin mode should have generation and version fields
      (raw mode excludes these as they require ioctl/statx)

- name: Count keys in builtin mode
  ansible.builtin.set_fact:
    builtin_key_count: "{{ stat_builtin_reg['stat'].keys() | length }}"

- name: Count keys in raw mode
  ansible.builtin.set_fact:
    raw_key_count: "{{ stat_raw_reg['stat'].keys() | length }}"

- name: Verify both modes return similar number of keys
  ansible.builtin.assert:
    that:
      - builtin_key_count | int >= 40
      - raw_key_count | int >= 40
    msg: Both modes should return comprehensive stat data
