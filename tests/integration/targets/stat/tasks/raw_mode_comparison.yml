# Compare builtin passthrough mode with raw mode

- name: Create test file for comparison
  ansible.builtin.copy:
    content: 'Test content for stat comparison'
    dest: '{{ stat_test_dir }}/compare_test.txt'
    mode: '0644'
  check_mode: false

- name: 'Compare modes: Regular file'
  block:
    - name: Stat regular file with both modes
      o0_o.posix.stat:
        path: '{{ stat_test_dir }}/compare_test.txt'
        _force_raw: '{{ item }}'
      loop: [false, true]
      register: stat_results_reg

    - name: Show differences for regular file
      ansible.builtin.include_tasks: compare_stat_results.yml

- name: 'Compare modes: Directory'
  block:
    - name: Stat directory with both modes
      o0_o.posix.stat:
        path: '{{ stat_test_dir }}'
        _force_raw: '{{ item }}'
      loop: [false, true]
      register: stat_results_reg

    - name: Show differences for directory
      ansible.builtin.include_tasks: compare_stat_results.yml

- name: Create symlink for comparison
  ansible.builtin.file:
    src: '{{ stat_test_dir }}/compare_test.txt'
    dest: '{{ stat_test_dir }}/compare_symlink'
    state: link
  check_mode: false

- name: 'Compare modes: Symlink (follow=true)'
  block:
    - name: Stat symlink with follow with both modes
      o0_o.posix.stat:
        path: '{{ stat_test_dir }}/compare_symlink'
        follow: true
        _force_raw: '{{ item }}'
      loop: [false, true]
      register: stat_results_reg

    - name: Show differences for symlink (follow=true)
      ansible.builtin.include_tasks: compare_stat_results.yml

- name: 'Compare modes: Symlink (follow=false)'
  block:
    - name: Stat symlink without follow with both modes
      o0_o.posix.stat:
        path: '{{ stat_test_dir }}/compare_symlink'
        follow: false
        _force_raw: '{{ item }}'
      loop: [false, true]
      register: stat_results_reg

    - name: Show differences for symlink (follow=false)
      ansible.builtin.include_tasks: compare_stat_results.yml

- name: 'Compare modes: System files'
  block:
    - name: Stat system file with both modes
      o0_o.posix.stat:
        path: '{{ item[1] }}'
        _force_raw: '{{ item[0] }}'
      loop: >-
        {{ [false, true] | product(['/etc/hosts', '/etc/passwd']) }}
      register: stat_all_results_reg

    - name: Compare each system file
      ansible.builtin.include_tasks: compare_stat_results.yml
      vars:
        stat_results_reg:
          results:
            - '{{ stat_all_results_reg["results"][idx | int] }}'
            - '{{ stat_all_results_reg["results"][idx | int + 1] }}'
      loop: [0, 2]
      loop_control:
        loop_var: idx
