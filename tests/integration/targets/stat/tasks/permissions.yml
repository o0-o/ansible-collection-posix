- name: Verify setuid bit
  ansible.builtin.assert:
    that:
      - stat_setuid_reg['stat']['mode'] == '4755'
      - stat_setuid_reg['stat']['isuid']
      - not stat_setuid_reg['stat']['isgid']
    msg: Setuid bit should be correctly reported

