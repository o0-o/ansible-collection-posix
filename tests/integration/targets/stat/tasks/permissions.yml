- name: Create file with 0644 permissions
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/perm_test_0644.txt"
    mode: '0644'
  check_mode: false

- name: Stat file with 0644
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/perm_test_0644.txt"
    _force_raw: "{{ _force_raw }}"
  register: stat_0644_reg

- name: Verify 0644 permissions
  ansible.builtin.assert:
    that:
      - stat_0644_reg['stat']['mode'] == '0644'
      - stat_0644_reg['stat']['rusr']
      - stat_0644_reg['stat']['wusr']
      - not stat_0644_reg['stat']['xusr']
      - stat_0644_reg['stat']['rgrp']
      - not stat_0644_reg['stat']['wgrp']
      - not stat_0644_reg['stat']['xgrp']
      - stat_0644_reg['stat']['roth']
      - not stat_0644_reg['stat']['woth']
      - not stat_0644_reg['stat']['xoth']
    msg: 0644 permissions should be correctly reported

