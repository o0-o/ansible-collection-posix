- name: Create file with setuid bit
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/perm_test_setuid.txt"
    mode: '4755'
  check_mode: false

- name: Stat file with setuid
  o0_o.posix.stat:
