- name: Create directory with sticky bit
  ansible.builtin.file:
    path: "{{ stat_test_dir }}/sticky_dir"
    state: directory
    mode: '1777'
  check_mode: false

- name: Stat directory with sticky bit
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/sticky_dir"
    _force_raw: "{{ _force_raw }}"
  register: stat_sticky_reg

- name: Verify sticky bit
  ansible.builtin.assert:
    that:
      - stat_sticky_reg['stat']['mode'] == '1777'
      - stat_sticky_reg['stat']['mode'][0] == '1'
    msg: Sticky bit should be correctly reported
