# Compare o0_o.posix.stat modes (builtin passthrough vs raw mode)
#
# Expected input: stat_results_reg with .results[0] = builtin mode,
#                                      .results[1] = raw mode

- name: Compare stat results and show differences
  ansible.builtin.debug:
    msg: |
      Field mismatch: {{ item }}
        builtin mode (_force_raw=false): {{ builtin_value }}
        raw mode (_force_raw=true):      {{ raw_value }}
  vars:
    excluded_fields_var:
      - atime
      - ctime
      - mtime
      - version
      - generation
    builtin_stat_var: '{{ stat_results_reg["results"][0]["stat"] }}'
    raw_stat_var: '{{ stat_results_reg["results"][1]["stat"] }}'
    all_fields_var: >-
      {{ (builtin_stat_var.keys() | list +
          raw_stat_var.keys() | list)
         | difference(excluded_fields_var)
         | unique
         | sort }}
    builtin_value: '{{ builtin_stat_var[item] | d("UNDEFINED") }}'
    raw_value: '{{ raw_stat_var[item] | d("UNDEFINED") }}'
  loop: '{{ all_fields_var }}'
  when: builtin_value != raw_value
