- name: Remove timestamp test file if it exists
  ansible.builtin.file:
    path: "{{ stat_test_dir }}/timestamp_test.txt"
    state: absent
  check_mode: false

- name: Create file for timestamp tests
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/timestamp_test.txt"
    mode: '0644'
  check_mode: false

- name: Stat file for timestamp test
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/timestamp_test.txt"
  register: stat_time1_reg

- name: Verify timestamp fields exist and are floats
  ansible.builtin.assert:
    that:
      - stat_time1_reg['stat']['atime'] is defined
      - stat_time1_reg['stat']['mtime'] is defined
      - stat_time1_reg['stat']['ctime'] is defined
      - stat_time1_reg['stat']['atime'] is float
      - stat_time1_reg['stat']['mtime'] is float
      - stat_time1_reg['stat']['ctime'] is float
    msg: Timestamps should exist and be float type

- name: Verify timestamps are reasonable (not zero or negative)
  ansible.builtin.assert:
    that:
      - stat_time1_reg['stat']['atime'] > 0
      - stat_time1_reg['stat']['mtime'] > 0
      - stat_time1_reg['stat']['ctime'] > 0
    msg: Timestamps should be positive non-zero values

- name: Sleep for 2 seconds
  ansible.builtin.pause:
    seconds: 2
  check_mode: false

- name: Modify file
  ansible.builtin.shell:
    cmd: "echo 'New line added' >> {{ stat_test_dir }}/timestamp_test.txt"
  check_mode: false

- name: Stat file after modification
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/timestamp_test.txt"
  register: stat_time2_reg

- name: Verify mtime updated after modification
  ansible.builtin.assert:
    that:
      - stat_time2_reg['stat']['mtime'] > stat_time1_reg['stat']['mtime']
    msg: mtime should be updated after file modification

- name: Verify ctime updated after modification
  ansible.builtin.assert:
    that:
      - stat_time2_reg['stat']['ctime'] >= stat_time1_reg['stat']['ctime']
    msg: ctime should be updated or same after modification

- name: Check for birthtime (platform-specific)
  when: ansible_system == 'Darwin' or ansible_distribution == 'FreeBSD'
  block:

    - name: Verify birthtime exists on supported platforms
      ansible.builtin.assert:
        that:
          - stat_time1_reg['stat']['birthtime'] is defined
          - stat_time1_reg['stat']['birthtime'] is float
        msg: birthtime should exist on macOS and FreeBSD

    - name: Verify birthtime does not change after modification
      ansible.builtin.assert:
        that:
          - >-
            (stat_time2_reg['stat']['birthtime'] | float)
            == (stat_time1_reg['stat']['birthtime'] | float)
        msg: birthtime should remain constant after file modification
