- name: Copy test file to temporary directory
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/test.txt"
    mode: '0644'
  check_mode: false

- name: Stat the test file
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/test.txt"
    _force_raw: "{{ _force_raw }}"
  register: stat_reg

- name: Assert raw is expected value
  ansible.builtin.assert:
    that:
      - stat_reg['raw'] == _force_raw
    msg: Raw flag should match force_raw parameter

- name: Verify basic stat fields exist
  ansible.builtin.assert:
    that:
      - stat_reg['stat']['exists']
      - stat_reg['stat']['path'] is defined
      - stat_reg['stat']['mode'] is defined
      - stat_reg['stat']['size'] is defined
      - stat_reg['stat']['uid'] is defined
      - stat_reg['stat']['gid'] is defined
      - stat_reg['stat']['pw_name'] is defined
      - stat_reg['stat']['gr_name'] is defined
    msg: Basic stat fields should be present

- name: Verify file type flags
  ansible.builtin.assert:
    that:
      - stat_reg['stat']['isreg']
      - not stat_reg['stat']['isdir']
      - not stat_reg['stat']['islnk']
      - not stat_reg['stat']['isblk']
      - not stat_reg['stat']['ischr']
      - not stat_reg['stat']['isfifo']
      - not stat_reg['stat']['issock']
    msg: File type flags should indicate regular file

- name: Verify mode is 4-digit octal
  ansible.builtin.assert:
    that:
      - stat_reg['stat']['mode'] | length == 4
      - stat_reg['stat']['mode'] is regex('^[0-7]{4}$')
    msg: Mode should be 4-digit octal string

- name: Verify timestamps are floats
  ansible.builtin.assert:
    that:
      - stat_reg['stat']['atime'] is float
      - stat_reg['stat']['mtime'] is float
      - stat_reg['stat']['ctime'] is float
    msg: Timestamps should be float type

- name: Verify permission booleans
  ansible.builtin.assert:
    that:
      - stat_reg['stat']['rusr'] is defined
      - stat_reg['stat']['wusr'] is defined
      - stat_reg['stat']['xusr'] is defined
      - stat_reg['stat']['rgrp'] is defined
      - stat_reg['stat']['wgrp'] is defined
      - stat_reg['stat']['xgrp'] is defined
      - stat_reg['stat']['roth'] is defined
      - stat_reg['stat']['woth'] is defined
      - stat_reg['stat']['xoth'] is defined
    msg: Permission booleans should be present

- name: Verify platform-specific fields have defaults
  ansible.builtin.assert:
    that:
      - stat_reg['stat']['attr_flags'] is defined
      - stat_reg['stat']['attributes'] is defined
    msg: Platform-specific fields should have default values

- name: Test non-existent file
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/nonexistent.txt"
    _force_raw: "{{ _force_raw }}"
  register: stat_noexist_reg

- name: Verify non-existent file returns exists=false
  ansible.builtin.assert:
    that:
      - not stat_noexist_reg['stat']['exists']
      - stat_noexist_reg is not failed
    msg: Non-existent file should return exists=false without error
