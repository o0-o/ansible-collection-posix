- name: Create target file for symlink tests
  ansible.builtin.copy:
    src: files/test.txt
    dest: "{{ stat_test_dir }}/symlink_target.txt"
    mode: '0644'
  check_mode: false

- name: Create symlink to file
  ansible.builtin.file:
    src: "{{ stat_test_dir }}/symlink_target.txt"
    dest: "{{ stat_test_dir }}/symlink_to_file.txt"
    state: link
  check_mode: false

- name: Stat symlink with follow=false
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink_to_file.txt"
    follow: false
    _force_raw: "{{ _force_raw }}"
  register: stat_symlink_nofollow_reg

- name: Verify symlink properties without following
  ansible.builtin.assert:
    that:
      - stat_symlink_nofollow_reg['stat']['exists']
      - stat_symlink_nofollow_reg['stat']['islnk']
      - not stat_symlink_nofollow_reg['stat']['isreg']
    msg: Should identify as symlink when follow=false

- name: Stat symlink with follow=true (explicit)
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink_to_file.txt"
    follow: true
    _force_raw: "{{ _force_raw }}"
  register: stat_symlink_follow_reg

- name: Verify target properties when following
  ansible.builtin.assert:
    that:
      - stat_symlink_follow_reg['stat']['exists']
      - stat_symlink_follow_reg['stat']['isreg']
      - not stat_symlink_follow_reg['stat']['islnk']
    msg: Should identify target as regular file when follow=true

- name: Stat symlink using follow parameter (explicit true)
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink_to_file.txt"
    follow: true
    _force_raw: "{{ _force_raw }}"
  register: stat_symlink_explicit_follow_reg

- name: Verify explicit follow=true is consistent
  ansible.builtin.assert:
    that:
      - >-
        stat_symlink_explicit_follow_reg['stat']['isreg']
        == stat_symlink_follow_reg['stat']['isreg']
      - >-
        stat_symlink_explicit_follow_reg['stat']['islnk']
        == stat_symlink_follow_reg['stat']['islnk']
    msg: Follow=true results should be consistent

- name: Create broken symlink
  ansible.builtin.file:
    src: "{{ stat_test_dir }}/nonexistent_target.txt"
    dest: "{{ stat_test_dir }}/broken_symlink.txt"
    state: link
    force: true
  check_mode: false

- name: Stat broken symlink with follow=false
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/broken_symlink.txt"
    follow: false
    _force_raw: "{{ _force_raw }}"
  register: stat_broken_nofollow_reg

- name: Verify broken symlink exists when not following
  ansible.builtin.assert:
    that:
      - stat_broken_nofollow_reg['stat']['exists']
      - stat_broken_nofollow_reg['stat']['islnk']
    msg: Broken symlink should exist when follow=false

- name: Stat broken symlink with follow=true
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/broken_symlink.txt"
    follow: true
    _force_raw: "{{ _force_raw }}"
  register: stat_broken_follow_reg

- name: Verify broken symlink target does not exist
  ansible.builtin.assert:
    that:
      - not stat_broken_follow_reg['stat']['exists']
    msg: Broken symlink target should not exist when follow=true

- name: Create directory for symlink
  ansible.builtin.file:
    path: "{{ stat_test_dir }}/target_dir"
    state: directory
    mode: '0755'
  check_mode: false

- name: Create symlink to directory
  ansible.builtin.file:
    src: "{{ stat_test_dir }}/target_dir"
    dest: "{{ stat_test_dir }}/symlink_to_dir"
    state: link
  check_mode: false

- name: Stat symlink to directory with follow=false
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink_to_dir"
    follow: false
    _force_raw: "{{ _force_raw }}"
  register: stat_dirsymlink_nofollow_reg

- name: Verify symlink to directory is identified as symlink
  ansible.builtin.assert:
    that:
      - stat_dirsymlink_nofollow_reg['stat']['exists']
      - stat_dirsymlink_nofollow_reg['stat']['islnk']
      - not stat_dirsymlink_nofollow_reg['stat']['isdir']
    msg: Symlink to directory should be identified as symlink

- name: Stat symlink to directory with follow=true
  o0_o.posix.stat:
    path: "{{ stat_test_dir }}/symlink_to_dir"
    follow: true
    _force_raw: "{{ _force_raw }}"
  register: stat_dirsymlink_follow_reg

- name: Verify symlink target is identified as directory
  ansible.builtin.assert:
    that:
      - stat_dirsymlink_follow_reg['stat']['exists']
      - stat_dirsymlink_follow_reg['stat']['isdir']
      - not stat_dirsymlink_follow_reg['stat']['islnk']
    msg: Should identify target as directory when follow=true
