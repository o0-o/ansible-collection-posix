# What a gather_subset selects, asserted by the names each selection
# publishes and the names it leaves alone. Every subset is asked for
# by the name the module resolves: uname, environment, limits,
# timezone, compliance, config, dmidecode, mounts, fstab, users, and
# the groups min, all and storage.

- name: Gather the smallest useful subset
  o0_o.posix.facts:
    gather_subset: [min]
  register: facts_min_reg

# min is uname, environment, timezone and compliance: what a host can
# say about itself before anything is read from a file. It is the one
# selection that publishes o0_users without the users subset, so the
# entry it publishes is the environment of the user the gather ran as
# and nothing else about them.
- name: Assert min gathers an identity's environment and no more
  vars:
    gathered: "{{ facts_min_reg['ansible_facts'] }}"
    entry: "{{ gathered['o0_users'][facts_uid] }}"
    homes: >-
      {{ gathered['o0_paths'] | dict2items
         | rejectattr('value', 'none')
         | selectattr('value.tags', 'defined')
         | selectattr('value.tags', 'contains', 'home') | list }}
  ansible.builtin.assert:
    that:
      - gathered['o0_os']['kernel'] is mapping
      - gathered['o0_os']['timezone'] is mapping
      - gathered['o0_os']['compliance'] is mapping
      - gathered['o0_network']['hostname'] is mapping
      - gathered['o0_hardware']['baseboard'] is mapping
      # The environment is keyed on the uid the gather ran as
      - gathered['o0_users'].keys() | list == [facts_uid]
      - entry['uid'] is integer
      - entry['uid'] == facts_uid | int
      - entry['environment']['PATH'] is string
      - entry['environment']['PATH'] | length > 0
      # Derived from LC_ALL or LANG, and never left as the C locale
      - entry['locale'] is string
      - entry['locale'] not in ['C', 'POSIX']
      # What min deliberately lacks: everything read from a file
      - entry['name'] is not defined
      - entry['home'] is not defined
      - entry['shell'] is not defined
      - gathered['o0_storage'] is not defined
      - gathered['o0_groups'] is not defined
      - gathered['o0_os']['config'] is not defined
      - entry['limits'] is not defined
      - entry['umask'] is not defined
      # The compliance sweep fills the path store, so the store is
      # here; the homes and the files only the other subsets read are
      # not
      - gathered['o0_paths'] is mapping
      - gathered['o0_paths']['/etc/shells'] is not defined
      - gathered['o0_paths']['/etc/fstab'] is not defined
      - homes | length == 0
    fail_msg: >-
      min did not select uname, environment, timezone and compliance
      alone: {{ gathered.keys() | list | sort }}

- name: Gather the environment alone
  o0_o.posix.facts:
    gather_subset: [environment]
  register: facts_env_reg

- name: Assert the environment subset publishes one user and one uid
  vars:
    gathered: "{{ facts_env_reg['ansible_facts'] }}"
    entry: "{{ gathered['o0_users'][facts_uid] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_users']
      - gathered['o0_users'] | length == 1
      - entry.keys() | list | sort
        == ['environment', 'evidence', 'locale', 'uid']
      - entry['environment']['HOME'] is string
      - entry['environment'] | length > 0
      # A variable is asked for by a shell snippet rather than by an
      # argv of its own, so the subset names what ran it and the id
      # that says whose answers these are
      - entry['evidence']['commands'] == ['id', 'sh']
      - entry['evidence']['files'] is not defined
    fail_msg: >-
      the environment subset published more than an identity's
      environment: {{ gathered.keys() | list | sort }}

- name: Gather what uname reported
  o0_o.posix.facts:
    gather_subset: [uname]
  register: facts_uname_reg

# One command answers for three namespaces, and for nothing else in
# any of them.
- name: Assert uname sorts its answer into three namespaces
  vars:
    gathered: "{{ facts_uname_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list | sort
        == ['o0_hardware', 'o0_network', 'o0_os']
      - gathered['o0_os'].keys() | list | sort == ['evidence', 'kernel']
      - gathered['o0_network'].keys() | list | sort
        == ['evidence', 'hostname']
      - gathered['o0_hardware'].keys() | list | sort
        == ['baseboard', 'evidence']
      - gathered['o0_hardware']['baseboard']['architecture'] is string
      - gathered['o0_users'] is not defined
      # One command answered for all three, and each of the three
      # says so rather than leaving a reader to know it
      - gathered['o0_os']['evidence']['commands'] == ['uname']
      - gathered['o0_network']['evidence']['commands'] == ['uname']
      - gathered['o0_hardware']['evidence']['commands'] == ['uname']
    fail_msg: >-
      uname did not publish the kernel, the hostname and the
      architecture alone: {{ gathered }}

- name: Gather the timezone alone
  o0_o.posix.facts:
    gather_subset: [timezone]
  register: facts_tz_reg

- name: Assert the timezone subset publishes an offset under o0_os
  vars:
    gathered: "{{ facts_tz_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_os']
      - gathered['o0_os'].keys() | list | sort == ['evidence', 'timezone']
      - gathered['o0_os']['timezone']['abbreviation'] is string
      - gathered['o0_os']['timezone']['offset']
        is match('^[+-][0-9]{4}$')
      - gathered['o0_os']['evidence']['commands'] == ['date']
    fail_msg: >-
      the timezone subset published something else: {{ gathered }}

- name: Gather the host's configuration alone
  o0_o.posix.facts:
    gather_subset: [config]
  register: facts_config_reg

# The sweep asks getconf and nothing else, so it publishes one key of
# one namespace. It is not in min: min is what one round trip answers,
# and a variable at a time is more commands than that.
- name: Assert the config subset publishes getconf's answers alone
  vars:
    gathered: "{{ facts_config_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_os']
      - gathered['o0_os'].keys() | list | sort == ['config', 'evidence']
      - gathered['o0_os']['config']['ARG_MAX'] is integer
      - gathered['o0_os']['config']['PATH'] is string
      # These variables are the fact, not evidence for one, so the
      # namespace names what was consulted and nothing more
      - gathered['o0_os']['evidence']['commands'] == ['getconf']
      - gathered['o0_os']['evidence']['config'] is not defined
    fail_msg: >-
      the config subset published something else: {{ gathered }}

- name: Gather the limits and mask of the connecting user alone
  o0_o.posix.facts:
    gather_subset: [limits]
  register: facts_limits_reg

# A user-scoped subset, so it publishes one entry under one uid and
# files its two facts as fields of that entry rather than nesting the
# mask inside the limits.
- name: Assert the limits subset publishes one user's two shell facts
  vars:
    gathered: "{{ facts_limits_reg['ansible_facts'] }}"
    entry: "{{ gathered['o0_users'][facts_uid] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_users']
      - gathered['o0_users'].keys() | list == [facts_uid]
      - entry.keys() | list | sort
        == ['evidence', 'limits', 'uid', 'umask']
      - entry['evidence']['commands'] == ['id', 'sh']
      - entry['uid'] == facts_uid | int
      - entry['umask'] is match('^0[0-7]{3}$')
      - entry['limits'] is mapping
      - entry['limits'] | length > 0
      # The mask is a field of the user, not a part of the limits
      - entry['limits']['umask'] is not defined
      # Nothing the users subset reads from a file is here
      - entry['name'] is not defined
      - entry['shell'] is not defined
    fail_msg: >-
      the limits subset published something else: {{ gathered }}

- name: Gather the users of the host alone
  o0_o.posix.facts:
    gather_subset: [users]
  register: facts_users_reg

# One subset, five facts: the users and groups it composes, the
# shells they hold, the login shells the host names and what running
# one produced, and the path store carrying the homes they live in
# and the file the host names its login shells in. A gather that
# published fewer than all of them was what made the idiom the users
# module documents unanswerable.
- name: Assert the users subset publishes all five of its facts
  vars:
    gathered: "{{ facts_users_reg['ansible_facts'] }}"
    expected: >-
      {{ ['o0_groups', 'o0_paths', 'o0_shells', 'o0_users'] }}
  ansible.builtin.assert:
    that:
      - gathered.keys() | list | sort == expected | sort
      - gathered['o0_users']['0']['name'] == 'root'
      - gathered['o0_users']['0']['uid'] is integer
      - gathered['o0_groups'][
          gathered['o0_users']['0']['gid'] | string
        ]['members'] is sequence
      - gathered['o0_os'] is not defined
      # The subset that reads /etc/shells is the one that runs one
      - gathered['o0_shells']['/bin/sh']['/dev/null'] is mapping
    fail_msg: >-
      the users subset did not publish its five facts:
      {{ gathered.keys() | list | sort }}

# The subset reads the homes its users name and one file of its own,
# so the store it publishes holds those paths and nothing the
# compliance sweep would have filled in beside them.
- name: Assert the users subset files the paths it read and no others
  vars:
    gathered: "{{ facts_users_reg['ansible_facts'] }}"
    paths: "{{ gathered['o0_paths'] }}"
    homes: >-
      {{ gathered['o0_users'] | dict2items
         | map(attribute='value.home') | select('string') | list }}
    strangers: >-
      {{ paths.keys() | reject('in', homes)
         | reject('equalto', '/etc/shells') | list }}
  ansible.builtin.assert:
    that:
      # Every home a user names is a key of the store, and a home
      # that is not there is a null rather than a silence
      - homes | reject('in', paths.keys() | list) | list | length == 0
      # A linked home files its target too, so the only keys that are
      # neither a home nor the shells file are the targets of links
      - strangers | reject('match', '^/') | list | length == 0
    fail_msg: >-
      the users subset filed paths it never read: {{ strangers }}

- name: Assert the users subset files the shells file at its own path
  when: facts_has_shells | bool
  vars:
    entry: >-
      {{ facts_users_reg['ansible_facts']['o0_paths']['/etc/shells'] }}
  ansible.builtin.assert:
    that:
      - entry['content'] is string
      - entry['config'] is sequence
      - entry['config'] is not string
    fail_msg: >-
      the users subset did not file /etc/shells at its own path:
      {{ entry }}

- name: Gather the compliance of the host alone
  o0_o.posix.facts:
    gather_subset: [compliance]
  register: facts_compliance_reg

- name: Assert compliance publishes two namespaces and no bare name
  vars:
    gathered: "{{ facts_compliance_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - >-
        gathered.keys() | list | sort
        == ['o0_os', 'o0_paths', 'o0_shells']
      - gathered['o0_os'].keys() | list == ['compliance']
      # A builtin resolves to no file, so it is a fact about the shell
      # that answers it rather than about any path
      - gathered['o0_shells']['/bin/sh']['builtins'] is sequence
      - "'builtins' not in gathered['o0_paths']['/bin/sh']"
      - gathered['compliance'] is not defined
      - gathered['shells'] is not defined
      - gathered['paths'] is not defined
      - gathered['missing_commands'] is not defined
      - gathered['o0_missing'] is not defined
    fail_msg: >-
      the compliance subset is not published under its o0_ names:
      {{ gathered.keys() | list | sort }}

- name: Gather the mounts of the host alone
  o0_o.posix.facts:
    gather_subset: [mounts]
  register: facts_mounts_reg

- name: Assert the mounts subset publishes storage and nothing else
  vars:
    gathered: "{{ facts_mounts_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_storage']
      - gathered['o0_storage'].keys() | list | sort
        == ['evidence', 'mounts']
      - gathered['o0_storage']['mounts']['/'] is mapping
      # One enumeration answered for every mount there is, so the
      # namespace names it once rather than each mount naming it over,
      # and beside it the interface each filesystem was asked through
      - gathered['o0_storage']['evidence']['commands']
        == ['df', 'getconf', 'mount']
    fail_msg: >-
      the mounts subset published something else: {{ gathered }}

- name: Gather the whole storage group
  o0_o.posix.facts:
    gather_subset: [storage]
  register: facts_storage_reg

# storage names mounts and fstab, and all names storage: a group that
# names a group is expanded until only subsets are left, which is why
# a default gather reaches the mounts of a host at all. The two
# subsets answer in two namespaces now, because what is mounted and
# what the host is configured to mount are two facts.
- name: Assert the storage group expands to the subsets it names
  vars:
    gathered: "{{ facts_storage_reg['ansible_facts'] }}"
    expected: >-
      {{ ['o0_storage'] + (['o0_paths'] if facts_has_fstab | bool
         else []) }}
  ansible.builtin.assert:
    that:
      - gathered.keys() | list | sort == expected | sort
      - gathered['o0_storage'].keys() | list | sort
        == ['evidence', 'mounts']
      - not facts_has_fstab | bool or
        gathered['o0_paths']['/etc/fstab']['config'] is sequence
    fail_msg: >-
      the storage group did not expand to mounts and fstab:
      {{ gathered.keys() | list | sort }}

- name: Gather the filesystem table alone
  o0_o.posix.facts:
    gather_subset: [fstab]
  register: facts_fstab_reg

- name: Assert the fstab subset reads the table the host keeps
  when: facts_has_fstab | bool
  vars:
    gathered: "{{ facts_fstab_reg['ansible_facts'] }}"
    table: "{{ gathered['o0_paths']['/etc/fstab'] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_paths']
      - gathered['o0_paths'].keys() | list == ['/etc/fstab']
      - table['content'] is string
      - table['config'] is sequence
    fail_msg: >-
      the fstab subset did not read /etc/fstab: {{ gathered }}

# A subset with nothing to read publishes nothing at all: not an
# empty namespace, which would read as a host that mounts nothing by
# configuration.
- name: Assert a host with no fstab publishes nothing for one
  when: not facts_has_fstab | bool
  ansible.builtin.assert:
    that:
      - facts_fstab_reg['ansible_facts'] == {}
    fail_msg: >-
      the fstab subset published a namespace with no fstab to read:
      {{ facts_fstab_reg['ansible_facts'] }}

- name: Gather the firmware tables alone
  o0_o.posix.facts:
    gather_subset: [dmidecode]
  register: facts_dmidecode_gather_reg

# Both producers read the firmware tables through one processor, so
# the fact a gather publishes is the reading the module returns.
- name: Assert dmidecode publishes the hardware both producers read
  when: facts_has_dmidecode | bool
  vars:
    gathered: "{{ facts_dmidecode_gather_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - gathered.keys() | list == ['o0_hardware']
      - gathered['o0_hardware'] == facts_dmidecode_reg['hardware']
    fail_msg: >-
      the gather and the module disagree about the firmware tables

- name: Assert a host without dmidecode publishes no hardware for it
  when: not facts_has_dmidecode | bool
  ansible.builtin.assert:
    that:
      - facts_dmidecode_gather_reg['ansible_facts'] == {}
    fail_msg: >-
      the dmidecode subset published a namespace it could not read:
      {{ facts_dmidecode_gather_reg['ansible_facts'] }}

- name: Gather everything except the firmware tables
  o0_o.posix.facts:
    gather_subset: ['!dmidecode']
  register: facts_no_dmidecode_reg

# A selection of negations alone starts from every subset there is and
# takes the named ones away, so it can never reach further than all
# does. It did, once, because all named a group that was never
# expanded: the negated selection gathered the storage the default
# gather had silently dropped.
- name: Assert a negation reaches no further than all does
  vars:
    all_keys: "{{ facts_all_reg['ansible_facts'].keys() | list }}"
    no_dmidecode_keys: >-
      {{ facts_no_dmidecode_reg['ansible_facts'].keys() | list }}
  ansible.builtin.assert:
    that:
      - no_dmidecode_keys | difference(all_keys) | length == 0
      # dmidecode adds fields to o0_hardware, never a namespace of
      # its own, so the two selections publish the same names
      - all_keys | difference(no_dmidecode_keys) | length == 0
    fail_msg: >-
      ['!dmidecode'] and ['all'] disagree about what is published:
      {{ no_dmidecode_keys | symmetric_difference(all_keys) }}

- name: Gather everything except the users
  o0_o.posix.facts:
    gather_subset: ['all', '!users']
  register: facts_no_users_reg

- name: Assert a subset named after all is taken out of all
  vars:
    gathered: "{{ facts_no_users_reg['ansible_facts'] }}"
    homes: >-
      {{ gathered['o0_paths'] | dict2items
         | rejectattr('value', 'none')
         | selectattr('value.tags', 'defined')
         | selectattr('value.tags', 'contains', 'home') | list }}
  ansible.builtin.assert:
    that:
      - gathered['o0_storage']['mounts'] is mapping
      - gathered['o0_groups'] is not defined
      - gathered['o0_paths']['/etc/shells'] is not defined
      - homes | length == 0
      # environment is still selected, and it is what keys o0_users
      - gathered['o0_users'].keys() | list == [facts_uid]
    fail_msg: >-
      ['all', '!users'] still published the users:
      {{ gathered.keys() | list | sort }}

- name: Gather nothing at all
  o0_o.posix.facts:
    gather_subset: ['!all']
  register: facts_none_reg

- name: Assert a gather of nothing publishes nothing
  ansible.builtin.assert:
    that:
      - facts_none_reg['ansible_facts'] == {}
      - facts_none_reg['changed'] == false
    fail_msg: >-
      ['!all'] published facts: {{ facts_none_reg['ansible_facts'] }}

# A gather reads and never writes, so check mode changes nothing about
# what it does: the module declares support for it and then asks the
# run plugin to run the commands anyway. The facts are the same facts.
- name: Gather under check mode
  o0_o.posix.facts:
    gather_subset: [uname]
  check_mode: true
  register: facts_check_reg

- name: Assert check mode gathers the same facts and changes nothing
  ansible.builtin.assert:
    that:
      - facts_check_reg['changed'] == false
      - facts_check_reg['ansible_facts']['o0_os']['kernel']
        == facts_all_reg['ansible_facts']['o0_os']['kernel']
    fail_msg: >-
      a gather under check mode did not answer with the kernel the
      host reported outside it
