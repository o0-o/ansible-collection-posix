# A name the module cannot resolve is refused before a single command
# runs, and the refusal names the name.
- name: 'Fail: A subset the module has no producer for'
  block:

    - name: Ask for a subset by a name no table holds
      o0_o.posix.facts:
        gather_subset: [bogus]

    - name: Sentinel for the unresolvable subset task
      ansible.builtin.fail:
        msg: 'the facts module gathered a subset it does not have'

  rescue:

    - name: Assert the unresolvable subset was refused by name
      ansible.builtin.assert:
        that:
          - >-
            'Invalid gather_subset' in ansible_failed_result['msg']
          - "'bogus' in ansible_failed_result['msg']"
          - ansible_failed_result['ansible_facts'] is not defined
        fail_msg: >-
          the refusal did not name the subset it refused:
          {{ ansible_failed_result['msg'] }}
