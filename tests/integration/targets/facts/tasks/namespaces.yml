# The shape of every namespace the default gather published, read from
# the run registered in main.yml.

- name: Assert the kernel is named the way the collection names one
  vars:
    kernel: "{{ facts_all_reg['ansible_facts']['o0_os']['kernel'] }}"
  ansible.builtin.assert:
    that:
      # pretty is what uname printed; name is that, folded
      - kernel['pretty'] is string
      - kernel['pretty'] | length > 0
      - kernel['name'] == (kernel['pretty'] | lower | replace(' ', '_'))
      - kernel['version']['id'] is string
      - kernel['version']['id'] | length > 0
    fail_msg: 'o0_os.kernel is not the shape uname composes: {{ kernel }}'

- name: Assert the timezone is an abbreviation and an offset
  vars:
    tz: "{{ facts_all_reg['ansible_facts']['o0_os']['timezone'] }}"
  ansible.builtin.assert:
    that:
      - tz['abbreviation'] is string
      - tz['abbreviation'] | length > 0
      - tz['offset'] is match('^[+-][0-9]{4}$')
      # The names an older target asserted and no producer ever emitted
      - tz['name'] is not defined
      - tz['abbr'] is not defined
    fail_msg: 'o0_os.timezone is not the shape date composes: {{ tz }}'

# Several subsets answer under one namespace, and each names what it
# consulted, so the namespace's evidence is the union of theirs rather
# than whichever of them answered last.
- name: Assert every namespace names what was consulted for it
  vars:
    facts: "{{ facts_all_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      # uname answers for three namespaces and each of the three says
      # so; the clock and the configuration sweep answer for o0_os
      # beside it
      - facts['o0_os']['evidence']['commands']
        == ['date', 'getconf', 'uname']
      - facts['o0_network']['evidence']['commands'] == ['uname']
      - facts['o0_hardware']['evidence']['commands'] is sequence
      - "'uname' in facts['o0_hardware']['evidence']['commands']"
      # Compliance keeps its own, one per standard, because that is
      # the level a compliance verdict's provenance varies at
      - facts['o0_os']['compliance']['xsh']['evidence'] is mapping
      # No namespace reads a file or publishes a variable as evidence
      # for itself
      - facts['o0_os']['evidence']['files'] is not defined
      - facts['o0_os']['evidence']['config'] is not defined
    fail_msg: >-
      a namespace does not name what was consulted for it:
      {{ facts['o0_os']['evidence'] | default('none') }}

- name: Assert every standard the compliance subset reads is named
  vars:
    compliance: >-
      {{ facts_all_reg['ansible_facts']['o0_os']['compliance'] }}
    standards: >-
      {{ ['posix', 'sus', 'xcu', 'xsh', 'xsi']
         | map('extract', compliance) | list }}
    supports: >-
      {{ standards | map(attribute='supported', default=none) | list }}
  ansible.builtin.assert:
    that:
      - compliance.keys() | list | sort == ['evidence', 'origins',
        'posix', 'sh_posix_compliant', 'sus', 'xcu', 'xsh', 'xsi']
      - compliance['xsh']['name'] == 'System Interfaces'
      - compliance['xsh']['abbreviation'] == 'XSH'
      - compliance['xcu']['abbreviation'] == 'XCU'
      - compliance['xsi']['abbreviation'] == 'XSI'
      - compliance['posix']['abbreviation'] == 'POSIX'
      - compliance['sus']['abbreviation'] == 'SUS'
      # A standard is supported, unsupported, or supported in part
      - supports | reject('in', [true, false, 'partial'])
        | list | length == 0
      # Every standard names what decided it, in the two kinds of the
      # vocabulary compliance attempts. It reads no files, so the
      # third kind is absent rather than carried empty
      - standards | rejectattr('evidence.commands', 'defined')
        | list | length == 0
      - standards | rejectattr('evidence.config', 'defined')
        | list | length == 0
      - standards | selectattr('evidence.files', 'defined')
        | list | length == 0
      # A command origin is the name a command is known by: XSI is
      # asked two variables and looks for four utilities, and one
      # name answers for every invocation of one command
      - standards | map(attribute='evidence.commands')
        | flatten | reject('string') | list | length == 0
      # Each of the two standards with required commands says which
      # of them the host did not have, empty where it had them all
      - compliance['xcu']['missing'] is sequence
      - compliance['xsi']['missing'] is sequence
      - compliance['xcu']['missing'] is not string
      - compliance['xsi']['missing'] is not string
      # The one behavioral probe publishes its verdict beside them,
      # and the namespace names the probe beside the verdict
      - compliance['sh_posix_compliant'] is boolean
      - compliance['evidence']['commands'] == ['sh']
    fail_msg: >-
      o0_os.compliance does not name the standards it read, or one of
      them will not say whether it is supported: {{ supports }}

# POSIX's own configuration interface, asked one variable at a time.
# A variable the host does not know is absent; one it has and does not
# limit is present and null. Neither is invented and neither is a
# failure.
- name: Assert the host's configuration is what getconf answered
  vars:
    config: "{{ facts_all_reg['ansible_facts']['o0_os']['config'] }}"
    values: "{{ config.values() | list }}"
  ansible.builtin.assert:
    that:
      - config is mapping
      - config | length > 0
      # Every key is the variable that was asked for, verbatim
      - config.keys() | reject('match', '^_?[A-Z][A-Z0-9_]*$')
        | list | length == 0
      # Counts and sizes are integers, not the digits getconf printed
      - config['ARG_MAX'] is integer
      - config['ARG_MAX'] > 0
      - config['OPEN_MAX'] is integer
      - config['_POSIX_VERSION'] is integer
      # A search path is a path
      - config['PATH'] is string
      - config['PATH'] is match('^/')
      # Nothing was coerced on the way in, and a limit is never a flag
      - values | select('boolean') | list | length == 0
      - values | reject('integer') | reject('string') | reject('none')
        | list | length == 0
    fail_msg: 'o0_os.config is not the shape getconf answers: {{ config }}'

# A builtin is intrinsic to the shell binary, so it sits at the shell
# in o0_shells rather than on the path store entry for its file, and
# no home changes it.
- name: Assert the builtins /bin/sh answers with sit on the shell
  vars:
    shell: "{{ facts_all_reg['ansible_facts']['o0_shells']['/bin/sh'] }}"
    entry: "{{ facts_all_reg['ansible_facts']['o0_paths']['/bin/sh'] }}"
  ansible.builtin.assert:
    that:
      - shell['builtins'] is sequence
      - shell['builtins'] is not string
      - "'command' in shell['builtins']"
      - "'builtins' not in entry"
      - "'aliases' not in entry"
    fail_msg: 'o0_shells does not describe /bin/sh: {{ shell }}'

# An alias comes out of a rc file, so it belongs to a shell and a home
# together and sits under the home beside the env, the umask and the
# locale that same probe answered with.
- name: Assert an alias belongs to the pair that produced it
  vars:
    rows: >-
      {{ facts_all_reg['ansible_facts']['o0_shells']['/bin/sh']['homes']
         | dict2items | map(attribute='value') | list }}
  ansible.builtin.assert:
    that:
      - rows | length > 0
      - >-
        rows | selectattr('aliases', 'defined')
        | rejectattr('aliases', 'mapping') | list | length == 0
    fail_msg: 'a shell row reports aliases that are not a mapping'

# A command the sweep found is a fact about the file it found, filed
# at the path it resolved to and recorded as executable: command -v
# names a pathname the shell would run.
- name: Assert a resolved command is filed under the path it resolved to
  vars:
    paths: "{{ facts_all_reg['ansible_facts']['o0_paths'] }}"
    claimed: >-
      {{ paths | dict2items | selectattr('value', 'mapping')
         | selectattr('value.executable', 'defined') | list }}
  ansible.builtin.assert:
    that:
      - claimed | length > 0
      - claimed | rejectattr('value.executable') | list | length == 0
    fail_msg: >-
      no command resolved into the path store, or one resolved to a
      file the sweep will not call executable

# The processor that builds the compliance payload names its own
# facts. A bare name here is that payload published straight into the
# host's facts, which is what the o0_ census above forbids in general
# and these forbid by name. The two namespaces the path store
# absorbed are gone with them: a second copy of an answer is a copy
# that can drift from the first.
- name: Assert the compliance payload arrived under its o0_ names
  vars:
    gathered: "{{ facts_all_reg['ansible_facts'] }}"
  ansible.builtin.assert:
    that:
      - gathered['compliance'] is not defined
      - gathered['shells'] is not defined
      - gathered['paths'] is not defined
      - gathered['missing_commands'] is not defined
      - gathered['o0_missing'] is not defined
      - gathered['o0_os']['shells'] is not defined
      - gathered['o0_paths'] | length > 0
      - gathered['o0_paths'].keys() | reject('match', '^/')
        | list | length == 0
    fail_msg: 'the compliance payload is not under its o0_ names'

# A miss is confirmed absence at the paths it was looked for, and a
# null is how the store says a path does not exist. A host that has
# every utility it was asked for files no nulls, so the case only
# holds where there was a miss to file.
- name: Name the paths the gather filed as confirmed absent
  ansible.builtin.set_fact:
    facts_absent: >-
      {{ facts_all_reg['ansible_facts']['o0_paths'] | dict2items
         | selectattr('value', 'none') | map(attribute='key')
         | list }}

- name: Assert a miss files a null at a path, not a name in a list
  when: facts_absent | length > 0
  ansible.builtin.assert:
    that:
      - facts_absent | reject('match', '^/') | list | length == 0
    fail_msg: >-
      a confirmed absence is filed under something that is not a
      path: {{ facts_absent }}

- name: Assert the host is named as a hostname, not a string
  vars:
    hostname: >-
      {{ facts_all_reg['ansible_facts']['o0_network']['hostname'] }}
  ansible.builtin.assert:
    that:
      - hostname['short'] is string
      - hostname['short'] | length > 0
      # A short name is the part before the first dot, so it has none
      - "'.' not in hostname['short']"
      # A long name, where there is one, is the short one qualified
      - hostname['long'] is not defined or
        hostname['long'].startswith(hostname['short'] ~ '.')
    fail_msg: >-
      o0_network.hostname is not the shape uname composes:
      {{ hostname }}

- name: Assert the architecture is a property of the board
  vars:
    hardware: "{{ facts_all_reg['ansible_facts']['o0_hardware'] }}"
  ansible.builtin.assert:
    that:
      - hardware['baseboard']['architecture'] is string
      - hardware['baseboard']['architecture'] | length > 0
      # uname reads a machine, not a processor; an older target asked
      # for o0_hardware.cpu, which no producer has ever published
      - hardware['cpu'] is not defined
    fail_msg: >-
      o0_hardware does not carry the architecture uname reported:
      {{ hardware }}

- name: Assert the mounts of the host are keyed by mount point
  vars:
    mounts: >-
      {{ facts_all_reg['ansible_facts']['o0_storage']['mounts'] }}
    virtual_types:
      - tmpfs
      - devtmpfs
      - proc
      - sysfs
      - cgroup
      - cgroup2
      - devpts
    mounted_virtual: >-
      {{ mounts.values() | list | map(attribute='type', default='')
         | select('in', virtual_types) | list }}
  ansible.builtin.assert:
    that:
      - mounts is mapping
      - mounts | length > 0
      - mounts.keys() | reject('match', '^/') | list | length == 0
      # The mount point became the key, so it is no longer a field
      - mounts.values() | list | selectattr('mount', 'defined')
        | list | length == 0
      # A filesystem that stores nothing outliving a boot is left out
      # by the composition both producers share
      - mounted_virtual | length == 0
      - mounts['/'] is mapping
    fail_msg: 'o0_storage.mounts is not keyed by mount point'

# Capacity is what df alone knows, and the gather runs df beside
# mount so that the fact a gather publishes carries it too.
- name: Assert the root filesystem says how full it is
  vars:
    root: >-
      {{ facts_all_reg['ansible_facts']['o0_storage']['mounts']['/'] }}
  ansible.builtin.assert:
    that:
      - root['capacity']['total']['bytes'] is integer
      - root['capacity']['total']['bytes'] > 0
      - root['capacity']['total']['pretty'] is string
      - root['capacity']['used']['bytes'] is integer
      - root['capacity']['used']['percent'] is number
      - root['type'] is not defined or root['type'] is string
      - root['options'] is not defined or root['options'] is mapping
    fail_msg: 'the root filesystem has no capacity: {{ root }}'

# The pathconf class is asked at a pathname, so what it answers is a
# fact about the filesystem mounted there rather than about the host,
# and it lands on the mount. A filesystem that answered nothing
# carries no config at all, so only the ones that answered are read.
- name: Assert each mount carries what its own filesystem answered
  vars:
    mounts: >-
      {{ facts_all_reg['ansible_facts']['o0_storage']['mounts'] }}
    configured: >-
      {{ mounts | dict2items | selectattr('value.config', 'defined')
         | list }}
    values: >-
      {{ configured | map(attribute='value.config')
         | map('dict2items') | flatten | map(attribute='value')
         | list }}
    names: >-
      {{ configured | map(attribute='value.config')
         | map('list') | flatten | unique | list }}
  ansible.builtin.assert:
    that:
      - configured | length > 0
      # The root filesystem answers, and a name has a length
      - mounts['/']['config']['NAME_MAX'] is integer
      - mounts['/']['config']['NAME_MAX'] > 0
      # Only the filesystem class is asked here, never the host class
      # and never the terminal members of this one
      - names | reject('in', ['FILESIZEBITS', 'LINK_MAX', 'NAME_MAX',
        'PATH_MAX', 'PIPE_BUF', 'POSIX_ALLOC_SIZE_MIN', 'SYMLINK_MAX',
        '_POSIX_CHOWN_RESTRICTED', '_POSIX_NO_TRUNC'])
        | list | length == 0
      # A limit is a count, and a limit not imposed is null
      - values | select('boolean') | list | length == 0
      - values | reject('integer') | reject('none')
        | list | length == 0
    fail_msg: >-
      o0_storage.mounts does not carry the pathconf class its
      filesystems answered: {{ names }}

# What a file configures is a fact about that file, so the table lands
# at its own path in the one flat store, the bytes under content and
# the filesystems they name under config - the way /etc/shells lands
# the login shells it names. fstab_utils fills a field it cannot read
# with null, so every entry carries all six names whatever the line
# said.
- name: Assert the filesystems the host is configured to mount
  when: facts_has_fstab | bool
  vars:
    table: >-
      {{ facts_all_reg['ansible_facts']['o0_paths']['/etc/fstab'] }}
    entries: "{{ table['config'] }}"
  ansible.builtin.assert:
    that:
      - table['content'] is string
      - entries is sequence
      - entries is not mapping
      - entries is not string
      - entries | selectattr('source', 'defined')
        | selectattr('mount', 'defined')
        | selectattr('type', 'defined')
        | selectattr('options', 'defined')
        | selectattr('dump', 'defined')
        | selectattr('pass', 'defined')
        | list | length == entries | length
    fail_msg: >-
      o0_paths['/etc/fstab'] does not carry all six fields

- name: Assert a host with no /etc/fstab leaves the path unmentioned
  when: not facts_has_fstab | bool
  ansible.builtin.assert:
    that:
      - "'/etc/fstab' not in
         facts_all_reg['ansible_facts']['o0_paths']"
    fail_msg: >-
      o0_paths carries an /etc/fstab entry on a host with no fstab to
      read

# Live state and configuration are two facts. o0_storage holds what is
# mounted now; what the host is configured to mount is the config of
# the file that configures it.
- name: Assert the storage namespace holds live state alone
  vars:
    storage: "{{ facts_all_reg['ansible_facts']['o0_storage'] }}"
  ansible.builtin.assert:
    that:
      - >-
        storage.keys() | list | sort
        == ['evidence', 'mounts', 'origins']
      # The enumerations that named the mounts, and the interface each
      # filesystem was asked about itself through
      - storage['evidence']['commands']
        == ['df', 'getconf', 'mount']
    fail_msg: >-
      o0_storage carries something besides what is mounted and what
      named it: {{ storage.keys() | list }}

# Two subsets answer under o0_users and the merge keys both of them
# on the uid. The environment subset knows an identity by the uid it
# ran as, which /etc/passwd need not describe at all:
# macOS keeps its local users in a directory service and names only
# the system ones in the file. So a uid keys every entry, and the
# fields a passwd line composes are asserted of the entries that came
# from one.
- name: Assert users are keyed by the uid they carry
  vars:
    users: "{{ facts_all_reg['ansible_facts']['o0_users'] }}"
    described: >-
      {{ users | dict2items | selectattr('value.name', 'defined')
         | list }}
  ansible.builtin.assert:
    that:
      - users | length > 0
      - users | dict2items | map(attribute='key') | sort
        == users | dict2items | map(attribute='value.uid')
        | map('string') | sort
      - users | dict2items | map(attribute='value.uid')
        | reject('integer') | list | length == 0
      - described | length > 0
      # Every group a user holds is a gid. A user whose primary group
      # no longer exists holds none, which is why the assertion is
      # about what the list contains and not that it has anything.
      - described | map(attribute='value.groups')
        | flatten | reject('integer') | list | length == 0
    fail_msg: 'o0_users is not keyed by a stringified uid'

# A limit is a property of the session that answered and a mask is a
# product of the rc files a shell read, so neither is a field of a
# user. The mask lives on the shell home row that produced it and the
# limits are asked for by o0_o.posix.limits, where the session that
# answers is the session the play chose.
- name: Assert no user carries limits or a mask
  vars:
    users: "{{ facts_all_reg['ansible_facts']['o0_users'] }}"
    limited: >-
      {{ users | dict2items | selectattr('value.limits', 'defined')
         | map(attribute='key') | list }}
    masked: >-
      {{ users | dict2items | selectattr('value.umask', 'defined')
         | map(attribute='key') | list }}
  ansible.builtin.assert:
    that:
      - limited == []
      - masked == []
    fail_msg: >-
      a user entry carries limits or a mask: {{ limited }} and
      {{ masked }}

# An environment, and the locale derived from it, are what a login
# shell built out of the files it read, so both belong to the shell and
# the home that built them. Published on the user they named one
# identity - whichever one the gather happened to be handed - and
# called it that user's. o0_shells files them per pair, for every
# identity the gather could reach.
- name: Assert no user carries an environment or a locale
  vars:
    users: "{{ facts_all_reg['ansible_facts']['o0_users'] }}"
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    housed: >-
      {{ users | dict2items | selectattr('value.environment', 'defined')
         | map(attribute='key') | list }}
    localized: >-
      {{ users | dict2items | selectattr('value.locale', 'defined')
         | map(attribute='key') | list }}
    rows: >-
      {{ shells | dict2items | map(attribute='value')
         | selectattr('homes', 'defined') | map(attribute='homes')
         | map('dict2items') | flatten | map(attribute='value')
         | list }}
    envs: >-
      {{ rows | selectattr('env', 'defined') | map(attribute='env')
         | list }}
  ansible.builtin.assert:
    that:
      - housed == []
      - localized == []
      # And both are still asked, on the rows that built them
      - envs | length > 0
      - >-
        envs | selectattr('PATH', 'defined') | list | length
        == envs | length
      # A locale where the host has a locale utility to ask with
      - >-
        rows | selectattr('locale', 'defined')
        | rejectattr('locale', 'mapping') | list | length == 0
    fail_msg: >-
      the environment is filed in the wrong place: {{ housed }} and
      {{ localized }}

- name: Assert root is the user every POSIX host has
  vars:
    users: "{{ facts_all_reg['ansible_facts']['o0_users'] }}"
    host_groups: "{{ facts_all_reg['ansible_facts']['o0_groups'] }}"
    root: "{{ users['0'] }}"
  ansible.builtin.assert:
    that:
      - root['name'] == 'root'
      - root['uid'] is integer
      - root['uid'] == 0
      - root['gid'] is integer
      - root['home'] is string
      - root['shell'] is string
      - root['gid'] in root['groups']
      # A user's primary group counts them among its members
      - 0 in host_groups[root['gid'] | string]['members']
    fail_msg: 'o0_users["0"] is not root: {{ root }}'

- name: Assert groups are keyed by gid and count members in uids
  vars:
    host_groups: "{{ facts_all_reg['ansible_facts']['o0_groups'] }}"
  ansible.builtin.assert:
    that:
      - host_groups | length > 0
      - host_groups | dict2items | map(attribute='key') | sort
        == host_groups | dict2items | map(attribute='value.gid')
        | map('string') | sort
      # A member is a uid, never the name /etc/group wrote down
      - host_groups | dict2items | map(attribute='value.members')
        | flatten | reject('integer') | list | length == 0
    fail_msg: 'o0_groups is not keyed by a stringified gid'

# Every entry a passwd or group line composed names the concrete
# origins it came from: the paths that were read, and the commands
# that were run as the argv they were run with. The environment
# subset's entries are not composed from either, so they carry no
# evidence and are not asked for any - which is why the users below are
# the ones a name describes.
- name: Assert every composed entry names its origins, legally
  vars:
    users: >-
      {{ facts_all_reg['ansible_facts']['o0_users'] | dict2items
         | selectattr('value.name', 'defined')
         | map(attribute='value') | list }}
    host_groups: >-
      {{ facts_all_reg['ansible_facts']['o0_groups'].values() | list }}
    composed: "{{ users + host_groups }}"
    named_files: >-
      {{ composed | map(attribute='evidence.files') | flatten }}
    named_commands: >-
      {{ composed | map(attribute='evidence.commands')
         | flatten(levels=1) }}
  ansible.builtin.assert:
    that:
      - composed | length > 0
      # Both kinds are always there, because both are always
      # attempted: a kind that answered for nothing is empty rather
      # than left out to be inferred from a missing field
      - composed | rejectattr('evidence.files', 'defined')
        | list | length == 0
      - composed | rejectattr('evidence.commands', 'defined')
        | list | length == 0
      # And at least one origin across the two, so no entry is here
      # without something that named it
      - composed | selectattr('evidence.files', 'falsy')
        | selectattr('evidence.commands', 'falsy')
        | list | length == 0
      # A file origin is the path that was read, and these are the
      # two files a gather reads users out of
      - named_files | reject('in', ['/etc/passwd', '/etc/group'])
        | list | length == 0
      # A command origin is the name a command is known by, and one
      # command answers for both databases a gather enumerates - the
      # argv would only repeat what the entry itself says
      - named_commands | reject('string') | list | length == 0
      - named_commands | reject('in', ['getent']) | list | length == 0
    fail_msg: >-
      an entry of o0_users or o0_groups does not name its origins

# The probe the target ran and the probe the gather ran asked the same
# host the same question, so their answers have to agree. A host with
# no getent - macOS has none - composes from its files alone and says
# so with an empty commands, which is a correct gather rather than a
# degraded one.
- name: Assert the origins match what this host can actually resolve
  vars:
    users: "{{ facts_all_reg['ansible_facts']['o0_users'] }}"
    described: >-
      {{ users | dict2items | selectattr('value.name', 'defined')
         | map(attribute='value') | list }}
    resolved: >-
      {{ described | selectattr('evidence.commands', 'truthy') | list }}
  ansible.builtin.assert:
    that:
      - facts_has_getent | bool
        or resolved | length == 0
      # root is in the flat file on every POSIX host, so a host that
      # resolves at all resolves root, and both origins named it
      - not facts_has_getent | bool
        or users['0']['evidence']['files'] == ['/etc/passwd']
      - not facts_has_getent | bool
        or users['0']['evidence']['commands'] == ['getent']
    fail_msg: >-
      o0_users names a getent enumeration on a host that has none, or
      omits it on a host that has one: has_getent
      {{ facts_has_getent }}, resolved {{ resolved | length }}

# A home is a path and so is a shell, so both are entries of the flat
# path store rather than namespaces of their own, keyed by the path
# each of them is.
- name: Assert homes and shells are keyed by the path they are
  vars:
    paths: "{{ facts_all_reg['ansible_facts']['o0_paths'] }}"
    homes: >-
      {{ facts_all_reg['ansible_facts']['o0_users'] | dict2items
         | selectattr('value.home', 'defined')
         | map(attribute='value.home') | select('string')
         | unique | list }}
    shells: >-
      {{ facts_all_reg['ansible_facts']['o0_users'] | dict2items
         | selectattr('value.shell', 'defined')
         | map(attribute='value.shell') | select('string')
         | unique | list }}
  ansible.builtin.assert:
    that:
      # The home every user names is a key of the store, described as
      # the path it is and carrying nothing about who lives there:
      # that is the join the homes lookup makes, not a field
      - homes | length > 0
      - homes | reject('match', '^/') | list | length == 0
      - homes | reject('in', paths.keys() | list) | list | length == 0
      - >-
        homes | map('extract', paths) | select('mapping')
        | selectattr('residents', 'defined') | list | length == 0
      - >-
        homes | map('extract', paths) | select('mapping')
        | selectattr('tags', 'defined') | list | length == 0
      - facts_all_reg['ansible_facts']['o0_homes'] is not defined
      - facts_all_reg['ansible_facts']['o0_shell_files'] is not defined
      # A shell is a path too, so every shell a passwd line named is a
      # key of the same store, described as the file it is
      - shells | length > 0
      - shells | reject('in', paths.keys() | list) | list | length == 0
      - >-
        shells | map('extract', paths) | selectattr('type', 'defined')
        | list | length == shells | length
    fail_msg: >-
      the homes or the shells in o0_paths are not keyed by path

# Every login shell the host names is described, whether or not any
# passwd entry holds it. On a modern Linux nobody's shell field says
# /bin/sh and /bin/sh is still what the host means by the name, so a
# store that only described what users hold would leave out the one
# shell a consumer is most likely to be asking about.
- name: Assert every login shell the host names is described
  vars:
    paths: "{{ facts_all_reg['ansible_facts']['o0_paths'] }}"
    named: >-
      {{ paths['/etc/shells']['config'] | default([]) }}
    held: >-
      {{ facts_all_reg['ansible_facts']['o0_users'] | dict2items
         | selectattr('value.shell', 'defined')
         | map(attribute='value.shell') | select('string')
         | unique | list }}
    unheld: "{{ named | reject('in', held) | list }}"
    described: >-
      {{ named | select('in', paths.keys() | list)
         | map('extract', paths) | select('mapping') | list }}
  ansible.builtin.assert:
    that:
      - named | length > 0
      # There is at least one named shell nobody holds, or this
      # assertion is not testing what it says it tests
      - unheld | length > 0
      # Every one of them is a key of the store, described as the file
      # it is or filed null where the host names a shell it lacks
      - named | reject('in', paths.keys() | list) | list | length == 0
      - >-
        described | rejectattr('type', 'defined') | list | length == 0
      # A named shell that is a link says so and says what it points
      # at, rather than wearing its target's data
      - >-
        described | selectattr('type', 'eq', 'link')
        | rejectattr('target', 'defined') | list | length == 0
      - >-
        described | rejectattr('resolution', 'defined')
        | list | length == 0
      # and every step of every chain is a key of its own
      - >-
        described | map(attribute='resolution') | flatten | unique
        | reject('in', paths.keys() | list) | list | length == 0
    fail_msg: >-
      a login shell the host names is not described in o0_paths:
      named {{ named }}, unheld {{ unheld }}

# origins travels with evidence and answers the other half of the same
# question: evidence says what was consulted, origins says who did the
# consulting. Both accumulate, so the parser that composed a fact and
# the module that published it both belong in it.
- name: Assert every composed entry names the modules that composed it
  vars:
    paths: "{{ facts_all_reg['ansible_facts']['o0_paths'] }}"
    described: >-
      {{ paths | dict2items | selectattr('value', 'mapping') | list }}
    named: >-
      {{ described | map(attribute='value.origins') | flatten
         | unique | sort }}
  ansible.builtin.assert:
    that:
      - described | length > 0
      - >-
        described | rejectattr('value.origins', 'defined')
        | list | length == 0
      # Every entry names this gather, because this gather published
      # the store; the composers that described a path name themselves
      # beside it, so nothing here is a name from another collection
      - >-
        described | selectattr('value.origins', 'defined')
        | rejectattr('value.origins', 'contains', 'o0_o.posix.facts')
        | list | length == 0
      - >-
        named | reject('in', ['o0_o.posix.compliance',
        'o0_o.posix.facts', 'o0_o.posix.read'])
        | list | length == 0
      # The read that described a home named itself beside the gather
      - >-
        'o0_o.posix.read' in named
      # A path confirmed absent carries no fields, origins included
      - >-
        paths | dict2items | rejectattr('value', 'mapping')
        | rejectattr('value', 'none') | list | length == 0
    fail_msg: >-
      an o0_paths entry does not name what composed it: {{ named }}

# Origins spreads to every fact category at the level evidence sits:
# per entry where entries carry their own, section level where the
# section does.
- name: Assert every category names its producers where evidence sits
  vars:
    facts: "{{ facts_all_reg['ansible_facts'] }}"
    sections: >-
      {{ ['o0_os', 'o0_network', 'o0_hardware', 'o0_storage']
         | select('in', facts.keys() | list) | list }}
    # Not named users and groups: Ansible reserves groups for the
    # inventory group map, which is the whole reason every fact this
    # collection publishes takes the o0_ prefix
    user_entries: >-
      {{ facts['o0_users'] | dict2items | map(attribute='value') | list }}
    group_entries: >-
      {{ facts['o0_groups'] | dict2items | map(attribute='value') | list }}
    standards: >-
      {{ facts['o0_os']['compliance'] | dict2items
         | selectattr('value', 'mapping')
         | selectattr('value.evidence', 'defined')
         | map(attribute='value') | list }}
    probed: >-
      {{ facts['o0_shells'] | dict2items | map(attribute='value')
         | selectattr('evidence', 'defined') | list }}
  ansible.builtin.assert:
    that:
      # Section level: one gather produced the whole of it
      - sections | length > 0
      - >-
        sections | map('extract', facts)
        | rejectattr('origins', 'defined') | list | length == 0
      - >-
        sections | map('extract', facts)
        | rejectattr('origins', 'contains', 'o0_o.posix.facts')
        | list | length == 0
      # o0_os is answered for by several subsets, so it names each
      # parser that composed part of it beside this module
      - "'o0_o.posix.uname' in facts['o0_os']['origins']"
      - "'o0_o.posix.timezone' in facts['o0_os']['origins']"
      - "'o0_o.posix.mounts' in facts['o0_storage']['origins']"
      - "'o0_o.posix.uname' in facts['o0_hardware']['origins']"
      - "'o0_o.posix.uname' in facts['o0_network']['origins']"
      # Per entry: a user, a group and a standard each have their own
      # answer, so each carries its own record of who composed it
      - >-
        user_entries | rejectattr('origins', 'defined')
        | list | length == 0
      - >-
        group_entries | rejectattr('origins', 'defined')
        | list | length == 0
      # Every entry names this gather, which published all of them
      - >-
        user_entries
        | rejectattr('origins', 'contains', 'o0_o.posix.facts')
        | list | length == 0
      # An entry a passwd line described names the composer that read
      # it besides. The entry the environment subset keys on the
      # connecting uid is not one of those - macOS keeps its own users
      # in a directory service and names only the system ones in the
      # file - so it names this gather alone, which is the truth
      - >-
        user_entries | selectattr('name', 'defined')
        | rejectattr('origins', 'contains', 'o0_o.posix.users')
        | list | length == 0
      - >-
        group_entries
        | rejectattr('origins', 'contains', 'o0_o.posix.users')
        | list | length == 0
      - standards | length > 0
      - >-
        standards
        | rejectattr('origins', 'contains', 'o0_o.posix.compliance')
        | list | length == 0
      # The namespace's own verdict names its producer the same way
      - >-
        'o0_o.posix.compliance' in
        facts['o0_os']['compliance']['origins']
      # One record per shell, so the shell is where both sit
      - probed | length > 0
      - probed | rejectattr('origins', 'defined') | list | length == 0
      # And nothing claims a producer where nothing was consulted
      - "'origins' not in facts['o0_os']['kernel']"
    fail_msg: >-
      a fact category does not name its producers where its evidence
      sits: o0_os {{ facts['o0_os']['origins'] | default('MISSING') }}

# Provenance sits on the entry because it varies by entry: a home was
# described by a metadata read, a resolved command by command -v, and
# a file that was parsed by the cat that read it.
- name: Assert every composed entry names what was consulted for it
  vars:
    paths: "{{ facts_all_reg['ansible_facts']['o0_paths'] }}"
    described: >-
      {{ paths | dict2items | selectattr('value', 'mapping') | list }}
    consulted: >-
      {{ described | map(attribute='value.evidence.commands') | flatten
         | unique | sort }}
  ansible.builtin.assert:
    that:
      - described | length > 0
      - >-
        described | rejectattr('value.evidence', 'defined')
        | list | length == 0
      # A read runs every probe at the path itself and the bytes of
      # that path are the fact, so nothing here names a file
      - >-
        described | selectattr('value.evidence.files', 'defined')
        | list | length == 0
      # The commands are names rather than argv, so none of them is a
      # path or carries an option
      - consulted | length > 0
      - consulted | select('match', '[/ -]') | list | length == 0
      # A script probe names the commands it asks with. The shell that
      # read the script back is not the subject of a question about a
      # path, so nothing here names it
      - "'test' in consulted"
      - "'sh' not in consulted"
      # The file the login shells are named in was read with cat, and
      # the entry names that rather than naming itself
      - >-
        paths['/etc/shells']['evidence']['commands'] == ['cat']
    fail_msg: >-
      an o0_paths entry does not name what was consulted for it:
      {{ consulted }}

# A shell's configuration is code, so the only honest way to know what
# it does is to run it and watch. The pair decides the answer and
# neither half decides it alone, so o0_shells is keyed by shell and
# then by the home the shell was run out of.
- name: Assert the login shells are keyed and the idiom still reads
  vars:
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    named: >-
      {{ facts_all_reg['ansible_facts']['o0_paths']['/etc/shells']
         ['config'] | default([]) }}
  ansible.builtin.assert:
    that:
      - shells is mapping
      - shells | length > 0
      - shells.keys() | reject('match', '^/') | list | length == 0
      # The keys are the answer /etc/shells gave, which is what makes
      # user.shell in o0_shells a question a host can answer
      - named | reject('in', shells) | list | length == 0
      # A home is never a key beside a field of the shell: the homes
      # a shell was run out of live under a mapping of their own
      - >-
        shells | dict2items | map(attribute='value') | map('list')
        | flatten | unique
        | reject('in', ['binary', 'builtins', 'evidence', 'homes',
        'origins']) | list | length == 0
      - >-
        shells | dict2items | map(attribute='value')
        | selectattr('homes', 'defined') | map(attribute='homes')
        | map('list') | flatten | reject('match', '^/')
        | list | length == 0
      # A shell points at the file its name resolves to
      - >-
        shells | dict2items | map(attribute='value')
        | selectattr('binary', 'defined') | map(attribute='binary')
        | reject('match', '^/') | list | length == 0
    fail_msg: >-
      o0_shells is not keyed by shell path, or does not carry the
      shells /etc/shells named: {{ shells.keys() | list }}

# A row is where a probe happened, so a row is where the provenance
# sits: one shell observed out of two homes is two observations. A
# shell nothing was run for keeps its key and carries nothing, because
# there is no observation for evidence to support - the host's claim
# that it is a login shell is the /etc/shells entry of o0_paths.
- name: Assert every shell observation names the probe that made it
  vars:
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    probed: >-
      {{ shells | dict2items | map(attribute='value')
         | selectattr('evidence', 'defined') | list }}
    consulted: >-
      {{ probed | map(attribute='evidence.commands') | flatten
         | unique | sort }}
  ansible.builtin.assert:
    that:
      - probed | length > 0
      # A probe of what a shell's own configuration does is a question
      # about the shell, so the shell is named beside the four
      # questions the script puts to it
      - "'sh' in consulted"
      - "'env' in consulted"
      - "'umask' in consulted"
      - "'alias' in consulted"
      # A shell is run, not read, and it reads no variable the fact
      # does not already publish
      - >-
        probed | selectattr('evidence.files', 'defined')
        | list | length == 0
      - >-
        probed | selectattr('evidence.config', 'defined')
        | list | length == 0
    fail_msg: >-
      an o0_shells observation does not name what produced it:
      {{ consulted }}

# The system layer: the shell the task named, run out of the one home
# every POSIX host has and none of them has as a directory, so that
# ~/.profile fails to resolve identically everywhere.
- name: Assert the system layer was observed out of /dev/null
  vars:
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    config: "{{ shells['/bin/sh']['homes']['/dev/null'] }}"
  ansible.builtin.assert:
    that:
      - shells['/bin/sh']['homes']['/dev/null'] is mapping
      - config is mapping
      # What the login files made of the mask and the environment
      - config['umask'] is match('^0[0-7]{3}$')
      - config['env'] is mapping
      - config['env']['PATH'] is string
      # What describes the shell, not whoever ran the probe. A shell's
      # environment is where secrets live, and an identity variable
      # names the identity rather than the shell either way
      - >-
        config['env'].keys()
        | reject('in', ['IFS', 'LANG', 'LC_CTYPE', 'NLSPATH', 'PATH',
        'TERM', 'TZ']) | list | length == 0
      # IFS is almost never exported, so its presence is the finding
      # rather than the norm; OPTIND is iteration state, not config
      - "'OPTIND' not in config['env']"
      # The home is the key the row is filed under and the shell is
      # the entry it is filed in, so neither is a field of the row
      - "'HOME' not in config['env']"
      - "'SHELL' not in config['env']"
      # A locale where the host has a locale utility to ask
      - config['locale'] is not defined or config['locale'] is mapping
    fail_msg: >-
      the /bin/sh system layer was not observed out of /dev/null:
      {{ shells['/bin/sh'] | default({}) }}

# The user layer: what a person actually gets when they log in. A run
# that is root asks through a login su, which resets the environment
# and is not told which shell to run, so the row is filed by what its
# own login environment answered. A run that cannot drop asks the
# effective user's own pair instead, named from the passwd entry.
- name: Name whether this run could observe a login at all
  vars:
    entry: >-
      {{ facts_all_reg['ansible_facts']['o0_users'][facts_uid]
         | default({}) }}
  ansible.builtin.set_fact:
    facts_am_root: "{{ facts_uid == '0' }}"
    facts_own_shell: "{{ entry['shell'] | default('') }}"
    facts_own_home: "{{ entry['home'] | default('') }}"

# Proven live on casa (Arch, util-linux su); skipped where the run is
# not root, because su asks everybody else for a password on a
# terminal a probe does not have.
- name: Assert a root run observed a login out of a reset environment
  when: facts_am_root | bool
  vars:
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    rows: >-
      {{ shells | dict2items | selectattr('value.homes', 'defined')
         | map(attribute='value.homes') | map('dict2items') | flatten
         | list }}
    homes: "{{ rows | map(attribute='key') | list }}"
    envs: >-
      {{ rows | map(attribute='value')
         | selectattr('env', 'defined') | map(attribute='env') | list }}
  ansible.builtin.assert:
    that:
      # The system layer, forced to root whoever the play became
      - "'/dev/null' in homes"
      # And a login of a real home beside it, which is what a login su
      # buys: run bare under become there would be no such row
      - homes | reject('eq', '/dev/null') | list | length > 0
      # Every row is a login the shell itself built, so the locale the
      # login files set is there rather than sudo's silence
      - >-
        envs | selectattr('PATH', 'defined') | list | length
        == envs | length
      # Nothing identifies whoever the probe ran as
      - >-
        envs | map('list') | flatten | unique
        | select('in', ['HOME', 'LOGNAME', 'MAIL', 'PWD', 'SHELL',
        'USER']) | list | length == 0
    fail_msg: >-
      a root run did not observe a login out of a reset environment:
      homes {{ homes }}

- name: Assert a run that cannot drop still observed its own login
  when:
    - not facts_am_root | bool
    - facts_own_shell | length > 0
    - facts_own_home | length > 0
  vars:
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    config: >-
      {{ shells[facts_own_shell]['homes'][facts_own_home] }}
  ansible.builtin.assert:
    that:
      - shells[facts_own_shell]['homes'][facts_own_home] is mapping
      - config['umask'] is match('^0[0-7]{3}$')
      - "'HOME' not in config['env'] | default({})"
    fail_msg: >-
      the effective user's own shell and home were not observed:
      {{ facts_own_shell }} in {{ facts_own_home }}

# Only shells a producer was asked about are run. Nothing walks
# /etc/shells running each one on the chance somebody logs in with it.
# A shell that was run is one with a home under it: the builtins came
# from a sweep rather than a run, and every named shell carries a
# binary pointer whether or not anything ran it.
- name: Assert no shell was run that the gather was not asked about
  vars:
    shells: "{{ facts_all_reg['ansible_facts']['o0_shells'] }}"
    observed: >-
      {{ shells | dict2items | selectattr('value.homes', 'defined')
         | map(attribute='key') | list }}
    # A root run asks about root and about who connected, and their
    # passwd entries decide which shells run, so what may appear is
    # any shell a user in o0_users holds, plus the one the task named
    asked: >-
      {{ (['/bin/sh', facts_own_shell]
          + (facts_all_reg['ansible_facts']['o0_users'] | dict2items
             | selectattr('value.shell', 'defined')
             | map(attribute='value.shell') | select('string')
             | list)) | select | unique | list }}
  ansible.builtin.assert:
    that:
      - observed | length > 0
      - observed | reject('in', asked) | list | length == 0
    fail_msg: >-
      a shell was run that nothing named: {{ observed }} against
      {{ asked }}
