# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
bugfixes:
  - >-
    read - A directory that would not list came back as a directory
    with no children in it. The listing and the refusal both wrote
    children as an empty list, so a permission denial was reported as
    an empty directory and nothing downstream could tell them apart.
    An empty list is now the answer for a directory that holds
    nothing, and a directory whose listing was refused omits the key:
    a question that could not be asked is not an answer of none
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
