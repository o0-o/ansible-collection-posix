# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
minor_changes:
  - 'users - Added SSH key gathering functionality that collects authorized keys from ``~/.ssh/authorized_keys`` and ``~/.ssh/authorized_keys2`` files, keyed by SSH key data for easy lookups. Requires the ``o0_o.ssh`` collection for SSH key parsing.'
  - 'users - Added public key file discovery for all ``.pub`` files in user home directories, using only the first line of each file.'
  - 'users - SSH keys are only gathered when the user''s ``.ssh`` directory is readable, with graceful handling of permission issues and warnings for incomplete key information.'
  - 'users - Keys that appear in ``authorized_keys2`` are marked with an ``authorized_keys2`` field set to true.'
breaking_changes:
  - 'authorized_keys filter and utilities have been moved to the ``o0_o.ssh`` collection. Update your imports from ``ansible_collections.o0_o.posix.plugins.module_utils`` to ``ansible_collections.o0_o.ssh.plugins.module_utils`` and filter references from ``o0_o.posix.authorized_keys`` to ``o0_o.ssh.authorized_keys``.'
