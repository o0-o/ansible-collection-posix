# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
major_changes:
  - 'stat - New action plugin providing cross-platform file metadata gathering with automatic fallback to raw command parsing when Python is unavailable on target hosts.'
  - 'stat - Supports all standard stat features including permissions, ownership, timestamps, checksums (md5, sha1, sha224, sha256, sha384, sha512), MIME types, and extended attributes.'
  - 'stat - Full symlink support including broken symlink detection, configurable follow behavior, and lnk_source/lnk_target fields.'
  - 'stat - Includes ``_force_raw`` parameter for testing raw mode behavior and comprehensive integration tests with 523 tasks covering all features.'
  - 'dev_utils - New module_utils providing device number conversion utilities: ``device_from_major_minor()``, ``device_from_hex_major_minor()``, and ``device_value()`` for handling Linux and BSD/macOS device number formats.'
  - 'dev_utils - Implements Linux kernel formula for device number conversion supporting both legacy (major < 256) and modern device number formats.'
