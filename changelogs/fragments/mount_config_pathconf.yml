# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
minor_changes:
  - >-
    facts, mounts - Every mount carries a ``config``, what its own
    filesystem answers when ``getconf`` is asked the ``pathconf`` class
    at its mount point - ``NAME_MAX``, ``PATH_MAX``, ``LINK_MAX``,
    ``FILESIZEBITS``, ``PIPE_BUF``, ``SYMLINK_MAX``,
    ``POSIX_ALLOC_SIZE_MIN``, ``_POSIX_CHOWN_RESTRICTED`` and
    ``_POSIX_NO_TRUNC``. The class takes a pathname because the answers
    are the filesystem's rather than the host's: on macOS a name apfs
    keeps whole at 255 bytes is truncated to 31 by devfs, and a fact
    filed on the host could only have said one of those. The terminal
    members of the class - ``MAX_CANON``, ``MAX_INPUT`` and
    ``_POSIX_VDISABLE`` - are not asked, because they describe a tty
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
  - >-
    facts, mounts - The join is the composition both producers already
    share, so ``o0_storage.mounts`` and the module's ``mounts`` return
    attach the same configuration to the same entries. It is a second
    batch rather than part of the first: the class is asked at a
    pathname and the pathnames are the mount points the first commands
    answered with. One command per variable per mount point is many
    commands and few round trips - the run plugin splits a long batch
    into scripts on its own - and a mount whose filesystem answered
    nothing carries no ``config`` at all rather than an empty one,
    because being asked and having nothing to say is a different
    answer from not having been asked
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
