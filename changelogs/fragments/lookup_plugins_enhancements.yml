# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
minor_changes:
  - >-
    user lookup - Added ``host`` parameter for looking up user
    information from other hosts' facts via hostvars.
  - >-
    user lookup - Added ``default`` parameter to return fallback values
    when users are not found instead of raising errors.
  - >-
    user lookup - Enhanced to support username lookups in addition to
    UID lookups by searching both dict keys and name fields.
  - >-
    user lookup - Now always includes ``id`` field with numeric UID in
    returned data, ensuring consistent access to user ID regardless of
    lookup method.
  - >-
    user lookup - Changed from ``AnsibleError`` to
    ``AnsibleLookupError`` for more semantically correct exception
    handling.
  - >-
    group lookup - Added ``host`` parameter for looking up group
    information from other hosts' facts via hostvars.
  - >-
    group lookup - Added ``default`` parameter to return fallback
    values when groups are not found instead of raising errors.
  - >-
    group lookup - Enhanced to support group name lookups in addition
    to GID lookups by searching both dict keys and name fields.
  - >-
    group lookup - Now always includes ``id`` field with numeric GID in
    returned data, ensuring consistent access to group ID regardless of
    lookup method.
  - >-
    group lookup - Changed from ``AnsibleError`` to
    ``AnsibleLookupError`` for more semantically correct exception
    handling.
