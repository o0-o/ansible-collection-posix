# vim: ts=2:sw=2:sts=2:et:ft=yaml.ansible
# -*- mode: yaml; yaml-indent-offset: 2; indent-tabs-mode: nil; -*-
---
breaking_changes:
  - >-
    users, facts - ``tags`` retires from ``o0_paths``. It named what a
    path was to this collection - ``["posix", "home"]`` on a home,
    ``["posix", "shell"]`` on a shell - which is a role rather than a
    fact about the file, and the role is already stated where it
    belongs: ``o0_users[uid].home`` and ``o0_users[uid].shell`` say it
    of the user whose role it is, and a consumer joins through the
    path key. A store of facts about files carrying a second store's
    vocabulary is one that has to be kept in step with it. The field
    never appeared in a release, so it is removed inside the 2.0.0
    window
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
  - >-
    users, facts, homes lookup - ``residents`` retires as stored data.
    It listed the UIDs that call a path home, which is the join
    between ``o0_users`` and ``o0_paths`` written down a second time,
    and a stored join drifts from the field it was copied out of the
    moment either side changes. The ``o0_o.posix.homes`` lookup
    derives it live instead, from the ``home`` field ``o0_users``
    already carries, and answers it under ``residents`` beside the
    entry - so the audit view gains the field the store loses, and
    every user gets it whatever state their home is in
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
minor_changes:
  - >-
    users, facts, compliance, dmidecode, which - every fact this
    collection composes names the modules that composed it, in
    ``origins``: a sorted list of FQCNs. It travels with ``evidence``
    and answers the other half of the same question - evidence says
    what was consulted, origins says who did the consulting - so the
    two attach at the same granularity, by the same rule: origins goes
    wherever a composition has already said what it consulted. A
    mapping that says nothing was consulted claims no producer, and a
    path confirmed absent carries no fields and so names nobody
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
  - >-
    facts - per entry where entries carry their own evidence, section
    level where the section does. So ``o0_users[uid]``,
    ``o0_groups[gid]``, each ``o0_paths`` entry, each ``o0_shells``
    row and each compliance standard carry their own, because each has
    its own answer; and ``o0_os``, ``o0_network``, ``o0_hardware``,
    ``o0_storage`` and the compliance namespace's own verdict carry one
    for the whole of it, because one gather produced it
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
  - >-
    users, facts, compliance, dmidecode, which - ``origins`` and
    ``evidence`` are the two fields a later observation adds to rather
    than replaces. The parser that composed a fact and the module that
    published it both belong in it, so a gathered section routinely
    names two or three modules where a standalone module's names one:
    a gather's ``o0_os`` names ``o0_o.posix.uname`` for its kernel,
    ``o0_o.posix.timezone`` for its clock and ``o0_o.posix.facts`` for
    publishing all of it, and a home entry names the read that
    described it beside the module that filed it. A collection
    contributing to one of these facts names itself there rather than
    inventing a field of its own
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
  - >-
    homes lookup - an answer carries ``residents``, the UIDs that call
    the path home, on every state but ``unnamed``, which is a user who
    named no path for anyone to live at. Two users who spelled one
    home two ways get the same list, because it is keyed the way the
    store keys a path
    (https://github.com/o0-o/ansible-collection-posix/pull/XXX).
