namespace: o0_o
name: posix
version: 2.0.0
readme: README.md
authors:
  - oØ.o (@o0-o)
description: >
  POSIX-compatible Ansible plugins with raw fallback support for minimal
  systems.
license: GPL-3.0-or-later
tags:
  - collection
  - command
  - slurp
  - raw
  - template
  - posix
  - lineinfile
  - deduplication
  - facts
repository: https://github.com/o0-o/ansible-collection-posix
issues: https://github.com/o0-o/ansible-collection-posix/issues
dependencies:
  o0_o.core: ">=1.0.0"
  o0_o.utils: ">=3.1.0"
build_ignore:
  - .git
  - .github
  - .venv
  - .direnv
  - .wip
  - .pytest_cache
  - .mypy_cache
  - tests/output
  - __pycache__
